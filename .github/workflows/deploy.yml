name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/picture-quiz-app-ImAcb
      - claude/shakespeare-description-quiz-aSXAY
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout original quiz branch
        uses: actions/checkout@v4
        with:
          ref: claude/picture-quiz-app-ImAcb
          path: original

      - name: Checkout shakespeare branch
        uses: actions/checkout@v4
        with:
          ref: claude/shakespeare-description-quiz-aSXAY
          path: shakespeare

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build original
        working-directory: original
        run: |
          npm ci
          npm run build

      - name: Build shakespeare
        working-directory: shakespeare
        run: |
          npm ci
          npm run build

      - name: Combine builds
        run: |
          mkdir -p combined
          cp -r original/dist/. combined/
          mkdir -p combined/shakespeare
          cp -r shakespeare/dist/. combined/shakespeare/
          ls -R combined

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: combined

      - id: deployment
        uses: actions/deploy-pages@v4
