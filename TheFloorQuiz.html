n or cooked in a curry or salad.`,[`Garbanzo Beans`]),p(`Black Beans`,`Black turtle bean`,`Small, oval, jet-black beans — shiny and plump when cooked. Served in a bowl in stew, over rice, or in burritos.`,[`Black Beans`]),p(`Cottage Cheese`,`Cottage cheese`,`Small, lumpy white curds in a milky liquid — a loose, grainy white dairy product in a plastic tub. Very soft and mild.`),p(`Salmon`,`Salmon`,`A vibrant orange-pink fish fillet — fresh salmon is vivid reddish-orange, with visible white fat lines. Grilled shows brown char.`),p(`Steak`,`Steak`,`A thick cut of beef — seared to a browned or charred exterior with a pink or red interior. Classic cross-hatch grill marks.`),p(`Turkey`,`Turkey meat`,`Ground turkey in a package or browned in a pan — very pale, almost white, when raw; turns a uniform pale tan when cooked.`,[`Ground Turkey`]),p(`Peanut Butter`,`Peanut butter`,`A thick, creamy or chunky tan spread — smooth and glossy or textured with peanut pieces. Scooped in a jar with a knife.`),p(`Almonds`,`Almond`,`Smooth, oval, pale tan nuts — slightly pointed at one end, with a flat inner surface. Eaten whole, sliced, or as almond butter.`),p(`Quinoa`,`Quinoa`,`A cooked grain substitute — tiny, round, white-to-beige grains with a characteristic tiny spiral sprout visible. Fluffy and slightly nutty.`),p(`Hemp Seeds`,`Hemp seed`,`Tiny, beige-green seeds — very small, soft, and slightly nutty; sprinkled over smoothie bowls or salads in fine layers.`,[`Hemp`]),p(`Chia Seeds`,`Chia seed`,`Very tiny, dark grey-black seeds — almost like poppy seeds; when soaked, expand and develop a gel coating, turning into a pudding.`,[`Chia`]),p(`Pumpkin Seeds`,`Pumpkin seed`,`Flat, oval, dark green seeds — smooth with a hull removed, or white-hulled. Eaten roasted; visible as green flat ovals in a bowl.`,[`Pepitas`]),p(`Beef Jerky`,`Beef jerky`,`Dark brown, leathery strips of dried beef — chewy, fibrous, and very dark. Usually in a bag showing torn irregular strips.`,[`Jerky`]),p(`Collagen`,`Collagen`,`A fine white or clear powder in a tub or sachet — similar to protein powder but tasteless. Dissolves in coffee or smoothies.`),p(`Casein`,`Casein`,`A slow-digesting protein powder — similar appearance to whey protein, in a large tub with branding. Usually white or vanilla colour.`),p(`Soy Protein`,`Soy protein`,`A beige-white protein powder from soy beans — fine, smooth powder in a tub. Often positioned as a plant-based alternative to whey.`,[`Soy`]),p(`Protein Bar`,`Protein bar`,`A packaged bar with bold branding — chewy, dense, often chocolate-coated, with visible oat or nut pieces inside.`,[`Energy Bar`]),p(`Seitan`,`Seitan`,`A chewy, brown wheat-gluten product — looks like a spongy, fibrous piece of dark beige meat substitute. Often in strips or loaf form.`,[`Wheat Gluten`]),p(`Shrimp`,`Shrimp`,`Pink, curled crustaceans — raw shrimp are grey-translucent; cooked shrimp are vivid pink-orange and curl into a C or O shape.`),p(`Lobster`,`Lobster`,`A large bright red crustacean — vivid red all over when cooked, with large claws and a segmented tail. Usually on a plate with lemon.`)]},{id:`eating-competitions`,name:`Eating Competitions`,subject:`Culinary`,difficulty:`Medium`,description:`Name the food featured in an eating competition.`,items:[p(`Hot Dogs`,`Hot dog`,`Competitors cramming hot dogs and buns in their mouths as fast as possible — stacks of hot dogs on a table, yellow bibs, mustard everywhere.`,[`Hot Dog`]),p(`Hot Wings`,`Buffalo wing`,`Plates of deep orange-red chicken wings — glossy with hot sauce, sometimes with a small celery stick and blue cheese dip. Very spicy.`,[`Chicken Wings`,`Buffalo Wings`]),p(`Pie`,`Pie`,`A round pie in a tin — contestants eating pie without using hands. Faces plunging into the filling; cream or berry filling everywhere.`),p(`Pizza`,`Pizza`,`Giant 16-inch pizza slices or whole pies — competitors eating as fast as possible at a table stacked with pizza boxes.`),p(`Lobster`,`Lobster`,`Bright red boiled lobsters piled on a table — competitors cracking shells and pulling out meat, bibs around necks.`),p(`Oysters`,`Oyster`,`Buckets of fresh oysters on the half shell — competitors slurping them down by the dozen from a long table of oyster trays.`),p(`Crawfish`,`Crayfish`,`Bright orange crawfish piled high on newspaper or a tray — competitors peeling tails and heads as fast as possible.`,[`Crawdads`]),p(`Ribs`,`Barbecue`,`Racks of BBQ pork ribs — dark, smoky, sticky, and caramelised. Competitors gnawing racks and tossing clean bones.`,[`BBQ Ribs`]),p(`Tamales`,`Tamale`,`Corn husk-wrapped tamales in a pile — competitors unwrapping and eating the masa-filled parcels at speed.`,[`Tamal`]),p(`Burritos`,`Burrito`,`Large, foil-wrapped or bare flour tortilla burritos — bulging with rice, beans, and meat. Competitors taking huge bites.`),p(`Dumplings`,`Dumpling`,`Steamed or fried dumplings in bamboo baskets — plump, round, with pleated tops. Competitors eating one after another.`),p(`Cheese`,`Cheese`,`Blocks or wheels of cheese — competitors gnawing through large wedges or blocks of cheddar as fast as possible.`),p(`Jalapeños`,`Jalapeño`,`Bright green jalapeño peppers — whole, fresh, or pickled in a pile. Competitors eating as many as they can stand.`,[`Jalapeno`]),p(`Donuts`,`Doughnut`,`Glazed doughnuts on a table — competitors eating sugared rings as fast as possible, glaze and sugar everywhere.`,[`Doughnuts`]),p(`Ice Cream`,`Ice cream`,`Large buckets or pints of ice cream — competitors scooping and eating as fast as possible, often getting brain-freeze.`),p(`Pancakes`,`Pancake`,`Stacks of pancakes dripping in syrup — competitors cutting and eating massive towers of flapjacks against a timer.`),p(`Waffles`,`Waffle`,`Crispy golden waffles in a pile — competitors eating square after square of waffles with or without syrup.`),p(`Poutine`,`Poutine`,`A Canadian dish of fries, cheese curds, and gravy — competitors eating massive portions of the cheesy, gravy-soaked fries.`),p(`Tacos`,`Taco`,`Hard or soft shell tacos loaded with filling — competitors eating as many as possible in a set time, shells cracking.`),p(`Sushi`,`Sushi`,`Rows of nigiri or maki rolls — competitors eating orderly rows of sushi pieces as fast as they can reach them.`),p(`Ramen`,`Ramen`,`Deep bowls of ramen noodle soup — competitors slurping noodles with chopsticks in races for time or quantity.`),p(`Bratwurst`,`Bratwurst`,`Thick German sausages in buns — competitors eating the large, slightly greasy brats as fast as possible.`),p(`Crab Cakes`,`Crab cake`,`Golden-fried crab patties — competitors eating round, crispy-edged crab cakes from a pile as fast as possible.`,[`Crab Cake`]),p(`Corn on the Cob`,`Corn on the cob`,`Yellow corn on the cob — competitors gnawing rows of kernels from the cob at speed, ending with stripped pale cobs.`,[`Corn`]),p(`Mozzarella Sticks`,`Mozzarella sticks`,`Golden fried cheese sticks — crispy breadcrumb casing with stretchy white mozzarella pulling out. Competitors eating stick after stick.`,[`Mozzarella Stick`]),p(`Chili`,`Chili con carne`,`A dark red-brown stew with beans and beef — competitors eating bowls of hearty chili as fast as possible.`,[`Chili Con Carne`]),p(`Grilled Cheese`,`Grilled cheese sandwich`,`Golden, buttery toasted sandwiches with melted cheese — competitors eating triangles or squares of grilled cheese.`),p(`Matzo Ball Soup`,`Matzo ball`,`Large, fluffy dumpling balls in clear broth — competitors eating the baseball-sized matzo balls floating in golden chicken soup.`,[`Matzo Ball`]),p(`Spicy Noodles`,`Noodle`,`Bowls of very spicy noodles (Korean fire noodles) — vivid red sauce coating the noodles; competitors sweating and crying.`,[`Noodles`]),p(`Watermelon`,`Watermelon`,`Half or quarter rounds of bright red watermelon — competitors burying their faces into the red flesh without using hands.`)]},{id:`wine-making`,name:`Wine Making`,subject:`Culinary`,difficulty:`Hard`,description:`Name the country, fruit, technique or item associated with making wine.`,items:[p(`Cabernet Sauvignon`,`Cabernet Sauvignon`,`A deep red wine in a glass — very dark ruby to purple-red colour. Or a bottle with Cab Sav on the label, usually from Napa or Bordeaux.`,[`Cab Sav`,`Cab Sauvignon`]),p(`Chardonnay`,`Chardonnay`,`A pale, straw-yellow white wine in a glass — from near-clear to golden. Or a green Burgundy-shaped bottle with the name on the label.`),p(`Pinot Noir`,`Pinot noir`,`A lighter, translucent ruby-red wine in a globe-shaped glass — lighter and less opaque than Cab Sav. Or a wide-shouldered Burgundy bottle.`),p(`Merlot`,`Merlot`,`A medium ruby-red wine — slightly softer and more transparent than Cabernet. Or a bottle, often from Bordeaux or California.`),p(`Sauvignon Blanc`,`Sauvignon blanc`,`A crisp, pale yellow-green white wine in a glass — very light and slightly tart. Often in a tall Bordeaux-style bottle.`),p(`Riesling`,`Riesling`,`A very pale, nearly clear to light straw white wine — often in a tall narrow Germanic bottle with colourful ornate label.`),p(`Prosecco`,`Prosecco`,`A sparkling Italian white wine — pale gold with fine rising bubbles. Often in a tall, slender flute glass or in a Prosecco-labelled bottle.`),p(`Champagne`,`Champagne (wine)`,`A sparkling wine in a flute glass with fine bubbles rising — or a green Champagne bottle with a wire-caged mushroom cork. Foam overflows.`),p(`Bordeaux`,`Bordeaux wine`,`The Bordeaux wine region in France — rows of vines, classic chateaux, or bottles labelled Margaux, Pomerol, or Saint-Émilion.`,[`Bordeaux Wine`]),p(`Burgundy`,`Burgundy wine`,`The Burgundy region of France — vineyard-covered hillsides, or the distinctive wide-shouldered Burgundy bottle shape.`,[`Burgundy Wine`]),p(`Chianti`,`Chianti`,`A Tuscan red in a straw-covered Fiasco bottle or a regular bottle labelled Chianti — deep ruby red wine from central Italy.`,[`Chianti Wine`]),p(`Napa Valley`,`Napa Valley wine`,`The famous California wine valley — rolling hills of perfectly tended vines, wooden winery signs, and sunshine-drenched hillside estates.`,[`Napa Valley`]),p(`Tuscany`,`Tuscany`,`Rolling Tuscan hills planted with orderly rows of grapevines — cypress trees on hilltops, terracotta farmhouses, and golden light.`),p(`Rioja`,`Rioja wine`,`A red wine from northern Spain — dark red in a glass with an ornate Spanish label. Often aged in oak, giving a vanilla and spice flavour.`,[`Rioja`]),p(`Barossa Valley`,`Barossa Valley`,`An Australian wine region in South Australia — red soil, old gnarled Shiraz vines, and stone winery buildings under blue skies.`,[`Barossa`]),p(`Fermentation`,`Fermentation`,`Wine bubbling in a large tank or barrel — carbon dioxide bubbles rising through grape juice as yeast converts sugars to alcohol.`),p(`Crushing and Pressing`,`Crusher-destemmer`,`A mechanical crusher-destemmer machine — grapes fed in the top, stems removed, juice extracted. Or feet stomping grapes in a wooden vat.`,[`Crusher Destemmer`]),p(`Oak Barrel`,`Oak barrel`,`A curved wooden barrel with metal hoops — stacked in a cool, dim wine cave. The golden-brown oak imparts vanilla and spice to the wine.`,[`Barrel Aging`]),p(`Wine Press`,`Wine press`,`A large mechanical or traditional wooden press — baskets of grapes crushed under a plate to extract juice into a tray below.`),p(`Hydrometer`,`Hydrometer`,`A long, slender glass tube that floats in liquid to measure density — calibrated to measure the sugar content of grape must.`),p(`Sommelier`,`Sommelier`,`A wine professional in a restaurant — often in a dark suit, presenting a bottle label to a guest, or using a tastevin cup.`),p(`Decanter`,`Decanter`,`A wide-bottomed glass vessel shaped like a swan or carafe — wine poured into it to breathe, sediment settled at the bottom.`),p(`Cork`,`Cork (material)`,`A cylindrical plug of natural bark — brown, slightly compressed, sometimes stamped with the winery name. Removed with a corkscrew.`,[`Wine Cork`]),p(`Vineyard`,`Vineyard`,`Rows of grapevines on a hillside — orderly trained vines on wires, with clusters of grapes hanging between green leaf canopies.`),p(`Harvest`,`Harvest (wine)`,`Workers picking grapes in a vineyard — clusters of ripe black or green grapes cut with shears and dropped into large bins.`,[`Grape Harvest`]),p(`Tannins`,`Tannin`,`A concept demonstrated by the puckering sensation of a dry red wine — often illustrated with a glass of deep red wine or dried grape skins.`,[`Tannin`]),p(`Sediment`,`Sediment`,`Dark, grainy residue at the bottom of a wine bottle or decanter — visible as a dark film or small flakes in older red wines.`),p(`Malolactic Fermentation`,`Malolactic fermentation`,`A secondary fermentation process — shown as wine in a tank with a winemaker testing it, or as a diagram of malic acid converting to lactic acid.`,[`Malolactic`]),p(`Stemware`,`Wine glass`,`An elegant wine glass — a wide bowl or narrow flute on a long thin stem. Crystal-clear glass with a wine pour catching the light.`,[`Wine Glass`]),p(`Terroir`,`Terroir`,`The concept of a wine's land and soil — shown as a winemaker crouching to touch rocky soil in a vineyard, illustrating how place affects flavour.`)]},{id:`famous-vehicles`,name:`Famous Vehicles`,subject:`DIY & Machines`,difficulty:`Easy`,description:`Identify the iconic ride from TV, movies, or real life.`,items:[p(`Batmobile`,`Batmobile`,`A sleek, angular black car with large tail fins, a jet-engine exhaust at the rear, and low-slung profile. Various versions but always jet-black and menacing.`),p(`DeLorean`,`DeLorean DMC-12`,`A low, wedge-shaped sports car with distinctive stainless steel unpainted body panels and gull-wing doors that open upward. Silver metallic appearance.`,[`DMC-12`,`Back to the Future Car`]),p(`General Lee`,`General Lee (car)`,`An orange 1969 Dodge Charger with the Confederate flag painted on the roof and '01' on the doors. White roll cage visible through windows; the Dukes of Hazzard car.`,[`Dukes of Hazzard Car`]),p(`KITT`,`KITT (Knight Rider)`,`A black 1982 Pontiac Trans Am with a red LED scanner bar sweeping back and forth across the front grille. Sleek and sporty with a very distinctive red light.`,[`Knight Rider Car`]),p(`Ecto-1`,`Ecto-1`,`A white 1959 Cadillac ambulance/hearse with bulky equipment racks on the roof and 'Ghostbusters' markings. Long, finned rear end with red tail lights.`,[`Ghostbusters Car`]),p(`Mystery Machine`,`Mystery Machine`,`A teal-green van with orange and yellow flower-power design elements on the side. White roof; associated with the Scooby-Doo gang.`,[`Scooby-Doo Van`]),p(`Herbie`,`Herbie the Love Bug`,`A white 1963 Volkswagen Beetle with racing stripes of blue and red running over the hood, roof, and engine lid, with the number '53' on the doors.`,[`Love Bug`]),p(`Chitty Chitty Bang Bang`,`Chitty Chitty Bang Bang`,`An Edwardian-era racing car with bright red bodywork, gold trim, huge exposed engine parts, and wide sweep-style wings that unfold. Very ornate and fantastical.`),p(`Starsky & Hutch Gran Torino`,`Ford Gran Torino`,`A red 1976 Ford Gran Torino with a distinctive large white vector stripe running from the door back along the lower flanks. Very 1970s muscle-car styling.`,[`Gran Torino`]),p(`A-Team Van`,`A-Team`,`A black GMC G-Series van with a distinctive red stripe along the side and a red stripe on the roof. Often seen skidding or launching over obstacles.`,[`A Team Van`]),p(`Mach 5`,`Mach 5 (Speed Racer)`,`A sleek white Formula-style racing car with a large red 'M' on the hood and various gadget buttons on the steering wheel. Very retro cartoon racing-car style.`,[`Speed Racer Car`]),p(`Lightning McQueen`,`Lightning McQueen`,`An animated red stock car with the number '95' and a lightning bolt pattern. Large eyes visible through the windshield; wide grin on the front bumper.`),p(`Mater`,`Mater (Cars)`,`A rusted, battered light-brown tow truck from the Pixar film Cars — large towing hook at the rear, a wide gap-toothed grin on the front bumper, mismatched eyes.`,[`Tow Mater`]),p(`Optimus Prime`,`Optimus Prime`,`A red-and-blue semi-truck cab that transforms into a heroic robot — in vehicle mode, it's a blue-cabbed, red-bonneted Peterbilt-style truck.`),p(`Millennium Falcon`,`Millennium Falcon`,`Han Solo's ship — a flat, circular saucer shape (like a hamburger) with a distinctive front prong fork and an asymmetric cockpit on the right side. Grey and battle-worn.`),p(`USS Enterprise`,`USS Enterprise (NCC-1701)`,`Star Trek's iconic ship — a saucer-shaped primary hull connected by a neck to a cylindrical engineering hull, with two cylindrical nacelles trailing behind.`,[`Enterprise`]),p(`TARDIS`,`TARDIS`,`A tall, dark-blue British police call box — a rectangular box with small windows at top, a rotating light on the roof, and 'Police Public Call Box' sign. Very distinctive.`,[`Doctor Who Phone Box`]),p(`Apollo 11`,`Apollo 11`,`The Saturn V rocket — a massive white rocket with 'USA' and the NASA logo on the side, three main stages, and the command module on top. Very tall, cylindrical.`),p(`Spirit of St. Louis`,`Spirit of St. Louis`,`A single-engine monoplane with the engine in front and a single wing. Silver-coloured fuselage; no front window (Lindbergh navigated by periscope).`,[`Lindbergh Plane`]),p(`Titanic`,`RMS Titanic`,`A massive ocean liner with four large funnels (three emit smoke; one is a dummy), a black hull, and white upper decks. The bow is pointed and elegant.`,[`RMS Titanic`]),p(`Oscar Mayer Wienermobile`,`Wienermobile`,`A giant hot dog-shaped vehicle on wheels — literally a fibreglass hot dog bun with a sausage on top, on a regular vehicle chassis. About the length of a city bus.`,[`Wienermobile`]),p(`Air Force One`,`Air Force One`,`The U.S. president's blue-and-white Boeing 747 — lower half is blue, upper half is white, with 'United States of America' along the fuselage and the American flag on the tail.`),p(`Pope Mobile`,`Popemobile`,`A white vehicle — usually a modified SUV or truck — with a clear enclosed glass or plexiglass box on the back where the Pope stands and waves to crowds.`,[`Popemobile`]),p(`James Bond Aston Martin`,`Aston Martin DB5`,`A silver 1964 Aston Martin DB5 — sleek, elegant British sports car with a long hood, chrome grille, and classic 1960s fastback styling. The quintessential Bond car.`,[`DB5`,`Bond Car`]),p(`Dukes of Hazzard`,`The Dukes of Hazzard`,`A TV show featuring the orange General Lee Dodge Charger with the Confederate flag on the roof. Bo and Luke Duke drive it; often launches over things.`),p(`Knightrider`,`Knight Rider`,`A 1980s TV show featuring KITT — a black Pontiac Trans Am with a red LED scanner on the front. Michael Knight drives it; the car can talk.`),p(`Bandit Trans Am`,`Pontiac Firebird Trans Am`,`A black 1977 Pontiac Firebird Trans Am with a large gold screaming chicken (phoenix) decal on the hood — from 'Smokey and the Bandit'.`,[`Trans Am`]),p(`Christine`,`Christine (novel)`,`A 1958 Plymouth Fury — a large, long, rounded American car in vivid red and white with chrome trim. Seen in the Stephen King film glowing and repairing itself.`,[`Christine Car`]),p(`Mad Max Interceptor`,`Mad Max`,`A heavily modified black 1973 Ford Falcon XB GT — long hood with a supercharger sticking up, roll cage, side exhausts, and battered battle-worn bodywork.`,[`Interceptor`]),p(`Bluesmobile`,`Blues Brothers`,`A black-and-white 1974 Dodge Monaco police car — originally an Illinois state police car, driven at high speed by Jake and Elwood Blues.`,[`Blues Brothers Car`])]},{id:`weaponry`,name:`Weaponry`,subject:`DIY & Machines`,difficulty:`Medium`,description:`Name these items that are used in combat.`,items:[p(`Katana`,`Katana`,`A long, slightly curved Japanese sword with a single-edged blade — very slender, with a long wrapped handle (tsuka) and a circular guard (tsuba).`),p(`Longbow`,`English longbow`,`A very tall bow made of a single stave of yew — about 6 feet tall (as tall as a person), with a simple string. Used at Agincourt and Crécy.`,[`Bow and Arrow`,`Bow`]),p(`Crossbow`,`Crossbow`,`A horizontal bow mounted on a rifle-like stock — the bowstring is drawn back and held by a trigger mechanism. Fires bolts rather than arrows.`),p(`Trebuchet`,`Trebuchet`,`A large medieval siege engine — a long wooden arm with a heavy counterweight at the back end and a sling at the front. Hurls boulders at castle walls.`),p(`Cannon`,`Cannon`,`A large iron or bronze cylindrical barrel on a wheeled wooden carriage — fires heavy stone or iron balls using gunpowder. Classic naval or battlefield artillery.`),p(`Musket`,`Musket`,`A long-barrelled smoothbore firearm — a very long wooden stock with an iron barrel, fired from the shoulder. Used by soldiers from the 16th to 19th centuries.`),p(`Flintlock Pistol`,`Flintlock pistol`,`A single-shot pistol with a flintlock mechanism — a curved wooden grip, a short barrel, and a frizzen with a flint that strikes a spark to fire.`),p(`Bayonet`,`Bayonet`,`A blade attached to the muzzle end of a rifle — a long, narrow knife blade that locks onto the barrel, turning the rifle into a spear.`),p(`Grenade`,`Grenade`,`A small, pineapple-textured spherical iron bomb with a pull ring and safety pin — the segmented surface helps it fragment on detonation.`),p(`Bazooka`,`Bazooka`,`A shoulder-fired rocket launcher — a long open tube carried on the shoulder, with a warhead loaded in the back and a trigger mechanism.`),p(`AK-47`,`AK-47`,`The iconic Soviet assault rifle — curved banana-shaped magazine, distinctive wooden stock, and the characteristic skeletal outline. Very recognizable silhouette.`),p(`M16`,`M16 rifle`,`An American military assault rifle — all-black polymer and metal construction with a carrying handle above the barrel and a straight stock.`),p(`Sniper Rifle`,`Sniper rifle`,`A long-range precision rifle with a large telescopic scope on top — usually with a bipod at the front to stabilise it while prone.`),p(`Nunchaku`,`Nunchaku`,`Two short wooden or metal sticks connected by a short chain or rope — swung and caught in rapid spinning patterns.`,[`Nunchucks`]),p(`Shuriken`,`Shuriken`,`A flat, multi-pointed throwing star of polished steel — usually 4–8 equally spaced points radiating from the centre. Small enough to palm.`,[`Throwing Stars`,`Ninja Stars`]),p(`Spear`,`Spear`,`A long wooden shaft tipped with a sharpened metal or stone point — the shaft is smooth wood, the head is triangular or leaf-shaped iron.`),p(`Halberd`,`Halberd`,`A polearm with a combination axe blade, hook, and spear point on a long wooden shaft — used by Swiss and German foot soldiers in the late Middle Ages.`),p(`Broadsword`,`Arming sword`,`A double-edged medieval sword — a wide, straight blade with a simple cross-guard, pommel, and leather-wrapped grip. About 3 feet long.`,[`Sword`]),p(`Mace`,`Mace (bludgeon)`,`A heavy blunt weapon with a metal flanged or spiked head on a short handle — the head has projecting ridges or ball-and-spikes design.`,[`Morning Star`]),p(`Flail`,`Flail (weapon)`,`A handle connected by a chain to a spiked metal ball — the weight swings freely on the chain, providing extra momentum in strikes.`,[`Ball and Chain`]),p(`Ballista`,`Ballista`,`A large ancient crossbow-like siege weapon — mounted on a frame, it fires large bolts or stones using twisted sinew for power. Roman artillery.`),p(`Tomahawk`,`Tomahawk (axe)`,`A Native American or military hatchet — a small axe with a wooden or metal handle and a single-bladed or spike-backed head.`,[`Hatchet`,`War Axe`]),p(`Scimitar`,`Scimitar`,`A curved Middle Eastern sword — a broad, dramatically curved blade with the edge on the outside of the curve. Often with an ornate handle.`),p(`Whip`,`Bullwhip`,`A long, braided leather whip — coiled or cracked in the air. Tapers from a thick handle to a fine cracker tip. Indiana Jones's weapon.`,[`Bullwhip`]),p(`Slingshot`,`Slingshot`,`A Y-shaped wooden or metal fork with an elastic band stretched between the two prongs — a stone or marble is placed in the centre band and launched.`),p(`Boomerang`,`Boomerang`,`A flat, curved, aerofoil-shaped piece of wood — roughly V-shaped or banana-shaped, designed to return when thrown correctly. Australian Aboriginal weapon.`),p(`Trident`,`Trident (weapon)`,`A three-pronged spear — a long shaft tipped with three parallel pointed prongs. Associated with Poseidon/Neptune and Roman gladiators.`),p(`Lance`,`Lance (weapon)`,`A long cavalry spear — a thick wooden shaft tapering to a point, held under the arm by a mounted knight charging at high speed.`),p(`Dagger`,`Dagger`,`A short, double-edged knife — a pointed blade with a symmetrical crossguard, designed for close-combat stabbing. Often decorative.`)]},{id:`safety-gear`,name:`Safety Gear`,subject:`DIY & Machines`,difficulty:`Easy`,description:`Name this item used for protection at work or in everyday life.`,items:[p(`Hard Hat`,`Hard hat`,`A dome-shaped rigid plastic helmet in yellow, orange, or white — worn on construction sites to protect from falling objects. Smooth rounded shell.`,[`Helmet`,`Construction Helmet`]),p(`Safety Goggles`,`Safety goggles`,`Clear or tinted polycarbonate goggles that wrap around the eyes — an elastic strap holds them, and vents on the sides prevent fogging.`,[`Goggles`,`Safety Glasses`]),p(`High-Visibility Vest`,`High-visibility clothing`,`A fluorescent yellow-green or orange vest with wide reflective silver stripes across the chest and back — worn over regular clothes on roadsides.`,[`Safety Vest`,`Hi-Vis Vest`]),p(`Steel-Toed Boots`,`Steel-toe boot`,`Heavy, thick-soled work boots with a reinforced toe cap — often black or brown leather, with a very thick sole and ankle support.`,[`Steel Toe Boots`,`Work Boots`]),p(`Ear Muffs`,`Ear muff`,`Padded cups covering both ears, connected by a headband — usually bright yellow, orange, or black; worn in loud industrial environments.`,[`Ear Protection`,`Hearing Protection`]),p(`Face Shield`,`Face shield`,`A clear plastic visor that pivots down from a headband to cover the entire face — used in grinding, welding, or medical procedures.`),p(`Respirator`,`Respirator`,`A fitted mask covering the nose and mouth with filter cartridges on each side — grey or black rubber mask with twin cylindrical filters.`,[`N95 Mask`,`Gas Mask`]),p(`Welding Helmet`,`Welding helmet`,`A large, boxy shield that covers the entire face and head — dark flip-down visor, often black. Protects from sparks and intense UV light.`,[`Welding Mask`]),p(`Gloves`,`Gloves`,`Thick leather or synthetic work gloves — usually tan or grey, with reinforced palms. Protect hands from cuts, heat, and abrasion.`,[`Work Gloves`,`Safety Gloves`]),p(`Knee Pads`,`Knee pad`,`Cushioned pads strapped around the knees — usually black foam or plastic shells on elastic straps. Used by construction workers and gardeners.`,[`Knee Guards`]),p(`Safety Harness`,`Safety harness`,`A full-body harness of thick nylon straps that criss-cross over the chest, shoulders, and legs — a D-ring at the back clips to a lifeline.`,[`Harness`]),p(`Fire Extinguisher`,`Fire extinguisher`,`A red cylinder with a black hose and pressure gauge — a metal pin and handle at the top. Mounted on walls in brackets throughout buildings.`),p(`Smoke Detector`,`Smoke detector`,`A white or cream round disc mounted on a ceiling — a small blinking LED and a mesh grille. Makes a piercing alarm when smoke is detected.`,[`Smoke Alarm`]),p(`Carbon Monoxide Detector`,`Carbon monoxide detector`,`A white wall-outlet plug-in device with a digital display showing CO levels — similar to a smoke detector but slightly different shape.`,[`CO Detector`]),p(`First Aid Kit`,`First aid kit`,`A red or white box with a cross symbol — contains bandages, antiseptic, gauze, and scissors. Mounted on a wall or in a portable bag.`),p(`AED Defibrillator`,`Automated external defibrillator`,`A bright yellow or green box with a heart and lightning bolt symbol — contains two pads that attach to the chest to deliver an electric shock.`,[`AED`,`Defibrillator`]),p(`Life Jacket`,`Life jacket`,`A bulky foam-filled vest in orange or red — worn over the torso with straps, designed to keep a person's head above water when unconscious.`,[`Life Vest`,`PFD`]),p(`Bicycle Helmet`,`Bicycle helmet`,`A smooth, round-dome helmet with ventilation slots — in bright colours with a chin strap. Lighter and more airy than a construction hard hat.`,[`Bike Helmet`]),p(`Seatbelt`,`Seat belt`,`A wide nylon strap worn diagonally across the chest and lap — buckles with a metal tang into a plastic and metal receptacle at the seat.`,[`Seat Belt`]),p(`Airbag`,`Airbag`,`A deployed white fabric bag inflated from the steering wheel — in crash test demonstrations, a round white cushion explodes outward toward the driver.`),p(`Carabiner`,`Carabiner`,`A metal loop with a spring-loaded gate — oval or pear-shaped, usually aluminium. Clips to harnesses, ropes, and anchors in climbing.`),p(`Safety Pin`,`Safety pin`,`A pin with a clasp that covers the point — a curved metal wire pin with a coiled spring at one end and a cover clasp at the other.`),p(`Reflective Tape`,`Retroreflective sheeting`,`Shiny silver or fluorescent tape that bounces light back at its source — seen as bright strips on safety vests and vehicles.`,[`Reflective Strip`]),p(`HAZMAT Suit`,`Hazmat suit`,`A full-body sealed suit in bright yellow or white — covers the wearer completely including the face behind a respirator or full-face mask.`,[`Hazmat Suit`]),p(`Lab Coat`,`Lab coat`,`A long, loose white coat reaching the knees — lapel collar, button-front, large pockets. Worn by scientists, doctors, and laboratory technicians.`,[`Laboratory Coat`]),p(`Rubber Gloves`,`Rubber glove`,`Stretchy, bright yellow or blue rubber gloves — protect hands from chemicals and water. Longer than regular gloves, covering the wrist.`,[`Latex Gloves`]),p(`Kneeling Pad`,`Gardening kneeler`,`A thick foam pad in a bright colour — used to kneel on in the garden to protect knees from hard soil.`,[`Garden Kneeler`]),p(`Back Brace`,`Back brace`,`A stiff fabric and velcro belt worn around the lower back and waist — beige or black with multiple velcro straps. Supports the lumbar spine.`,[`Back Support Belt`]),p(`Wrist Guard`,`Wrist guard`,`A padded brace with a hard plastic or metal insert along the palm — straps around the wrist and hand to prevent hyperextension.`,[`Wrist Brace`]),p(`Ankle Brace`,`Ankle brace`,`A supportive brace fitted around the ankle — fabric or neoprene with rigid plastic sides and laces or velcro straps to prevent rolling.`)]},{id:`home-improvements`,name:`Home Improvements`,subject:`DIY & Machines`,difficulty:`Easy`,description:`Name the item or room that is commonly improved or upgraded in a home renovation.`,items:[p(`Kitchen Remodel`,`Kitchen remodeling`,`A newly renovated kitchen — white or grey shaker cabinets, a kitchen island, quartz or granite countertops, and stainless steel appliances.`,[`Kitchen Renovation`]),p(`Bathroom Remodel`,`Bathroom remodeling`,`A renovated bathroom — a walk-in shower with glass doors, floating vanity, subway tile, and a freestanding soaking tub.`,[`Bathroom Renovation`]),p(`Hardwood Floors`,`Hardwood floor`,`Wide-plank oak or maple floors — warm brown tones with visible wood grain, a smooth surface, and sharp edge details at room perimeter.`,[`Hardwood Flooring`]),p(`Crown Molding`,`Crown molding`,`A decorative curved moulding installed at the junction of wall and ceiling — a white plaster or MDF S-curve profile that adds an elegant finish.`),p(`Backsplash`,`Backsplash`,`Tiles on the wall behind a kitchen stove or sink — often white subway tiles in a brick pattern with grey grout between them.`),p(`Granite Countertops`,`Granite`,`A kitchen counter of polished granite — swirling patterns of grey, black, and white with natural mineral flecks. Very hard and shiny.`,[`Granite Counters`]),p(`Quartz Countertops`,`Quartz`,`An engineered stone kitchen counter — uniform, clean surface with very consistent subtle patterning. Often bright white or greige.`,[`Quartz Counters`]),p(`Subway Tile`,`Subway tile`,`Rectangular white ceramic tiles arranged in a running brick pattern — clean white gloss face with grey grout lines. Kitchen or bathroom classic.`),p(`Barn Door`,`Sliding barn door`,`A large plank wood door that slides along a black wall-mounted track — rustic, usually in dark stained wood with exposed black hardware.`,[`Sliding Door`]),p(`Shiplap`,`Shiplap`,`Horizontal overlapping boards used as wall cladding — white-painted wood planks with a narrow horizontal shadow gap between each board.`),p(`Open Floor Plan`,`Open plan`,`A large combined living-dining-kitchen space with no dividing walls — the kitchen island flows into the dining table and on to the sofa area.`,[`Open Concept`]),p(`Deck`,`Deck (building)`,`A raised outdoor wooden platform attached to the back of a house — planks laid horizontally, with a railing, steps down to the yard.`),p(`Patio`,`Patio`,`An outdoor ground-level hardscaped area — flagstone, pavers, or concrete with outdoor furniture, plants, and a BBQ grill.`),p(`Pergola`,`Pergola`,`An outdoor structure with an open slatted roof — wooden or metal posts support horizontal beams overhead, creating partial shade.`),p(`Mudroom`,`Mudroom`,`An entry room near the garage or back door — coat hooks on the wall, built-in cubbies for shoes, a bench for sitting, and a tiled floor.`),p(`Walk-in Closet`,`Closet`,`A dedicated closet room — clothes hung on two-tier rods on three sides, built-in shelves, a centre island with drawers, and good lighting.`,[`Walk In Closet`]),p(`Jacuzzi`,`Hot tub`,`A large bathtub or outdoor tub with water jets — whirlpool bubbles visible; often white or cream, set into a tiled surround.`,[`Hot Tub`,`Whirlpool`]),p(`Skylight`,`Skylight`,`A window installed in the ceiling or roof — a square or rectangular pane of glass allowing natural light to pour directly down from above.`),p(`Smart Home`,`Home automation`,`Smart home technology — a touchscreen control panel on a wall, or a phone app showing icons for lights, thermostat, and security cameras.`,[`Home Automation`]),p(`Fireplace`,`Fireplace`,`A hearth with a mantel — brick or stone surround, a grate inside with logs burning, flames visible. Tile or marble surround options.`),p(`Built-in Bookshelves`,`Built-in bookcase`,`Floor-to-ceiling shelves framed into an alcove — painted white with books and decorative objects arranged neatly on each shelf.`,[`Built-in Shelves`]),p(`Wainscoting`,`Wainscoting`,`Decorative wood panelling on the lower portion of a wall — white painted tongue-and-groove or raised panel boards covering roughly the lower third.`),p(`Recessed Lighting`,`Recessed light`,`Round, flush-mounted light fixtures set into the ceiling — a small circular trim ring sits at ceiling level, light shines straight down.`,[`Can Lights`]),p(`French Doors`,`French doors`,`A pair of glass-paned doors that open from the centre — multiple glass panes in a white or black frame, opening outward to a deck or garden.`),p(`Bay Window`,`Bay window`,`A window that projects outward from the wall in a three-panel configuration — creates a shallow alcove with a view on three sides.`),p(`Attic Conversion`,`Attic`,`A finished attic bedroom or study — exposed roof beams, a Velux skylight in the slanted ceiling, and built-in eave storage.`,[`Loft Conversion`]),p(`Basement Finishing`,`Basement renovation`,`A finished basement living space — drywall over concrete walls, drop ceiling with recessed lights, carpet or LVP flooring, and a small bar.`,[`Finished Basement`]),p(`Garage Conversion`,`Garage conversion`,`A garage turned into living space — the garage door is replaced with a wall and windows, inside is now a finished room with insulation.`,[`Garage Apartment`]),p(`Solar Panels`,`Solar panel`,`Dark rectangular photovoltaic panels installed in rows on a rooftop — dark blue-black monocrystalline cells in an aluminium frame.`,[`Solar Panels`]),p(`Insulation`,`Building insulation`,`Pink or yellow fibreglass batts — fuzzy, soft strips of insulation visible between wall studs or in an attic floor. Very fluffy.`,[`Home Insulation`])]},{id:`dmv`,name:`DMV`,subject:`DIY & Machines`,difficulty:`Easy`,description:`Name the item you might see at the DMV.`,items:[p(`Driver's License`,`Driver's license`,`A laminated card-sized ID — a small rectangle with the person's photo, signature, name, address, and a holographic security overlay.`,[`License`]),p(`License Plate`,`Vehicle registration plate`,`A rectangular metal plate on the front or back of a vehicle — coloured with the state name and numbers/letters, often with a sticker in a corner.`,[`Number Plate`]),p(`Registration Sticker`,`Vehicle registration`,`A small coloured adhesive sticker in the corner of a license plate — shows the year and month of vehicle registration expiry.`,[`Registration Tag`]),p(`Number Ticket`,`Queue ticket`,`A small paper ticket pulled from a dispenser in a DMV waiting room — a number printed in large font. 'Now serving number 47...'`,[`Take a Number`]),p(`Waiting Room`,`Waiting room`,`Rows of plastic chairs bolted to the floor under fluorescent lights — a number board on the wall, people looking at their phones. Classic DMV scene.`,[`Waiting Area`]),p(`Eye Chart`,`Eye chart`,`The Snellen chart — rows of black letters on a white chart, getting smaller with each row. Used to test visual acuity at the DMV.`,[`Snellen Chart`]),p(`Traffic Signs`,`Traffic sign`,`A collection of road signs — red octagonal stop signs, yellow diamond warning signs, green rectangular distance signs. All with specific shapes.`,[`Road Signs`]),p(`Road Test`,`Driving test`,`A DMV examiner in the passenger seat with a clipboard — the applicant driving while being observed and graded on their performance.`,[`Behind the Wheel`]),p(`Parallel Parking`,`Parallel parking`,`A car carefully backing between two other parked cars — tight manoeuvring between cones or vehicles on a road or practice course.`),p(`Three-Point Turn`,`Three-point turn`,`A car doing a K-turn — turning around in a narrow space by going forward, reversing, then forward again to reverse direction.`,[`K Turn`]),p(`Stop Sign`,`Stop sign`,`A red octagonal sign with 'STOP' in white letters — the iconic 8-sided shape is universally recognized on a white post.`),p(`Yield Sign`,`Yield sign`,`A white downward-pointing triangle with a red border and 'YIELD' in red letters — gives right of way to cross traffic.`),p(`Speed Limit Sign`,`Speed limit`,`A white rectangular sign with a black border and 'SPEED LIMIT' above a large number — standard US highway speed sign format.`,[`Speed Limit`]),p(`Vehicle Title`,`Title (property)`,`An official government document for a car — a formal paper with the VIN, owner name, lienholders, and official stamps.`,[`Car Title`]),p(`Proof of Insurance`,`Vehicle insurance`,`A wallet-sized insurance card or PDF printout — shows the vehicle, policy number, insurance company, and coverage dates.`,[`Insurance Card`]),p(`Social Security Card`,`Social Security number`,`A blue-and-white government card — 'Social Security' across the top, the 9-digit number in the middle, the holder's name below.`,[`SSN Card`]),p(`Birth Certificate`,`Birth certificate`,`An official government document with an embossed seal — shows the person's full name, date and place of birth, and parents' names.`),p(`Passport`,`Passport`,`A small navy-blue or burgundy booklet — the US eagle emblem on the cover; inside, a photo ID page and empty visa stamp pages.`),p(`Vision Test`,`Visual acuity`,`A machine or chart test at the DMV — reading letters through a viewfinder or covering one eye to read the Snellen chart on the wall.`,[`Vision Exam`]),p(`Written Exam`,`Written test`,`A computer kiosk or paper test at the DMV — multiple choice questions about road signs, right of way, and traffic laws.`,[`Knowledge Test`]),p(`Real ID`,`REAL ID Act`,`A state driver's license with a gold or black star in the upper corner — the star indicates the ID meets federal REAL ID standards.`,[`Real ID Card`]),p(`Car Registration`,`Motor vehicle registration`,`A small document or wallet card — shows the vehicle's registration number, VIN, owner name, and registration expiry date.`,[`Car Tags`]),p(`Emissions Test`,`Smog check`,`A technician connecting a probe to a car's exhaust pipe — measures tailpipe emissions to ensure the vehicle meets environmental standards.`,[`Smog Test`]),p(`VIN Number`,`Vehicle identification number`,`A 17-character alphanumeric code on a small plate visible through the windshield — stamped on the dashboard near the lower left corner.`,[`VIN`]),p(`Odometer`,`Odometer`,`The mileage display on a car dashboard — a row of digits showing the total miles driven. Can be analogue rolling numbers or digital.`),p(`Brake Test`,`Braking`,`A road test manoeuvre — the examiner may ask the driver to brake firmly; the car stops quickly and in a straight line.`,[`Brake Check`]),p(`Disabled Placard`,`Disabled parking permit`,`A blue hanging placard for a rear-view mirror — a white wheelchair symbol on blue background, with an expiry date. Allows disabled parking.`,[`Handicap Placard`]),p(`ID Card`,`Identification card`,`A non-driver state ID — the same size and format as a driver's license but for people who don't drive. Usually labelled 'Identification Only'.`,[`State ID`]),p(`Form`,`Form (document)`,`A DMV form — an official multi-page government document with boxes to fill in name, address, vehicle information, and signatures.`,[`DMV Form`]),p(`Kiosk`,`Self-service kiosk`,`A freestanding touchscreen terminal at the DMV — pay fees, renew registrations, or print documents without waiting for a clerk.`,[`DMV Kiosk`])]},{id:`athleisure`,name:`Athleisure`,subject:`Fashion`,difficulty:`Medium`,description:`Name the brand of athletic clothing or shoe you see.`,items:[p(`Nike`,`Nike, Inc.`,`The swoosh logo on athletic gear — a curved check-mark on a running shoe, sports jersey, or training gear. Very clean, minimal branding.`),p(`Adidas`,`Adidas`,`The three parallel stripes on shoes, shorts, or jackets — three diagonal black or white stripes along the side of the product. Or the trefoil logo.`),p(`Under Armour`,`Under Armour`,`The UA logo — an interlocked stylised U and A in silver or black on athletic shirts, shorts, and running shoes.`),p(`Lululemon`,`Lululemon Athletica`,`The omega-like circular logo on yoga pants, sports bras, or technical running gear — high-quality, sleek athletic wear for women and men.`,[`Lulu Lemon`]),p(`New Balance`,`New Balance`,`The large NB logo on the side of a running shoe — the wordmark or a stylized NB in various colourways. Also known for the number series (990, etc.).`),p(`Puma`,`Puma (brand)`,`The leaping puma cat logo on athletic shoes, tracksuits, and training gear — a sleek black or coloured pouncing cat silhouette.`),p(`Reebok`,`Reebok`,`The Reebok vector logo — a graphic mark on training shoes and gym apparel. Classic 1980s aerobics shoe brand; now more streetwear-focused.`),p(`Asics`,`ASICS`,`The ASICS logo — two diagonal stripes and the wordmark on running shoes; associated with a high-mileage, performance-focused runner aesthetic.`),p(`Brooks`,`Brooks Running`,`The Brooks logo on running shoes — a blue and white logo typically on neutral or motion-control road running shoes.`,[`Brooks Running`]),p(`On Running`,`On (company)`,`The distinctive CloudTec sole — multiple hollow rubber pods on the bottom of the shoe creating a unique pod-like outsole. Swiss brand.`,[`On Running`,`On Shoes`]),p(`Hoka`,`Hoka (shoe company)`,`Maximalist cushioning — a very thick, oversized midsole making the shoe look almost cartoonish. Often in bright colour-blocked uppers.`,[`Hoka One One`]),p(`Saucony`,`Saucony`,`The Saucony logo on running shoes — an S-wave and wordmark on performance road running shoes, known for guides and rides.`),p(`Mizuno`,`Mizuno Corporation`,`The blue Mizuno wave logo — a stylised wave graphic on running shoes and athletic gear, often in blue and white colourways.`),p(`Champion`,`Champion (sportswear)`,`The Champion 'C' logo on hoodies, reverse-weave sweatshirts, and shorts — often embroidered in the chest of a grey or coloured garment.`),p(`Gymshark`,`Gymshark`,`The Gymshark shark-fin logo on form-fitting gym wear — seamless leggings, sports bras, and t-shirts in bold or dark colours for gym workouts.`),p(`Fabletics`,`Fabletics`,`Kate Hudson's activewear brand — high-waisted leggings and matching sports bras in colourful prints or solid bold colours.`),p(`Athleta`,`Athleta`,`A GAP-owned women's activewear brand — yoga pants, leggings, and athletic tops in earth tones and natural colours.`),p(`Vuori`,`Vuori (clothing)`,`A California athleisure brand — very soft performance shorts and shirts in muted, earthy tones. Known for versatility from gym to casual.`),p(`Allbirds`,`Allbirds`,`Minimalist wool or eucalyptus sneakers — simple, clean silhouette with no visible logo on the outside. Very plain, soft-looking shoe.`),p(`The North Face`,`The North Face`,`The half-dome logo — a white hemisphere with the brand name in a semicircle on jackets, fleeces, and backpacks. Outdoor and streetwear.`),p(`Patagonia`,`Patagonia (clothing)`,`The mountain-outline logo on fleeces, puffer jackets, and outdoor gear — often with a muted, earthy, or solid colour palette.`),p(`Columbia Sportswear`,`Columbia Sportswear`,`The Columbia gem logo on hiking and rain gear — often in blues and greys for outdoor performance jackets and hiking shoes.`),p(`Arc'teryx`,`Arc'teryx`,`The bird skeleton logo on high-performance technical outdoor gear — minimalist, very clean, often in dark grey or bright accent colours.`),p(`Salomon`,`Salomon (company)`,`Bold, colourful trail running shoes with a distinctive crossed-lace or quicklace system — often in vivid orange, blue, and black patterns.`),p(`Merrell`,`Merrell (company)`,`The Merrell logo on hiking boots and trail shoes — rugged, durable, with a nature-inspired aesthetic in brown and green tones.`),p(`Converse`,`Converse (shoe company)`,`The Chuck Taylor All Star — a canvas high-top or low-top shoe with a circular 'All Star' ankle patch logo and rubber toecap.`),p(`Vans`,`Vans (company)`,`The Vans 'Off the Wall' side-stripe — a diagonal stripe on a canvas skate shoe (Old Skool); or the distinctive checkerboard slip-on pattern.`),p(`Sketchers`,`Skechers`,`The Skechers wordmark on chunky, comfort-focused athletic shoes — often in chunky dad-shoe silhouettes or memory foam walking shoes.`,[`Skechers`]),p(`Fila`,`FILA`,`The large FILA wordmark in a distinctive red, navy, and white colour scheme on classic tennis shoes and 1980s-inspired tracksuits.`),p(`Kappa`,`Kappa (sportswear)`,`The Kappa logo — two figures sitting back-to-back (the Omini silhouette) on Italian sports apparel, tracksuits, and football kits.`)]},{id:`estate-sale`,name:`Estate Sale`,subject:`Fashion`,difficulty:`Medium`,description:`Name the item you could find while at an estate sale.`,items:[p(`Vintage Record Player`,`Phonograph`,`A turntable record player — a spinning platter with a tonearm and needle, often in a wooden cabinet with a hinged lid. A vinyl record spins on the felt mat.`,[`Record Player`,`Turntable`]),p(`Rotary Phone`,`Rotary dial telephone`,`A heavy black telephone with a circular dial — finger holes numbered 0–9 in a ring that turns clockwise to dial. Curly phone cord attached.`,[`Rotary Dial`]),p(`Typewriter`,`Typewriter`,`A mechanical writing machine — rows of round keys with letters, a carriage return lever, and a platen roll. Ink ribbon visible between keys.`),p(`Grandfather Clock`,`Grandfather clock`,`A tall, free-standing clock in a narrow wooden case — a pendulum swings behind a glass door, with a clock face at head height.`),p(`Antique Armoire`,`Armoire`,`A large, free-standing wooden wardrobe with two doors — ornate carved details, ball feet, and a mirror panel on one or both doors.`),p(`Tiffany Lamp`,`Tiffany lamp`,`A table lamp with a stained glass shade — mosaic-like coloured glass pieces (often dragonfly or floral patterns) in lead came, glowing warmly.`),p(`Depression Glass`,`Depression glass`,`Thin, translucent pressed glass in pink, green, or amber — a delicate, lacy pattern pressed into the glass. Plates, bowls, and pitchers.`),p(`Bakelite Jewelry`,`Bakelite`,`Early plastic jewellery in bold, opaque colours — chunky bracelets, pins, or buttons in swirling reds, yellows, and greens. Matte, slightly waxy surface.`,[`Bakelite Bracelet`]),p(`Quilt`,`Quilt`,`A patchwork textile of coloured fabric squares stitched together — geometric or floral patterns in a spectrum of fabrics, with quilting stitches throughout.`),p(`Cast Iron Skillet`,`Cast-iron cookware`,`A heavy, thick, black frying pan — perfectly smooth, very dark (seasoned), with a long handle and a helper handle. Could be decades old.`,[`Cast Iron Pan`]),p(`Pearl Necklace`,`Pearl necklace`,`A string of cream-white orbs — smooth, lustrous spheres with a soft iridescent sheen, graduated or matched in size, with a gold or silver clasp.`),p(`Fur Coat`,`Fur clothing`,`A full-length or three-quarter coat of dense animal fur — soft, fluffy, and thick, usually in mink brown, white, or black. Lined with satin inside.`,[`Mink Coat`]),p(`Vintage Hat Box`,`Hat box`,`A round cardboard box with a lift-off lid — decorative paper or fabric covering, often with a fabric loop handle at the top.`,[`Hat Box`]),p(`Cameo Brooch`,`Cameo (jewelry)`,`A raised profile portrait on a flat background — usually a pale ivory or white figure on a contrasting dark or coloured oval ground, in a gold frame.`,[`Cameo`]),p(`Sterling Silver`,`Sterling silver`,`Silverware or jewellery with a hallmark stamp — bright, reflective silver metal tableware, candelabras, or jewellery. The '925' stamp indicates sterling.`),p(`China Cabinet`,`Cupboard`,`A glass-fronted wooden cabinet displaying fine china — shelves visible through glass doors hold decorative plates, teacups, and crystal.`,[`China Hutch`]),p(`Vanity Set`,`Vanity (furniture)`,`A dressing table set — a hand mirror, hairbrush, and comb in silver, ivory, or tortoiseshell with matching decorative handles.`,[`Vanity Mirror`]),p(`Hatpin`,`Hatpin`,`A very long metal pin — up to 12 inches, with a decorative head (pearl, jet, or enamelled) used to secure a large hat to an upswept hairstyle.`),p(`Milk Glass`,`Milk glass`,`Opaque white glass — very dense, pure white, with a matte or glossy finish. Used for vases, bowls, and compotes with a soft rounded form.`),p(`Fire King Dishes`,`Fire-King`,`Milky white or Jade-ite green glass bakeware by Anchor Hocking — the Fire King logo moulded into the bottom. Casserole dishes and mixing bowls.`,[`Fire King`]),p(`Pyrex Dishes`,`Pyrex`,`Clear or patterned glass bakeware — a clear borosilicate casserole dish or colourful vintage Pyrex in the 'Spring Blossom' or 'Butterfly Gold' patterns.`,[`Pyrex Bowl`]),p(`Slide Rule`,`Slide rule`,`A flat or circular calculation tool — two logarithmically scaled rulers that slide relative to each other; tan or cream plastic with many numbered scales.`),p(`8-Track Tape`,`8-track tape`,`A large, square cartridge about the size of a paperback — tan or black plastic with a metal clip and reel visible through a small window.`,[`8 Track`]),p(`Betamax`,`Betamax`,`A Sony video cassette slightly smaller than VHS — silver and black casing with a centre loading reel. The format that lost to VHS.`),p(`VHS Tape`,`VHS`,`A large rectangular black video cassette — two reels visible through the window, a clear plastic door over the magnetic tape. Could hold 2 hours of video.`),p(`Sewing Box`,`Sewing box`,`A lidded wooden or tin box with compartments inside — spools of thread in many colours, needles, scissors, thimbles, and buttons organized inside.`),p(`Cuckoo Clock`,`Cuckoo clock`,`A carved wooden clock shaped like a Swiss chalet — a small bird on a spring pops out through a door on the hour, a pendulum swings below.`),p(`Accordion`,`Accordion`,`A box-shaped squeeze instrument with a keyboard on one side and bass buttons on the other — bellows fold in and out while keys are pressed.`),p(`Rocking Chair`,`Rocking chair`,`A wooden chair with two curved runners instead of legs — rocks back and forth on the runners. Often on a porch; can be a simple or ornate style.`),p(`Vintage Lunchbox`,`Lunchbox`,`A metal or hard plastic lunchbox with a carrying handle — decorated with TV characters (Dukes of Hazzard, Star Wars) from its era. Matching thermos inside.`,[`Lunch Box`])]},{id:`facial-hair`,name:`Facial Hair (Close-Up)`,subject:`Fashion`,difficulty:`Hard`,description:`You'll see close-ups of famous people sporting iconic facial hair. Name them.`,items:[p(`Abraham Lincoln`,`Abraham Lincoln`,`Tall thin man with a prominent chin beard (no moustache) — a narrow vertical strip of dark beard running along the jaw and chin only. Gaunt angular face, deep-set eyes.`),p(`Albert Einstein`,`Albert Einstein`,`Wild white moustache that fans out on both sides, paired with extremely unkempt Einstein-style white hair. Warm, expressive brown eyes with a bushy brow.`),p(`Salvador Dalí`,`Salvador Dalí`,`One of the most iconic moustaches in history — very thin, waxed to a sharp upward point on each side, like a clock hand stuck at 10 and 2.`,[`Salvador Dali`]),p(`Charles Darwin`,`Charles Darwin`,`In old age: a long, full, bushy white beard that covers the entire lower face and neck. Bald head with a few wisps; heavy brows framing deep-set serious eyes.`),p(`Karl Marx`,`Karl Marx`,`Massive full grey-white beard and very long bushy hair — an enormous full beard and wild mane that merges together. Intense dark eyes above the dense facial hair.`),p(`Fidel Castro`,`Fidel Castro`,`Long full grey-to-white beard with a thick, well-defined moustache. Often in military olive-green uniform and cap. The beard is closely associated with his revolutionary image.`),p(`Che Guevara`,`Che Guevara`,`Sparse, patchy black beard and moustache on a young angular face, usually wearing a black beret with a star emblem. The iconic black-and-white photo shows this clearly.`),p(`Tom Selleck`,`Tom Selleck`,`The gold standard of Hollywood moustaches — thick, full, and neatly groomed dark moustache, wide above the upper lip. Accompanied by a square jaw and confident grin.`),p(`Burt Reynolds`,`Burt Reynolds`,`Classic 1970s-80s thick dark brown moustache — full, wide, and defined. Paired with his wavy dark hair and roguish smile in films like 'Smokey and the Bandit'.`),p(`Sam Elliott`,`Sam Elliott`,`One of Hollywood's most iconic moustaches — long, full, drooping dark-grey moustache that extends past the corners of the mouth. Deep voice, long grey hair, cowboy looks.`),p(`Nick Offerman`,`Nick Offerman`,`A medium-thick walrus-style brown moustache that droops at the corners, paired with a warm smile. Associated with his Parks and Rec character Ron Swanson.`),p(`Ron Swanson`,`Ron Swanson`,`Parks & Rec character played by Nick Offerman — thick brown walrus moustache, strong jaw, and an expression of stoic indifference. Always in business casual attire.`,[`Ron Swanson Mustache`]),p(`Movember`,`Movember`,`A man growing a moustache for charity during November — usually shown at the beginning (clean-shaven) and end (full moustache growth) of the month. Varied moustache styles.`),p(`Hulk Hogan`,`Hulk Hogan`,`A long, straight, horseshoe moustache — extends down well past the chin in two long parallel lines. Bleached blond. Also features his trademark bandana and handlebar bleached hair.`),p(`Jeff Bridges`,`Jeff Bridges`,`The Dude's messy, soft, scruffy beard — medium length, slightly unkempt, grey-brown. Often paired with long shaggy hair and a relaxed expression.`),p(`Brad Pitt`,`Brad Pitt`,`Varies by role — often seen with short scruffy stubble or a short well-groomed beard. Handsome angular face; the beard is always neat even when appearing casual.`),p(`George Clooney`,`George Clooney`,`Silver-grey designer stubble or short cropped beard — very well-groomed salt-and-pepper scruff that complements his silver hair. Dignified and distinguished.`),p(`Zach Galifianakis`,`Zach Galifianakis`,`A large, full, slightly wild dark-brown beard — thick and rounded, covering most of the lower face. Paired with long-ish tousled hair and a deadpan expression.`),p(`ZZ Top`,`ZZ Top`,`Two members (Billy Gibbons and Dusty Hill) have extraordinarily long, full beards that extend well below the chest — sometimes nearly to the waist. Dark and very thick.`),p(`James Harden`,`James Harden`,`NBA star with an enormous full bushy beard — very thick, round, and dense, extending several inches from the face. Dark brown-black; has become a basketball trademark.`),p(`Conor McGregor`,`Conor McGregor`,`MMA fighter with a neatly trimmed short-to-medium beard — dark brown, well-shaped, and often with faded sides. Bold, confident posturing; distinctive green eyes.`),p(`Drake`,`Drake (musician)`,`Known for his light-to-medium beard and moustache — brown, neatly maintained short-box beard. Light brown skin, round face, and calm, thoughtful expression.`),p(`Justin Timberlake`,`Justin Timberlake`,`In recent years: short, neat beard — light scruff or a well-groomed short brown beard. Contrasts with his clean-cut boy-band image from the Y2K era.`),p(`Ryan Gosling`,`Ryan Gosling`,`Known for his scruffy short beard that gives a rugged look — light to medium brown stubble or short beard. Square jaw; often paired with his brooding expression.`),p(`Jason Momoa`,`Jason Momoa`,`Full, thick dark beard with matching long dark hair — often shown as Aquaman with a wet, wild beard and long flowing locks. Very large and muscular with a tribal tattoo.`),p(`Chris Evans`,`Chris Evans (actor)`,`Captain America actor — clean-shaven in Marvel films, but often spotted with short-to-medium brown scruff or a neat beard in real life. Strong jaw and blue eyes.`),p(`Henry Cavill`,`Henry Cavill`,`Superman actor known for a very thick, dark, neatly shaped beard — full coverage with defined edges. Very dark brown; contrasts with his blue eyes and pale skin.`),p(`Keanu Reeves`,`Keanu Reeves`,`Medium-length greying black beard — full but slightly unkempt, fitting his low-key image. Long dark hair usually. Salt-and-pepper in recent years with serene expression.`),p(`Santa Claus`,`Santa Claus`,`Full, round, fluffy white beard that covers the entire lower face and neck — paired with a long white moustache. Rosy cheeks and a warm wide smile above the beard.`,[`St. Nick`,`Father Christmas`]),p(`Walter White`,`Walter White`,`Breaking Bad character — a bold moustache and matching goatee (circle beard) in the shape of a full goatee, dark to greying. Bald head; square black-framed glasses.`,[`Breaking Bad`])]},{id:`chess`,name:`Chess`,subject:`Games`,difficulty:`Medium`,description:`Name these people, positions, TV shows, movies, and other things associated with chess.`,items:[p(`King`,`King (chess)`,`The tallest piece on the board — a piece with a small cross on top. The most important piece; its capture ends the game.`,[`The King`]),p(`Queen`,`Queen (chess)`,`The most powerful piece — usually with a jagged crown, taller than most other pieces. Can move in any direction any number of squares.`,[`The Queen`]),p(`Rook`,`Rook (chess)`,`A castle-shaped chess piece — square top with crenellations, like a turret. Moves in straight lines horizontally or vertically.`,[`Castle`]),p(`Bishop`,`Bishop (chess)`,`A piece with a tall mitre-shaped head that rises to a pointed tip — moves diagonally. Each player has one bishop on white squares and one on dark.`,[`The Bishop`]),p(`Knight`,`Knight (chess)`,`A horse's head silhouette — the only piece that can jump over other pieces. Moves in an L-shape.`,[`The Knight`]),p(`Pawn`,`Pawn (chess)`,`The smallest, most numerous pieces — simple rounded-top pieces with a narrow base. Fills the second rank at the start of a game.`,[`The Pawn`]),p(`Checkmate`,`Checkmate`,`A king in checkmate position — cornered by opposing pieces with no legal move to escape. Shown with diagrams or tournament positions.`,[`Check Mate`]),p(`En Passant`,`En passant`,`A special pawn capture — a pawn captures an adjacent enemy pawn that has just moved two squares, as if it had only moved one.`),p(`Stalemate`,`Stalemate`,`A drawn position — the player to move has no legal moves but is not in check. Often shown as a crowded end-position diagram.`),p(`The Queen's Gambit`,`The Queen's Gambit (miniseries)`,`A Netflix series about a chess prodigy — Anya Taylor-Joy as Beth Harmon in a 1960s setting, playing chess in period clothing.`,[`Queen's Gambit`]),p(`Bobby Fischer`,`Bobby Fischer`,`An intense, lanky American chess genius — photographs show a young, thin man with a sharp, focused gaze at a chess board or in competition.`),p(`Garry Kasparov`,`Garry Kasparov`,`A Russian chess champion with a dark beard, sharp features, and intense eyes — photographed at chess boards during matches or tournaments.`,[`Kasparov`]),p(`Magnus Carlsen`,`Magnus Carlsen`,`A young Norwegian world champion — a handsome, boyish man with an affable smile. Often photographed mid-match or in casual clothes.`,[`Carlsen`]),p(`Deep Blue`,`Deep Blue (chess computer)`,`IBM's chess-playing computer — a large rack of IBM servers and computer hardware in a rack cabinet. Defeated Kasparov in 1997.`,[`IBM Deep Blue`]),p(`Chess Clock`,`Chess clock`,`Two analog or digital clocks joined in one housing — players press a button after their move to start the opponent's clock ticking.`),p(`Chessboard`,`Chessboard`,`A flat board with 64 squares alternating between light and dark — 8×8 grid, usually in wood (walnut and maple) or green and white.`),p(`Endgame`,`Endgame (chess)`,`A sparse board position — only a few pieces remain; kings are active, pawns race toward promotion. Requires precise calculation.`,[`End Game`]),p(`Opening`,`Chess opening`,`The starting position of a game — initial pawn and knight moves, often with a named opening (Sicilian, French, Ruy Lopez) written below.`,[`Opening Move`]),p(`Notation`,`Algebraic chess notation`,`A scoresheet with move sequences written in algebraic notation — rows of letters and numbers like '1.e4 e5 2.Nf3 Nc6' recording a game.`,[`Chess Notation`]),p(`Blitz Chess`,`Blitz chess`,`Fast chess — players moving very rapidly with only 3–5 minutes each. Hands moving quickly between pieces and clock; intense expressions.`),p(`Anya Taylor-Joy`,`Anya Taylor-Joy`,`A striking actress with large, wide-set eyes, pale skin, and an intense gaze — known for The Queen's Gambit and Split. Very photogenic features.`),p(`Fischer Random Chess`,`Fischer random chess`,`Chess960 — the back rank pieces are randomly shuffled (within rules) at the start, printed as a position setup card or shown on a board.`,[`Chess960`]),p(`Chess (Musical)`,`Chess (musical)`,`A 1986 musical — the stage show or album cover featuring chess imagery and Cold War aesthetics. 'One Night in Bangkok' is its famous song.`,[`Chess Musical`]),p(`Searching for Bobby Fischer`,`Searching for Bobby Fischer`,`A 1993 film — a child chess prodigy in a match, shown in chess club scenes with a serious young boy at a chess board.`),p(`Pawn Sacrifice`,`Pawn Sacrifice (film)`,`A 2014 film about Bobby Fischer — Tobey Maguire as Fischer with his intense, hollow-eyed expression at a chess board.`),p(`Fork`,`Fork (chess)`,`A tactical diagram — one piece attacking two enemy pieces simultaneously, forcing the opponent to lose material.`,[`Double Attack`]),p(`Pin`,`Pin (chess)`,`A diagram showing a piece that cannot move without exposing a more valuable piece behind it — shown as arrows on a position.`),p(`Discovered Check`,`Discovered check`,`A tactic where moving one piece reveals a check by another piece behind it — shown as a position diagram with an arrow.`),p(`Zugzwang`,`Zugzwang`,`A position where any move made will worsen the mover's situation — typically an endgame king position with limited options.`),p(`Simultaneous Exhibition`,`Simultaneous exhibition`,`A grandmaster moving around a room of boards, playing against many opponents at once — one player walks between rows of tables.`,[`Simul`])]},{id:`mini-golf`,name:`Mini Golf`,subject:`Games`,difficulty:`Easy`,description:`Name these items and obstacles you might see at a mini golf course.`,items:[p(`Windmill`,`Windmill`,`The classic mini golf obstacle — a spinning windmill with four rotating blades that sweep across the fairway. Players time their shot between the blades.`),p(`Clown Mouth`,`Clown`,`A large painted clown face with an open mouth — players putt through the clown's open mouth into a hole. Bright, goofy painted face.`,[`Clown Face`]),p(`Loop`,`Roller coaster loop`,`A vertical loop in the mini golf course — the ball rolls along a rail through a complete 360° loop before landing on the green.`,[`Loop de Loop`]),p(`Tunnel`,`Tunnel`,`A covered tube running through or under the green — players putt into a dark opening, the ball emerging from the other end.`),p(`Water Hazard`,`Water hazard (golf)`,`A small pond, stream, or moat on the course — blue water that will swallow your ball if you miss the path over or around it.`,[`Water Feature`]),p(`Bridge`,`Bridge`,`A small arched bridge over water or a depression — players putt across the bridge from one side to a green on the other.`),p(`Ramp`,`Ramp`,`A sloped incline on the course — the ball must be hit hard enough to roll up and over the ramp and onto the green below.`),p(`Lighthouse`,`Lighthouse`,`A miniature lighthouse tower — white and red striped, standing beside a water hazard or as part of a nautical-themed hole.`),p(`Pirate Ship`,`Pirate ship`,`A miniature wooden pirate ship — often with a skull-and-crossbones flag, a plank, and a course that passes through the hull.`),p(`Castle`,`Castle`,`A miniature castle with crenellations, a drawbridge, and a portcullis opening — players putt through the castle gate.`),p(`Volcano`,`Volcano`,`A cone-shaped fake volcano on the green — sometimes smokes or lights up; players putt around or between lava flows.`),p(`Dinosaur`,`Dinosaur`,`A large fibreglass T-Rex or brontosaurus statue — towers over the hole; players putt under its legs or around its base.`),p(`Alligator`,`Alligator`,`A concrete or fibreglass alligator — open jaws form a tunnel players putt through; often with realistic green scaly paint.`),p(`Sphinx`,`Great Sphinx of Giza`,`A miniature concrete Sphinx — the iconic Egyptian monument shrunk to mini golf scale, with a hole between its paws.`,[`Sphinx`]),p(`Miniature Eiffel Tower`,`Eiffel Tower`,`A miniature replica of the Eiffel Tower — an iconic mini golf prop, usually in an international or world landmarks theme.`,[`Eiffel Tower`]),p(`Putter`,`Golf club`,`A short-handled flat-faced golf club used only for putting — straight or angled face; used to roll the ball on the green.`,[`Golf Club`]),p(`Golf Ball`,`Golf ball`,`A small, hard, white dimpled ball — covered in a regular pattern of small circular dimples. Rolls along the carpet-like astroturf.`),p(`Score Card`,`Scorecard`,`A small folded paper card listing the hole numbers and par values — players record their scores in pencil after each hole.`,[`Scorecard`]),p(`Hole in One`,`Hole in one`,`A ball going directly from the putter into the cup in a single stroke — often marked with a special symbol or celebrated with a siren.`),p(`Par`,`Par (score)`,`The expected number of strokes for a hole — in mini golf, typically par-2 or par-3. Shown on the scorecard for each hole.`,[`Golf Par`]),p(`Windmill Blades`,`Windmill`,`The rotating blades of the mini golf windmill obstacle — four flat wooden or plastic arms spinning around a central hub.`),p(`Putting Green`,`Putting green`,`The artificial turf surface of a mini golf hole — bright green carpet-like astroturf with a raised lip around the edges and a cup hole.`,[`Green`]),p(`Flagstick`,`Pin (golf)`,`A small coloured flag on a thin stick inserted in the hole — often numbered with the hole number. Visible from distance to show the target.`,[`Flag`,`Golf Flag`]),p(`Bumpers`,`Bumper`,`Low rubber or wooden rails along the sides of the fairway — prevent the ball from rolling off the edge; guide errant shots.`,[`Guardrails`]),p(`Astroturf`,`Artificial turf`,`Bright green synthetic carpet used as the playing surface — short, stiff, plastic grass fibres in a vivid lime-green colour.`,[`Artificial Grass`]),p(`Pencil`,`Pencil`,`A short golf pencil — a small 4-inch yellow pencil provided with the scorecard. The classic mini golf score-keeping tool.`),p(`Rotating Platform`,`Lazy Susan`,`A spinning circular platform on the course — the ball is placed on the platform while it rotates, requiring timing to putt off.`),p(`Moving Obstacles`,`Obstacle course`,`Mechanical obstacles that move across the fairway — sliding walls, spinning cylinders, or swinging pendulums players must time.`),p(`Hippopotamus`,`Hippopotamus`,`A large hippo statue with an open mouth — a fibreglass hippo whose gaping jaws form a tunnel players putt through.`,[`Hippo`]),p(`Space Theme`,`Outer space`,`A space-themed mini golf course — rocket ships, planets, alien decorations, and glow-in-the-dark elements under black lights.`)]},{id:`brain-games`,name:`Brain Games`,subject:`Games`,difficulty:`Medium`,description:`Name these puzzles, games, and brain teasers.`,items:[p(`Rubik's Cube`,`Rubik's Cube`,`A 3×3 cube of small coloured squares — six faces each in a solid colour (red, blue, green, yellow, white, orange). Twisted into a mixed scramble.`,[`Cube Puzzle`]),p(`Sudoku`,`Sudoku`,`A 9×9 grid divided into nine 3×3 boxes — some numbers are pre-filled; players complete the grid so each row, column, and box has 1–9 once.`),p(`Crossword Puzzle`,`Crossword puzzle`,`A black-and-white grid of numbered squares — black blocks and white answer squares, with Across and Down clue lists beside the grid.`,[`Crossword`]),p(`Word Search`,`Word search puzzle`,`A grid of random-looking letters — words are hidden horizontally, vertically, or diagonally; circled when found. Printed on paper.`,[`Word Find`]),p(`Jigsaw Puzzle`,`Jigsaw puzzle`,`Hundreds of interlocking cardboard pieces spread on a table — irregular shapes with a printed image that forms a picture when assembled.`,[`Puzzle`]),p(`Tangram`,`Tangram`,`Seven flat geometric pieces (tans) — a square, parallelogram, and five triangles of different sizes, rearranged to form silhouette shapes.`),p(`Maze`,`Maze`,`A printed or hedge puzzle — a path of walls and corridors with a start and end point. Players draw or trace the route through.`),p(`Riddle`,`Riddle`,`A riddle displayed as text — a question or statement requiring lateral thinking. 'What has hands but cannot clap?' for example.`),p(`Optical Illusion`,`Optical illusion`,`A drawing that deceives the eye — the two-face/vase, the spinning dancer, or impossible staircases. The image appears to change when you stare.`,[`Illusion`]),p(`Magic Eye`,`Autostereogram`,`A colourful, random-dot or repeating pattern image — staring at it cross-eyed reveals a hidden 3D object floating in front of the pattern.`,[`Stereogram`]),p(`Chess`,`Chess`,`A chess board with pieces in mid-game — alternating light and dark squares with carved wooden pieces (king, queen, rooks, bishops, knights, pawns).`),p(`Wordle`,`Wordle (game)`,`A 5-letter word guessing game grid — six rows of five squares, each row coloured green (correct position), yellow (wrong position), or grey (not in word).`),p(`Scrabble`,`Scrabble`,`A game of letter tiles on a board — small ivory or cream square tiles with letters and point values played on a 15×15 board with premium squares.`),p(`Boggle`,`Boggle (word game)`,`A 4×4 grid of letter dice — 16 six-sided dice randomly showing different letters, shaken in a dome lid. Players find words in connected letters.`,[`Boggle`]),p(`Rebus`,`Rebus`,`A puzzle using pictures and symbols to represent syllables — for example a picture of an eye + a heart + a U represents 'I love you.'`),p(`Logic Puzzle`,`Logic puzzle`,`A grid logic puzzle — a 5×5 matrix with categories on each axis, players tick and cross cells to deduce the correct arrangement.`),p(`Cryptogram`,`Cryptogram`,`Encoded text where each letter is replaced by a different symbol or letter — a string of strange symbols that decode to a hidden message.`),p(`Lateral Thinking Puzzle`,`Lateral thinking`,`A bizarre-sounding scenario printed in text — 'A man walks into a restaurant and orders albatross soup. He eats it and goes home and kills himself. Why?'`,[`Lateral Thinking`]),p(`Anagram`,`Anagram`,`Scrambled letters — a set of letters rearranged to form a different word. 'LISTEN' → 'SILENT'; often shown as tiles or a digital scramble.`),p(`Tower of Hanoi`,`Tower of Hanoi`,`Three pegs with a stack of decreasing discs — discs must be moved from one peg to another, never placing a larger disc on a smaller one.`,[`Hanoi Puzzle`]),p(`Sliding Puzzle`,`Sliding puzzle`,`A 4×4 tile grid with one missing square — 15 numbered or pictured tiles shuffled out of order, slid into the correct arrangement.`),p(`Kakuro`,`Kakuro`,`A crossword-style number puzzle — a grid where number sums are given and digits 1–9 fill the cells without repeating in any run.`),p(`Nonogram`,`Nonogram`,`A grid puzzle with number clues — numbers beside each row and column tell how many consecutive cells to fill in to reveal a pixel picture.`,[`Picross`]),p(`Ken Ken`,`KenKen`,`A mathematical Sudoku variant — a grid divided into cages with a target number and operator (+, −, ×, ÷). Numbers can't repeat in a row or column.`,[`KenKen`]),p(`Brain Teaser`,`Brain teaser`,`A short, tricky question or puzzle — usually shown as a text question or a simple diagram that seems impossible but has a logical answer.`),p(`Memory Game`,`Concentration (card game)`,`Face-down cards in a grid — players flip two at a time to find matching pairs. Classic children's card matching game.`,[`Concentration`]),p(`Number Sequence`,`Sequence`,`A series of numbers with a missing value — '2, 4, 8, 16, __, 64' for example. Players identify the pattern to fill the gap.`,[`Pattern`]),p(`Matchstick Puzzle`,`Matchstick puzzle`,`A shape made from matchsticks or toothpicks — 'Move two matches to make four squares' type puzzle shown with a diagram.`),p(`River Crossing Puzzle`,`River crossing puzzle`,`The classic logic puzzle — a farmer, fox, chicken, and grain must cross a river in a boat that only holds two. Shown as a diagram.`),p(`Mastermind`,`Mastermind (board game)`,`A code-breaking board game — a shield hides four coloured pegs; the codebreaker places guess rows of pegs and receives black and white key pegs as feedback.`)]},{id:`build-a-bear`,name:`Build-A-Bear`,subject:`Games`,difficulty:`Easy`,description:`Name the animal or item found in a Build-A-Bear Workshop.`,items:[p(`Teddy Bear`,`Teddy bear`,`A classic stuffed bear — soft plush brown or tan fabric with a round head, small nose, button eyes, and jointed limbs. Very cuddly and round.`),p(`Bunny`,`Rabbit`,`A stuffed bunny with long upright ears — soft white, grey, or brown fur, small button nose, and fluffy tail.`),p(`Puppy`,`Dog`,`A plush puppy — floppy ears, round nose, and soft beige or tan fur. Can be customised with various colour patches and accessories.`),p(`Kitty`,`Cat`,`A stuffed kitten — triangular ears on top of a round head, embroidered nose and whiskers, and soft plush fur.`),p(`Unicorn`,`Unicorn`,`A white or pastel plush horse with a glittery spiral horn on the forehead and often a rainbow or sparkly mane and tail.`),p(`Dragon`,`Dragon`,`A plush dragon — rounded body, small wings on the back, tiny horns, and a friendly expression. Often in green or purple colours.`),p(`Dinosaur`,`Dinosaur`,`A friendly plush dinosaur — a round body, tiny arms, a big head, and small soft spines along the back. Usually in green or teal.`),p(`Elephant`,`Elephant`,`A plush elephant — large flappy ears, a short soft trunk, and a wide gentle face. Usually grey with a lighter belly.`),p(`Giraffe`,`Giraffe`,`A plush giraffe — a long neck, small horns (ossicones), and a yellow-orange patterned body with brown spots.`),p(`Frog`,`Frog`,`A plush frog — a round flat green body with huge round eyes on top of the head and wide, slightly webbed feet.`),p(`Duck`,`Duck`,`A plush duck — round yellow body, a flat orange bill, and small orange feet. Can wear tiny accessories or a sailor hat.`),p(`Monkey`,`Monkey`,`A plush monkey — a round brown body with a lighter tan face, belly, and inner ears. Big eyes and a round nose.`),p(`Penguin`,`Penguin`,`A plush penguin — black back, white belly, and orange beak and feet. Stands upright with tiny flipper-like arms.`),p(`Lion`,`Lion`,`A plush lion — a fluffy brown mane around a friendly face, a tawny body, and a tail with a tuft at the end.`),p(`Tiger`,`Tiger`,`A plush tiger — orange fur with black stripes, a round face with a white muzzle and inner ears, and a striped tail.`),p(`Panda`,`Giant panda`,`A plush panda — white body with distinctive black patches around the eyes, ears, and limbs. Round and pudgy.`),p(`Hippo`,`Hippopotamus`,`A plush hippo — a very wide, round grey body with a large flat head, tiny rounded ears, and a wide pink mouth.`),p(`Lamb`,`Sheep`,`A plush lamb — a fluffy white woolly body, a gentle pink face, and small black-and-white legs.`),p(`Heart Sound Box`,`Build-A-Bear Workshop`,`A small plastic heart placed inside the stuffed animal before it is sewn shut — a red or pink heart about the size of a large marble.`,[`Sound Box`,`Heart`]),p(`Birth Certificate`,`Birth certificate`,`The Build-A-Bear birth certificate — a printed card with the bear's name, birthday, and a paw print. Comes with every completed animal.`,[`Bear Certificate`]),p(`Ballerina Outfit`,`Ballet costume`,`A tiny pink tutu and ballet slippers designed to fit a stuffed animal — a miniature ballet costume with a tiered tulle skirt.`,[`Ballet Tutu`]),p(`Sports Jersey`,`Jersey (clothing)`,`A miniature sports jersey for a stuffed animal — a small cloth shirt in team colours with a number on the back.`,[`Sports Outfit`]),p(`Princess Dress`,`Princess`,`A sparkly miniature gown for a stuffed animal — a tiny pink or purple dress with a full skirt and sometimes a small tiara.`,[`Princess Costume`]),p(`Stuffing Machine`,`Build-A-Bear Workshop`,`The air-powered stuffing machine at the store — a foot pedal operates a tube that blows polyester stuffing into an unstuffed animal skin.`,[`Stuffing Station`]),p(`Bear Clothes`,`Clothing`,`Tiny outfits for stuffed animals — miniature jeans, hoodies, shoes, and accessories designed to dress up a Build-A-Bear.`,[`Outfit`]),p(`Scented Bear`,`Scent`,`A stuffed animal with a scent disc inside — a small flavoured disc that makes the bear smell like strawberries, cotton candy, or vanilla.`,[`Scented Animal`]),p(`Sponge Bob`,`SpongeBob SquarePants`,`A yellow, square-bodied sponge with big blue eyes and buck teeth — in square pants and a white shirt. A Build-A-Bear licensed character.`,[`SpongeBob`]),p(`Care Bear`,`Care Bears`,`A plush bear in a pastel colour with a unique belly badge symbol — each bear has a different heart, rainbow, or sunshine on its stomach.`),p(`My Little Pony`,`My Little Pony`,`A pony with a colourful pastel mane and tail and a unique 'cutie mark' symbol on the flank — bright colours, big eyes, and soft fur.`,[`Pony`]),p(`Pokémon`,`Pokémon`,`Plush versions of Pokémon characters — Pikachu (yellow with red cheeks), Eevee (brown with fluffy collar), or Gengar (purple ghost).`,[`Pokemon`])]},{id:`hasbro-games`,name:`Hasbro Games`,subject:`Games`,difficulty:`Easy`,description:`Name the game from Hasbro.`,items:[p(`Monopoly`,`Monopoly (game)`,`A rectangular board with property spaces around the edge in colour groups — Boardwalk and Park Place in dark blue; houses and hotels in green and red; Chance cards.`),p(`Scrabble`,`Scrabble`,`A crossword-style board game — players place letter tiles on a cream-coloured grid with coloured bonus squares (double/triple word/letter) to for
