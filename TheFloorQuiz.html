iled deer`,`State animal of 11 states incl. Texas, Michigan, Wisconsin`,`A reddish-brown deer in summer, grey-brown in winter, with a flash of bright white on the underside of the raised tail. Bucks carry branching antlers; does are antler-free.`,[`Whitetail Deer`,`White Tail Deer`,`Deer`]),h(`Armadillo`,`Nine-banded armadillo`,`State small mammal of Texas`,`A small armored mammal with a dome of leathery banded plates, pink pointy snout, large upright ears, and a long scaled tail. Looks like a tiny tank.`,[`Nine-banded Armadillo`,`Nine Banded Armadillo`]),h(`Texas Longhorn`,`Texas Longhorn`,`State large mammal of Texas`,`A lean, long-legged cattle breed with dramatically long horns that can span over six feet tip to tip. Coat is a patchwork of brown, white, and rust.`,[`Longhorn`]),h(`American Bison`,`American bison`,`State animal of Kansas, Oklahoma & Wyoming`,`A huge shaggy beast with a high humped shoulder, massive woolly dark-brown head, short curved horns, and a trimmer hindquarters. Much bigger at the front than the back.`,[`Bison`,`Buffalo`,`American Buffalo`]),h(`Bighorn Sheep`,`Bighorn sheep`,`State animal of Nevada & Colorado`,`A stocky tan sheep with a pale rump patch and creamy muzzle. Rams carry enormous coiled brown horns that curl back and forward in a full circle.`,[`Rocky Mountain Bighorn`,`Bighorn`]),h(`Morgan Horse`,`Morgan horse`,`State animal of Vermont & Massachusetts`,`A compact, well-muscled horse with a cresty arched neck, expressive eyes, and a fine head. Coat comes in bay, black, or chestnut; known for its elegant yet sturdy build.`,[`Morgan`]),h(`Mustang`,`Mustang (horse)`,`State horse of Nevada`,`A free-roaming horse of the American West, typically lean and athletic with a wild mane. Coat varies widely — pinto, bay, roan, dun — and builds are more compact than domestic breeds.`,[`Wild Horse`,`Wild Mustang`]),h(`Appaloosa`,`Appaloosa`,`State horse of Idaho`,`Recognized instantly by bold spotted markings — usually a white or light coat with dark spots (or vice versa). Eyes have visible white sclera and hooves are striped black and white.`),h(`Tennessee Walking Horse`,`Tennessee Walking Horse`,`State horse of Tennessee`,`A tall, elegant horse with a long arching neck and refined head. Known for its exaggerated 'running walk' gait; often seen in show rings with high-stepping front hooves.`,[`Walking Horse`,`Tennessee Walker`]),h(`American Black Bear`,`American black bear`,`State animal of Louisiana, New Mexico & West Virginia`,`A medium-sized bear that is often brown or cinnamon despite the name. Rounder face and smaller shoulders than a grizzly; lacks the pronounced shoulder hump.`,[`Black Bear`]),h(`Orca`,`Orca`,`State marine mammal of Washington`,`A dramatic black-and-white whale with a bold white eye patch and white belly. Males have a very tall straight dorsal fin; females have a smaller curved one.`,[`Killer Whale`,`Orca Whale`]),h(`Manatee`,`West Indian manatee`,`State marine mammal of Florida`,`A round, wrinkled grey sea mammal with a flat paddle-like tail, small flippers, and a bristly whiskered face. Moves slowly and looks like a floating boulder underwater.`,[`Sea Cow`,`West Indian Manatee`]),h(`Sperm Whale`,`Sperm whale`,`State animal of Connecticut`,`The largest toothed predator — dark grey-blue with a huge blunt square forehead (up to a third of body length) and a tiny lower jaw. Skin is often wrinkled and corrugated.`,[`Sperm`]),h(`Gray Whale`,`Gray whale`,`State marine mammal of California`,`A mottled grey-white whale covered in barnacles and whale lice patches. No dorsal fin; instead a series of knobby bumps along the lower back. Stockier than a humpback.`,[`Grey Whale`]),h(`Thoroughbred`,`Thoroughbred horse`,`State horse of Maryland`,`A lean, athletic racehorse with long legs, a deep chest, and a narrow refined head. Coat is typically bay, chestnut, or grey; bred for speed and often seen in racing silks.`,[`Thoroughbred Horse`]),h(`Nene`,`Nene (bird)`,`State bird of Hawaii`,`A goose-like bird with a black face and cap, cream-buff neck with black streaks, and brown-grey body. Feet are only partially webbed, adapted for lava fields.`,[`Hawaiian Goose`,`Nene Goose`]),h(`Northern Cardinal`,`Northern cardinal`,`State bird of Illinois, Indiana, Kentucky, NC, Ohio, Virginia & WV`,`The male is a vivid all-red bird with a pointed crest and an orange-red conical bill surrounded by a black mask. Females are buffy-brown with reddish tinges on crest and wings.`,[`Cardinal`]),h(`American Robin`,`American robin`,`State bird of Connecticut, Michigan & Wisconsin`,`A medium thrush with a brick-orange breast, dark grey-black back and head, white eye rings, and a yellow bill. Hops across lawns tilting its head to listen for worms.`,[`Robin`]),h(`Greater Roadrunner`,`Greater roadrunner`,`State bird of New Mexico`,`A long-legged, ground-dwelling bird with a streaky brown-and-white body, long tail, shaggy crest, and a blue-red bare patch behind the eye. Runs fast on the ground.`,[`Roadrunner`]),h(`Brown Pelican`,`Brown pelican`,`State bird of Louisiana`,`A large coastal bird with a grey-brown body, white and yellow head, and a huge throat pouch hanging from an elongated bill. Plunges headfirst into the sea to catch fish.`,[`Pelican`]),h(`Common Loon`,`Common loon`,`State bird of Minnesota`,`Breeding plumage is striking: black-and-white checkered back, black head with an iridescent green sheen, red eye, and a black-and-white necklace band.`,[`Loon`]),h(`American Goldfinch`,`American goldfinch`,`State bird of Iowa, New Jersey & Washington`,`The breeding male is brilliant canary-yellow with black wings showing white bars and a neat black forehead patch. Females are dull olive-yellow. Small with a short conical beak.`,[`Goldfinch`]),h(`Eastern Bluebird`,`Eastern bluebird`,`State bird of Missouri & New York`,`The male has a vivid royal-blue back, wings, and tail with a rusty-orange breast and white belly. Small and round-headed; perches on fence posts and wires in open country.`,[`Bluebird`]),h(`Northern Mockingbird`,`Northern mockingbird`,`State bird of Arkansas, Florida, Mississippi, Tennessee & Texas`,`A medium grey songbird with white wing patches visible in flight and long white-edged tail feathers. Slim and long-tailed; often sings from a high perch at all hours.`,[`Mockingbird`]),h(`Wild Turkey`,`Wild turkey`,`State game bird of Alabama, Massachusetts & South Carolina`,`A large, iridescent bronze-brown bird with a bald red and blue head, dangling red wattles, and a fanned tail with chestnut-tipped feathers. Males have a prominent beard of dark bristles.`,[`Turkey`]),h(`American Alligator`,`American alligator`,`State reptile of Florida, Louisiana & Mississippi`,`A massive dark olive to black crocodilian with a broad rounded U-shaped snout, armored ridged back, and powerful tail. Fourth tooth of lower jaw is hidden when mouth is closed.`,[`Alligator`,`Gator`]),h(`Monarch Butterfly`,`Monarch butterfly`,`State insect/butterfly of Alabama, Idaho, Illinois, MN, TX & more`,`Unmistakable orange wings with bold black veins and a black border dotted with white spots. Large wingspan; seen migrating in orange-cloud masses over fields and milkweed.`,[`Monarch`]),h(`Western Honeybee`,`Western honey bee`,`State insect of 17 states`,`A small fuzzy bee with golden-yellow and dark brown stripes on the abdomen. Has hairy pollen-collecting legs (corbiculae) and transparent wings; often seen hovering over flowers.`,[`Honeybee`,`Honey Bee`,`Bee`])]},{id:`ducks`,name:`Ducks`,subject:`Animals & Nature`,difficulty:`Medium`,description:`Name the type of duck, famous duck, or thing associated with ducks.`,items:[p(`Mallard`,`Mallard`,`The male has a glossy green head, white neck ring, and chestnut-brown breast. The female is mottled brown throughout. Both have an iridescent blue-purple wing patch (speculum).`),p(`Wood Duck`,`Wood duck`,`One of the most colorful ducks — male has an iridescent green-and-purple crested head, red eyes, white chin, and chestnut breast. Female is grey-brown with a distinctive white teardrop eye ring.`),p(`Northern Pintail`,`Northern pintail`,`A slender, elegant duck. Male has a chocolate-brown head, white neck stripe, grey body, and a long needle-like tail. Female is plain buffy-brown with a pointed (not needle) tail.`,[`Pintail`]),p(`Canvasback`,`Canvasback`,`A large diving duck. Male has a distinctive rust-red head, long sloping forehead, black chest, and pale grey-white canvas-coloured back and sides. Female is buffy-brown with the same sloped head profile.`),p(`Redhead`,`Redhead (duck)`,`Male has a rounded brick-red head, black chest, pale grey back, and a blue-grey bill with a black tip. Very similar to the Canvasback but has a rounder head and steeper forehead.`),p(`Bufflehead`,`Bufflehead`,`A tiny duck. Male has a large puffy head with a bold white patch behind the eye on a black-and-green iridescent background. Body is white with a black back. Female is dark with a small white cheek patch.`),p(`Ruddy Duck`,`Ruddy duck`,`A compact, stiff-tailed diving duck. Breeding male has a bright chestnut-red body, white cheeks, black cap, and a vivid sky-blue bill. Tail is often cocked up. Female is brownish with a pale cheek and dark stripe.`),p(`Harlequin Duck`,`Harlequin duck`,`Male is a dramatic slate-blue with chestnut flanks and bold white spots and streaks on the head and body — a chaotic 'harlequin' pattern. Female is dark brown with three white spots on the face.`),p(`Muscovy Duck`,`Muscovy duck`,`A large, heavy duck with distinctive red warty facial skin (caruncles) around the eyes and base of bill. Body is usually black and white. Domesticated versions are often larger and patchier.`),p(`Pekin Duck`,`Pekin duck`,`An all-white domestic duck with an orange-yellow bill and orange feet. Plump and broad-bodied. The classic farmyard white duck; also the model for Donald Duck.`,[`White Pekin`]),p(`Teal`,`Green-winged teal`,`A small dabbling duck. Male has a chestnut-brown head with a broad iridescent green patch around the eye, speckled grey body, and a yellow patch near the tail. Female is mottled brown.`),p(`Eider`,`Common eider`,`A large, heavy sea duck. Male has a striking black-and-white body with a black cap, green nape, and a long wedge-shaped bill. Female is richly barred rusty-brown.`),p(`Merganser`,`Common merganser`,`A long-bodied diving duck with a serrated red bill. Male has a dark glossy green head, white body, and salmon-pink underparts. Female has a shaggy reddish-brown head and grey body.`),p(`Donald Duck`,`Donald Duck`,`A cartoon white duck wearing a blue sailor hat, matching blue bow tie, and blue sailor shirt (but no pants). Has an orange bill and feet, and perpetually angry or flustered expression.`),p(`Daffy Duck`,`Daffy Duck`,`A Looney Tunes cartoon black duck with a lisp. Has a round white ring around the neck, white underbelly, and large orange bill. Often seen with wild wide eyes and exasperated expressions.`),p(`Daisy Duck`,`Daisy Duck`,`Donald Duck's girlfriend — a white female cartoon duck with purple bows on her head, a pink top, and ruffled bloomers. Has a softer, more feminine version of Donald's orange bill and feet.`),p(`Scrooge McDuck`,`Scrooge McDuck`,`The iconic Disney miser duck — white feathered with a red tailcoat, top hat, pince-nez glasses, and a walking cane. Often depicted diving into his giant money bin filled with gold coins.`),p(`Darkwing Duck`,`Darkwing Duck`,`An animated superhero duck in a dramatic purple costume with a wide-brimmed purple hat, matching mask and cape, and a lavender shirt. Bill is orange; tends to strike heroic poses in a cloud of smoke.`),p(`Howard the Duck`,`Howard the Duck`,`A Marvel Comics character — a short anthropomorphic duck in human clothes (usually a jacket and pants), with a cigar and a very grumpy expression. Short stature with a large rounded bill.`),p(`Rubber Duck`,`Rubber duck`,`A small bright-yellow bath toy shaped like a cartoon duck, with an orange bill, round eyes, and a squeaker. Classic childhood icon; always seen floating upright.`,[`Rubber Ducky`]),p(`Duct Tape`,`Duct tape`,`A wide, strong adhesive tape with a shiny silver-grey fabric backing. Usually seen on a roll or torn in strips; can be silver, black, or coloured. Very sticky; used for repairs.`,[`Duck Tape`]),p(`Duck Decoy`,`Duck decoy`,`A carved or moulded replica of a duck, usually painted with realistic markings and placed on the water to lure real ducks. Often made of wood with weighted keels.`,[`Decoy`]),p(`Duck Call`,`Duck call`,`A small reed instrument, usually made of wood or acrylic, that hunters blow into to mimic duck sounds. Looks like a short cylindrical tube with a mouthpiece.`),p(`Down Feather`,`Down feather`,`Soft, fluffy clusters of fine fibres found under a bird's outer feathers. Looks like a tiny puffball with no quill. Appears as light, wispy plumes — used as filling in jackets and pillows.`,[`Down`]),p(`Duck Hunt`,`Duck Hunt`,`The classic 1984 Nintendo NES game. Shows a TV screen with bright green and blue cartoon landscapes, flying ducks, and a laughing dog retrieving game. Played with the orange Zapper light gun.`),p(`Duck Sauce`,`Duck sauce`,`A sweet, bright orange-yellow condiment served in small packets or tubs at Chinese-American restaurants. Thick, jammy texture; made from apricots or plums. Often paired with egg rolls.`),p(`Duckling`,`Duck`,`A tiny, round, fluffy baby duck covered in soft yellow or yellow-green down. Has a small flat orange bill, tiny feet, and wide innocent eyes. Often seen following its mother.`,[`Baby Duck`]),p(`Dabbling Duck`,`Dabbling duck`,`A duck feeding with its tail up and head submerged in shallow water — you see only the rear end and feet sticking up. Classic 'bottoms-up' feeding pose.`,[`Puddle Duck`]),p(`Duck-billed Platypus`,`Platypus`,`An Australian mammal that looks like no other — brown furry body like an otter, a flat rubbery bill like a duck, and a wide beaver-like tail. Males have a venomous spur on the hind leg.`,[`Platypus`]),p(`Mandarin Duck`,`Mandarin duck`,`Often called the world's most beautiful duck. Male has stunning orange, green, blue, and white plumage with prominent orange 'sails' raised on the back. Female is grey-brown with white eye ring.`)]},{id:`animal-calls`,name:`Animal Calls (Audio)`,subject:`Animals & Nature`,difficulty:`Medium`,description:`Name the animal you hear. (Image shows the animal — name it!)`,items:[p(`Wolf`,`Gray wolf`,`A lean, long-legged canid with a thick grey-brown coat, bushy tail, and a broad muzzle. Often photographed in snow or forest; pale amber eyes and a wild, alert expression.`,[`Grey Wolf`]),p(`Lion`,`Lion`,`The male has a huge shaggy mane ranging from gold to dark brown framing a broad tan face. Body is muscular and tawny. Females are sleek and plain sandy-gold without a mane.`),p(`Elephant`,`African bush elephant`,`The world's largest land animal — grey, wrinkled skin, huge fan-like ears, and a long muscular trunk. Tusks are long ivory curves. Larger than Asian elephants with more pronounced ear 'flaps'.`,[`African Elephant`]),p(`Frog`,`Frog`,`A small amphibian with smooth or warty moist skin, bulging eyes, and long hind legs for jumping. Colour varies widely — bright green, brown, red, or patterned depending on species.`),p(`Cricket`,`Cricket (insect)`,`A small brown-black insect with long threadlike antennae, large back legs for jumping, and two pairs of wings folded flat along the body. Makes chirping sounds by rubbing wings together.`),p(`Crow`,`American crow`,`An all-black bird — jet black beak, glossy black plumage, and black feet. Medium-sized with a fan-shaped tail. Often seen in groups; walks with a confident strut.`),p(`Humpback Whale`,`Humpback whale`,`A massive black-and-white whale with very long pectoral fins (like wings), a knobby bumpy head, and a small dorsal hump. Known for spectacular breaches and tail-slapping.`,[`Whale`]),p(`Spotted Hyena`,`Spotted hyena`,`A powerfully built carnivore with a sloping back (forequarters higher than hindquarters), short rounded ears, and a tan-grey coat covered in dark brown spots. Broad muzzle with strong jaws.`,[`Hyena`]),p(`Bottlenose Dolphin`,`Common bottlenose dolphin`,`A sleek grey marine mammal with a distinctive short beak (bottle-nose), curved dorsal fin, and a permanently 'smiling' mouth. Lighter grey on belly; very smooth-skinned.`,[`Dolphin`]),p(`Gorilla`,`Western gorilla`,`A massive black-furred great ape with a broad flat nose, prominent brow ridge, and long arms. Males have a silver-grey back (silverbacks). Moves on knuckles and has a very wide chest.`),p(`King Cobra`,`King cobra`,`The world's longest venomous snake — olive-green to black with pale crossbands. When threatened, rears up and spreads a wide hood behind the flattened head. Can stand waist-high.`,[`Cobra`]),p(`Cat`,`Cat`,`A small, lithe, soft-furred domestic animal with pointed ears, vertical slit pupils, retractable claws, and a long tail. Coats come in tabby, black, white, orange, and countless patterns.`),p(`Dog`,`Dog`,`Domesticated canine in enormous variety — from tiny Chihuahuas to giant Great Danes. Typically has a muzzle, floppy or upright ears, four legs with paw pads, and a wagging tail.`),p(`Cow`,`Cattle`,`A large hoofed farm animal with a barrel-shaped body, prominent udder (females), and short curved horns (sometimes). Coat is typically black-and-white (Holstein) or solid brown/red.`,[`Bull`]),p(`Horse`,`Horse`,`A large, muscular hoofed mammal with long legs, a flowing mane along the neck, and a long tail. Coats range from chestnut, bay, black, grey, to palomino. Elegant long neck and refined head.`),p(`Great Horned Owl`,`Great horned owl`,`A large owl with prominent tufted 'horns' (feather tufts), bold yellow eyes, and a white throat patch. Mottled brown-and-grey barred plumage provides excellent camouflage against bark.`,[`Owl`]),p(`Coyote`,`Coyote`,`A medium-sized wild canid — lean and long-legged with a pointed muzzle, large ears, and a bushy tail often carried low. Coat is grey-brown to reddish; looks like a small, scrawny wolf.`),p(`Peacock`,`Indian peafowl`,`The male (peacock) has iridescent blue-green plumage, a metallic blue neck and breast, and a spectacular train of elongated tail feathers covered in 'eye' spots of blue and green.`,[`Peafowl`]),p(`Rooster`,`Rooster`,`A male chicken with a tall bright red comb on the head, red wattles, glossy iridescent feathers of green, orange, and red, and long curved tail feathers. Stands tall and proud.`,[`Chicken`]),p(`Chimpanzee`,`Common chimpanzee`,`Our closest relative — dark black fur over most of the body, a bare pinkish-tan face with large ears, and long arms. Expressive faces show teeth in grins or screams.`,[`Chimp`]),p(`American Alligator`,`American alligator`,`A massive dark olive to black reptile with a broad, rounded U-shaped snout, armored ridged back, and powerful tail. Eyes and nostrils sit high so it can lurk with most of its body submerged.`,[`Alligator`]),p(`Harbor Seal`,`Harbor seal`,`A plump, dog-faced seal with large liquid brown eyes, short flippers, and a spotted grey or tan coat. No ear flaps; propels itself on land with an awkward caterpillar crawl.`,[`Seal`]),p(`Wild Turkey`,`Wild turkey`,`A large bronze-brown bird with a bald red-and-blue head, dangling red wattles, and a fan of tail feathers tipped in chestnut. Males have a beard of dark bristles hanging from the chest.`,[`Turkey`]),p(`Rattlesnake`,`Western diamondback rattlesnake`,`A thick-bodied pit viper with a diamond-shaped head, brown-grey scales with diamond patterns, and a distinctive segmented rattle at the tail tip. Pupils are vertical slits.`,[`Diamondback`]),p(`African Grey Parrot`,`African grey parrot`,`A medium-sized parrot — entirely grey plumage with scalloped white edges on feathers, a distinctive bright red tail, and a black hooked beak. Highly intelligent; regarded as best talker.`,[`Parrot`]),p(`Red Fox`,`Red fox`,`A sleek canid with a bright rusty-orange coat, white underbelly and chin, black legs and ear tips, and a large bushy tail (brush) tipped in white. Pointed muzzle and triangular ears.`,[`Fox`]),p(`Brown Bear`,`Brown bear`,`A massive bear with a pronounced shoulder hump, dished concave face, long front claws, and thick fur ranging from dark brown to blond. Much larger than a black bear with a more muscular profile.`,[`Grizzly`]),p(`Common Loon`,`Common loon`,`In breeding plumage: a striking black-and-white checkered back, black head with an iridescent green sheen, bright red eye, and a black-and-white necklace band. Low-slung body on water.`,[`Loon`]),p(`Gibbon`,`Lar gibbon`,`A small ape with extremely long arms relative to body size, no tail, and a furry coat ranging from black to buff or white. White face ring around a dark face; swings through trees (brachiates).`),p(`Bat`,`Little brown bat`,`A tiny mouse-sized mammal with thin leathery wings connecting long finger bones to the body, small rounded ears, and dark brown fur. Seen flying in erratic swooping patterns at dusk.`)]},{id:`horses`,name:`Horses`,subject:`Animals & Nature`,difficulty:`Medium`,description:`Name the item, body part, breed, riding event, person, movie, or TV show associated with horses.`,items:[p(`Arabian`,`Arabian horse`,`A refined, elegant breed with a distinctively dished profile (concave face), large flared nostrils, wide-set eyes, and a high arched tail carriage. Often grey, chestnut, or bay.`,[`Arabian Horse`]),p(`Thoroughbred`,`Thoroughbred`,`A lean, athletic racehorse with long legs, a deep chest, a narrow refined head, and thin skin. Coat is typically bay, chestnut, or grey. Built for speed — all muscle and no fat.`),p(`Quarter Horse`,`American Quarter Horse`,`A stocky, heavily-muscled horse with powerful hindquarters, a broad chest, and a short refined head. Coat varies but bay, chestnut, and sorrel are common. Compact and fast over short distances.`,[`American Quarter Horse`]),p(`Appaloosa`,`Appaloosa`,`Instantly recognizable for bold spotted coat — white base with dark spots (leopard pattern) or dark coat with a white spotted 'blanket' over the rump. White sclera and striped hooves.`),p(`Mustang`,`Mustang (horse)`,`A free-roaming feral horse of the American West — lean and athletic with a rough, wild mane. Coat colour varies widely (pinto, bay, roan, dun). More compact build than domestic breeds.`),p(`Clydesdale`,`Clydesdale horse`,`A massive draft horse — tall, very heavy, and powerful with feathering (long silky hair) on the lower legs and feet. Bay or roan with white markings on the face and legs. Famous from Budweiser ads.`),p(`Palomino`,`Palomino`,`A horse colour type rather than a breed — golden yellow or golden chestnut coat paired with a white or cream mane and tail. The combination gives a striking metallic golden appearance.`),p(`Paint Horse`,`American Paint Horse`,`A stock horse with large irregular patches of white and any other colour (usually brown, black, or chestnut). Pinto markings over a Quarter Horse build — like a colourful western ranch horse.`,[`American Paint`]),p(`Friesian`,`Friesian horse`,`An all-black (usually) heavy horse with a long flowing mane, heavily feathered legs, arched neck, and high-stepping action. Dramatic and elegant — often used in films for its striking black appearance.`),p(`Saddle`,`Saddle`,`A leather seat strapped to a horse's back. Western saddles have a prominent horn at the front; English saddles are flat and small. Typically brown or tan leather with metal D-rings and stirrups.`),p(`Bridle`,`Bridle`,`The leather headgear used to control a horse — consists of a headstall, bit (metal bar in the mouth), and reins. Brown or black leather straps framing the horse's face and neck.`),p(`Horseshoe`,`Horseshoe`,`A U-shaped iron shoe nailed to the underside of a horse's hoof. Made of curved steel with nail holes. Also used as a good-luck charm hung on a wall.`),p(`Stirrup`,`Stirrup`,`A D-shaped metal loop hanging from the saddle by a leather strap. The rider puts their foot in it for support while riding. Usually made of stainless steel.`),p(`Mane`,`Mane (horse)`,`The long hair growing from the crest of the horse's neck. Can be natural (wild and flowing) or groomed (clipped short or braided). Usually matches or contrasts with the coat colour.`,[`Horse Mane`]),p(`Fetlock`,`Fetlock`,`The joint on the lower leg of a horse located just above the hoof — like the ankle area. Often has a tuft of longer hair called the fetlock. It bends backward when the horse bears weight.`),p(`Hoof`,`Hoof`,`The hard, horn-like foot of a horse — black or white, crescent-shaped when viewed from below, with a soft 'frog' (V-shaped pad) in the centre. A farrier trims and shoes it.`),p(`Foal`,`Foal`,`A newborn or young horse — disproportionately long spindly legs, a fuzzy soft coat, and large innocent eyes. Often seen wobbling on unsteady legs shortly after birth.`,[`Baby Horse`]),p(`Stallion`,`Stallion`,`An uncastrated adult male horse — typically more muscular and cresty-necked than a mare or gelding, with a more alert or aggressive posture. Same breeds and coats as other horses.`),p(`Kentucky Derby`,`Kentucky Derby`,`The famous horse race held at Churchill Downs, Louisville — crowds in elaborate hats, horses in brightly coloured jockey silks, and the twin spires of the historic grandstand as backdrop.`),p(`Dressage`,`Dressage`,`Competitive horse riding where horse and rider perform precise, controlled movements in an arena. Horses wear braided manes; riders wear top hats, tailcoats, white breeches, and tall black boots.`),p(`Polo`,`Polo (sport)`,`Players on horseback wielding long-handled mallets to hit a white ball through goalposts. Horses wear protective leg wraps; riders wear helmets, white riding trousers, and polo shirts.`,[`Polo (sport)`]),p(`Barrel Racing`,`Barrel racing`,`A western rodeo event where a horse and rider gallop around three barrels in a cloverleaf pattern as fast as possible. Indoor arena, dirt floor, bright western saddles and attire.`),p(`Steeplechase`,`Steeplechase (horse racing)`,`A cross-country horse race featuring jumps over fences, hedges, ditches, and water obstacles. Horses leap over solid brush fences while jockeys crouch low in coloured silks.`),p(`Secretariat`,`Secretariat (horse)`,`A famous chestnut Thoroughbred racehorse with a distinctive large white blaze on the face and white stockings on three legs. Known for his enormous stride and muscular build.`),p(`Seabiscuit`,`Seabiscuit`,`A legendary chestnut racehorse from the 1930s — smaller and slightly knobby-kneed compared to typical racehorses, but with great speed. Often photographed winning at full gallop.`),p(`Mr. Ed`,`Mister Ed`,`The talking horse from the 1960s TV show — a palomino (golden coat, white mane and tail) with a remarkable ability to appear to speak. Often photographed in a stable with his owner.`),p(`Spirit`,`Spirit: Stallion of the Cimarron`,`An animated buckskin mustang (tan body, dark mane and tail) with expressive blue eyes and a white blaze. The horse protagonist of the 2002 DreamWorks animated film.`),p(`Black Beauty`,`Black Beauty`,`A jet-black horse with a star (white mark) on the forehead, featured in Anna Sewell's classic novel. Often depicted as a sleek, elegant, well-muscled black horse.`),p(`Man o' War`,`Man o' War`,`One of history's greatest racehorses — a chestnut Thoroughbred of exceptional size and muscular build. Often photographed as a statue or in vintage sepia racing photos.`,[`Man o War`]),p(`Farrier`,`Farrier`,`A skilled tradesperson who trims and shoes horses. Seen crouching or kneeling beside a horse's raised hoof, holding metal horseshoes and nails, using an anvil, and wearing a leather apron.`,[`Blacksmith`])]},{id:`taxidermy`,name:`Taxidermy`,subject:`Animals & Nature`,difficulty:`Hard`,description:`Name the stuffed animal.`,items:[p(`White-tailed Deer`,`White-tailed deer`,`A mounted deer head — large dark eyes, a tawny-brown face, and branching antlers (on bucks). The neck is set on a wooden plaque, often on a wall. Antler spread and mass vary.`,[`Deer`]),p(`Black Bear`,`American black bear`,`A full-body mount of a medium-sized bear — black or dark-brown fur, rounded face with small ears, no shoulder hump. Often posed standing upright with paws raised.`,[`Bear`]),p(`Mountain Lion`,`Cougar`,`A large tawny-gold cat mount — long, lean body, long tail, small rounded ears, and a broad flattened face. Often posed crouching or in a snarling display.`,[`Cougar`,`Puma`]),p(`Elk`,`Elk`,`A massive deer mount with large spreading antlers (bulls) that have multiple points and a characteristic 'bugling' beam. Tan to reddish-brown coat; pale rump patch.`,[`Wapiti`]),p(`Moose`,`Moose`,`The largest deer mount — huge palmate (palm-shaped) antlers, a bulbous drooping nose, and a long dewlap (bell) under the chin. Dark brown coat; massive head.`),p(`Bald Eagle`,`Bald eagle`,`A full-body or wing-spread mount of a large raptor with a bright white head and tail, yellow hooked beak, and yellow talons. Body is dark brown.`,[`Eagle`]),p(`Wild Turkey`,`Wild turkey`,`A full-body mount of a large bronze-brown bird with an iridescent sheen, a bald red-and-blue head, and a fanned tail. Often displayed with wings spread.`,[`Turkey`]),p(`Ring-necked Pheasant`,`Ring-necked pheasant`,`A colourful game bird mount — male has an iridescent green-purple head, red eye wattles, white neck ring, bronze-gold body, and a very long pointed tail.`,[`Pheasant`]),p(`Mallard`,`Mallard`,`A duck mount with the male's classic glossy green head, white neck ring, and chestnut-brown breast. Blue-purple wing patch (speculum) visible on the folded wing.`,[`Duck`]),p(`Red Fox`,`Red fox`,`A full-body mount with vivid rusty-orange fur, white underbelly, black legs, and a large bushy tail tipped in white. Bright amber glass eyes and a pointed muzzle.`,[`Fox`]),p(`Coyote`,`Coyote`,`A medium-sized canid mount — grey-brown coat, pointed muzzle, large ears, and a bushy tail. Leaner and lighter than a wolf; often posed in a standing alert posture.`),p(`Gray Wolf`,`Gray wolf`,`A large full-body or shoulder mount — thick grey-brown coat, broad muzzle, amber eyes, and a bushy tail. Noticeably larger and heavier-built than a coyote.`,[`Wolf`]),p(`Bobcat`,`Bobcat`,`A medium-sized wild cat mount — spotted brown and tan fur, tufted pointed ears, a short 'bobbed' tail, and prominent sideburn tufts of fur. Looks like a stocky spotted cat.`),p(`American Alligator`,`American alligator`,`A full-body mount of a massive dark reptile with armored, ridged scales, a broad rounded snout, and rows of pointed teeth. Often posed with mouth open in a wide snarl.`,[`Alligator`]),p(`Largemouth Bass`,`Largemouth bass`,`A mounted game fish — dark olive-green back with a horizontal stripe of dark blotches, silver-white belly, and a very wide mouth that extends past the eye.`,[`Bass`]),p(`Rainbow Trout`,`Rainbow trout`,`A mounted fish with a distinctive pink-to-red lateral stripe, silver sides with black spots, and an olive-green back. Spots cover the body, fins, and tail.`,[`Trout`]),p(`Blue Marlin`,`Blue marlin`,`A massive mounted trophy fish — royal blue back shading to silver-white belly, a long pointed upper jaw (bill), and a stiff forked tail. Often displayed on a wooden plaque.`,[`Marlin`]),p(`American Bison`,`American bison`,`A massive mount with a huge woolly dark-brown head, high humped shoulder, and trimmer hindquarters. Short curved horns; beard of shaggy hair under the chin.`,[`Bison`,`Buffalo`]),p(`Pronghorn`,`Pronghorn`,`A mounted antelope-like animal — tan-brown with white belly, white cheek patches, and distinctive pronged horns (not antlers) with a forward-pointing prong near the tip.`,[`Antelope`]),p(`Bighorn Sheep`,`Bighorn sheep`,`A stocky tan mount with a pale rump patch. Rams have massive coiled brown horns that curl back and forward in a full circle — the defining feature.`),p(`Wild Boar`,`Wild boar`,`A stocky, tusked pig mount — dark grey-brown bristly fur, a prominent mane of longer hair along the spine, and sharp upward-curving tusks on either side of the snout.`,[`Boar`]),p(`American Beaver`,`American beaver`,`A rounded, dark-brown rodent mount with a flat, scaled paddle-shaped tail, large orange front teeth, and small ears. Stocky build and dense, glossy fur.`,[`Beaver`]),p(`Raccoon`,`Raccoon`,`A small mount with a distinctive black mask across the eyes, grey-brown fur, and a bushy tail with alternating black and grey rings. Round ears and a pointed muzzle.`),p(`Eastern Gray Squirrel`,`Eastern gray squirrel`,`A small mount with grey fur, a paler underbelly, and a large bushy grey tail. Round dark eyes and small round ears. Familiar tree squirrel pose.`,[`Squirrel`]),p(`Eastern Cottontail`,`Eastern cottontail`,`A small rabbit mount — grey-brown fur, large hind legs, large upright ears, and a distinctive fluffy white puffball tail (the 'cottontail'). Soft-looking and compact.`,[`Rabbit`]),p(`Indian Peafowl`,`Indian peafowl`,`A full-body or fan-only mount of a peacock — iridescent blue-green plumage, a crested head, and a spectacular fan of tail feathers with vivid eye spots of blue and green.`,[`Peacock`]),p(`Great Horned Owl`,`Great horned owl`,`A full-body mount of a large owl — mottled brown-and-grey barred plumage, yellow eyes, white throat patch, and prominent ear tufts that look like horns.`,[`Owl`]),p(`Western Diamondback Rattlesnake`,`Western diamondback rattlesnake`,`A coiled or stretched snake mount — thick body with brown-grey diamond-shaped patterns, a broad triangular head, and the iconic segmented rattle at the tail tip.`,[`Rattlesnake`]),p(`Northern Pike`,`Northern pike`,`A mounted predatory fish — long torpedo-shaped body, dark olive-green with light yellow spots, and a large flat 'duck-bill' mouth filled with sharp teeth.`,[`Pike`]),p(`Mule Deer`,`Mule deer`,`A mounted deer with distinctive very large mule-like ears, a black-tipped white tail, and antlers that fork equally (not a single main beam). Grey-brown winter coat.`)]},{id:`pigs`,name:`Pigs`,subject:`Animals & Nature`,difficulty:`Easy`,description:`Name the item, food, body part, cut of meat, game, or character associated with Pigs.`,items:[p(`Piglet`,`Piglet (Winnie-the-Pooh)`,`A tiny pink cartoon piglet from Winnie-the-Pooh — wearing a pink-and-white striped onesie, with very large ears, tiny eyes, and a small pink snout.`,[`Winnie the Pooh Piglet`]),p(`Miss Piggy`,`Miss Piggy`,`The glamorous Muppet pig — blonde curled hair, long dramatic eyelashes, an upturned snout, and typically dressed in sequined or evening gowns. Often seen in diva poses.`),p(`Porky Pig`,`Porky Pig`,`The classic Warner Bros. cartoon pig — round pink face, large ears, a fat pink body, blue or red jacket, and a bow tie. Often seen stuttering the famous sign-off line.`),p(`Babe`,`Babe (film)`,`The small, wide-eyed white piglet from the 1995 film — clean pale pink skin, large round ears, and an innocent expression. Seen on a farm herding sheep.`,[`Babe (film)`]),p(`Wilbur`,`Charlotte's Web`,`A small white pig from E.B. White's story — clean pink and white colouring, a curly tail, and a gentle, friendly expression. Lives in a barn and is friends with a spider.`,[`Charlotte's Web Pig`]),p(`Napoleon`,`Animal Farm`,`A fictional pig in George Orwell's story — a large black Berkshire boar. In illustrations typically shown as a bulky, imposing pig in a dominant posture, sometimes wearing human clothes.`),p(`Hamm`,`Toy Story`,`A piggy bank character from Toy Story — a plastic pink money-box pig with painted-on eyes and a coin slot on top. Blocky and smooth rather than a realistic pig.`,[`Toy Story Pig`]),p(`Peppa Pig`,`Peppa Pig`,`A simple cartoon pink pig — round pink face with two circles for nostrils, two small eyes on top, and a round pink body. Wears a red dress and is almost always jumping in muddy puddles.`),p(`Bacon`,`Bacon`,`Thin strips of cured pork belly — pinkish-red streaky meat with white fat running through it, typically fried until crispy and brown-edged in a wavy or curly shape.`),p(`Ham`,`Ham`,`A large cured leg of pork — rounded oval shape, pink-red meat, sometimes with a shiny honey or glazed surface and scored crosshatch pattern with cloves poked in.`),p(`Pork Chop`,`Pork chop`,`A thick cut of pork containing a T-shaped bone — pale pink raw meat that turns white when cooked. Often pan-fried or grilled with visible grill marks.`),p(`Pulled Pork`,`Pulled pork`,`Slow-cooked pork shoulder shredded into long, juicy strands — dark caramelized edges and tender pale pink interior, typically piled high with BBQ sauce dripping.`),p(`Prosciutto`,`Prosciutto`,`Paper-thin slices of dry-cured Italian ham — deep pink-red colour with white fat marbling. Semi-translucent when thin-sliced; draped in elegant folds on charcuterie boards.`),p(`Pancetta`,`Pancetta`,`Italian cured pork belly — rolled into a cylinder or flat, with alternating layers of pink meat and white fat. Sliced into rounds revealing a spiral pattern.`),p(`Pork Rinds`,`Chicharrón`,`Puffed, crispy fried pork skin — light golden to deep brown, airy and bubbly-textured like a savoury meringue. Often comes in bag snacks.`,[`Chicharron`,`Cracklings`]),p(`Salami`,`Salami`,`A cured meat sausage — firm, dark-red slices with white fat dotted throughout. Often displayed in a whole log or as thin circular slices on a board.`),p(`Pepperoni`,`Pepperoni`,`Thin slices of cured pork-beef sausage — round, slightly curved at the edges, reddish-orange with white fat flecks. Classic pizza topping; curls and crisps when baked.`),p(`Pork Loin`,`Pork loin`,`A thick, lean cylindrical roast — pale pink raw or golden-brown roasted exterior with a white fat cap along one side. Often shown tied with kitchen twine.`,[`Loin`]),p(`Spare Ribs`,`Spare ribs`,`A rack of pork ribs — long flat slab with individual bones, coated in dark caramelized BBQ sauce and showing charred edges. Served in a long strip.`,[`Ribs`]),p(`Snout`,`Snout`,`A pig's nose — a round, flat disc at the end of the muzzle with two large prominent round nostrils. Pink and moist; the most iconic pig facial feature.`),p(`Trotter`,`Pig's trotters`,`A pig's foot — small, cloven hoof with pink skin and two distinct toe sections. Sometimes braised or pickled; shown whole or split.`,[`Pig's Feet`]),p(`Hampshire Pig`,`Hampshire pig`,`A large black pig with a distinctive white band ('belt') running around the shoulders and forelegs. Black snout; upright ears. Very recognizable two-tone pattern.`),p(`Yorkshire Pig`,`Yorkshire pig`,`A large all-white pig with pink skin showing through sparse white hair, upright ears, and a slightly dished face. The classic commercial white farm pig.`),p(`Berkshire Pig`,`Berkshire pig`,`A black pig with white 'points' — white feet, white tip of tail, and white on the snout and face. Slightly dished face; prick ears. Muscular, rounded body.`),p(`Piggy Bank`,`Piggy bank`,`A ceramic or plastic pink pig-shaped coin savings box — rotund pig body, four stubby legs, painted-on pink features, and a coin slot on top or back.`),p(`Pass the Pigs`,`Pass the Pigs`,`A dice-based tabletop game using two small rubber pigs instead of dice. The mini pigs are pink with black spots; players toss them to land in various scoring positions.`),p(`Pig Latin`,`Pig Latin`,`A word game language where words are rearranged — visually represented by speech bubbles coming from a cartoon pig, or a pig with a speaking pose and text.`),p(`Truffle Hunting`,`Truffle hunting`,`A pig (or dog) foraging under a tree for underground truffles — pig has its snout buried in the soil among tree roots. Black or white golf-ball-sized fungi are the prize.`,[`Truffle`]),p(`Pigsty`,`Pigsty`,`A muddy farm enclosure with a wooden fence or pen, thick brown mud, and pigs rolling or lying in it. Associated with mess, smell, and cheerful muddy pigs.`,[`Pig Pen`,`Sty`]),p(`Sausage`,`Sausage`,`A cylindrical meat product in a casing — pale pink raw or golden-brown fried with a shiny skin. Links are joined in a twist; bratwurst and breakfast sausages are common shapes.`)]},{id:`ceramics`,name:`Ceramics`,subject:`Arts & Culture`,difficulty:`Medium`,description:`Name the ceramic item you see.`,items:[p(`Terracotta Pot`,`Terracotta`,`An unglazed red-orange earthenware pot — rough-textured, warm reddish-brown colour, often in a classic flower-pot shape with a drainage hole at the base.`,[`Terracotta`,`Terra Cotta`]),p(`Porcelain`,`Porcelain`,`Smooth, white, translucent ceramic — thin walls that glow slightly when held to light. Typically pure white or with fine blue-and-white or delicate floral patterns; feels cool and glassy.`),p(`Ceramic Tile`,`Ceramic tile`,`Flat square or rectangular fired clay tiles — can be plain white, coloured, or patterned; often glazed for a shiny surface. Used on floors or walls in grids with grout lines.`,[`Tile`]),p(`Stoneware`,`Stoneware`,`Dense, heavy pottery with a natural earthy appearance — greyish, beige, or brown tones, often with a mottled or salt-glazed surface. Thick walls; looks and feels very solid.`),p(`Earthenware`,`Earthenware`,`Porous, opaque pottery in warm brown, red, or orange tones. Often unglazed or with a simple transparent glaze. Less refined-looking than porcelain; typical terracotta plant pots.`),p(`Delftware`,`Delftware`,`Dutch tin-glazed pottery with a white background and cobalt-blue painted designs — typically windmills, tulips, and scenes of Dutch life. Instantly recognizable blue-on-white pattern.`,[`Delft`]),p(`Majolica`,`Majolica`,`Tin-glazed earthenware with bright, opaque, colourful painted designs — vivid yellows, blues, greens, and oranges. Italian origin; often features fruits, vegetables, or geometric patterns.`,[`Maiolica`]),p(`Wedgwood`,`Wedgwood`,`Famous for its pale blue 'Jasperware' — a matte pale blue ceramic body with white relief cameo figures (classical scenes, people) applied in raised white on the surface. Very elegant.`),p(`Raku Pottery`,`Raku ware`,`Japanese-inspired firing technique producing dramatic, unpredictable results — crackled glaze, black carbon smoke patterns, metallic lustre, or stark contrast of white and black.`,[`Raku`]),p(`Celadon`,`Celadon`,`East Asian glazed pottery with a characteristic pale grey-green to jade-green glaze — smooth, cool, translucent-looking glaze that resembles jade stone. Often fine crackle lines.`),p(`Hummel Figurine`,`Hummel figurines`,`Small German porcelain figurines of rosy-cheeked children in traditional Bavarian clothes — a boy with a hat, a girl with braids, in pastoral scenes. Matte finish, pastel colours.`,[`Hummel`]),p(`Toby Jug`,`Toby jug`,`A ceramic jug shaped like a seated man in 18th-century dress — three-cornered hat forms the rim and spout, the face is the front, legs form the body. Rich brown and coloured glazes.`),p(`Amphora`,`Amphora`,`An ancient Greek or Roman two-handled storage jar — tall, oval body tapering to a point or foot, with two vertical handles at the neck. Often red-and-black with painted figures.`),p(`Tureen`,`Tureen`,`A large, deep ceramic bowl with a domed lid and matching handles — used for serving soup at the table. Often white or cream with floral patterns; typically oval in shape.`),p(`Gravy Boat`,`Gravy boat (tableware)`,`An elongated oval ceramic vessel with a pouring spout on one end and a handle on the other — used to pour gravy at dinner. Usually matches a dinner service pattern.`,[`Gravy Boat`]),p(`Blue and White Pottery`,`Blue and white pottery`,`Ceramic ware with a white or off-white body decorated with cobalt blue patterns — flowers, dragons, landscapes. Found in Chinese, Dutch, and Japanese traditions; very recognizable palette.`),p(`Kiln`,`Kiln`,`A large industrial oven for firing pottery — typically a brick or metal chamber or dome structure. Can look like a rounded igloo (anagama), a tower, or a large metal box with thick walls.`),p(`Pottery Wheel`,`Potter's wheel`,`A flat spinning disc mounted on a vertical shaft — a potter sits at it and centres clay on the spinning surface. Electric ones have a foot pedal; old ones are kicked. Often clay-covered.`,[`Potter's Wheel`]),p(`Ceramic Glaze`,`Ceramic glaze`,`The shiny, glass-like coating on fired pottery — appears as a smooth, reflective, coloured surface on bowls, vases, or tiles. Can be glossy, matte, or textured; in any colour.`,[`Glaze`]),p(`Bisque`,`Bisque (pottery)`,`Unglazed, once-fired ceramic — white or cream coloured, matte and slightly chalky surface. Smooth but porous; looks like white chalk or very pale bone.`),p(`Mosaic`,`Mosaic`,`A surface made of small coloured pieces (tesserae) of ceramic, glass, or stone arranged to create a pattern or picture. Looks like a colourful pixelated image with visible grout lines.`),p(`Bone China`,`Bone china`,`The finest, whitest, most translucent of porcelain — gleaming bright white, almost luminous, with a very smooth surface. Often decorated with delicate flowers or gold trim.`),p(`Salt-glazed Stoneware`,`Salt-glazed stoneware`,`Pottery with a distinctive 'orange-peel' texture on the surface — caused by salt vapour during firing. Grey-brown in colour with a slightly pitted, pebbly glaze surface.`),p(`Faience`,`Tin-glazed pottery`,`Ancient Egyptian or Near Eastern glazed pottery with a bright turquoise or blue-green colour — shiny and glassy on the outside. Often seen as tiny beads, amulets, or tiles.`,[`Tin-glazed Pottery`]),p(`Figurine`,`Figurine`,`A small ceramic figure of a person, animal, or character — finely detailed and painted. Ranges from Lladro-style people to animal shapes; glossy or matte finish, usually hand-painted.`),p(`Crock`,`Crock (dishware)`,`A tall, cylindrical stoneware container with thick walls — grey-tan with blue cobalt painted designs (in antique versions) or plain grey. Used for pickling or food storage.`),p(`Slip Casting`,`Slip casting`,`Liquid clay (slip) poured into a plaster mould and allowed to set — results in smooth, identical ceramic shapes. Visible at the seam line where mould halves meet.`,[`Slip Cast`]),p(`Jasperware`,`Jasperware`,`Wedgwood's signature unglazed stoneware — pale blue, sage green, or lilac matte body with white raised (relief) cameo decoration of classical figures and borders. Very refined look.`),p(`Porcelain Doll`,`Porcelain doll`,`A doll with a head (and often hands and feet) made from shiny white porcelain — glossy pale face, painted rosy cheeks, glass-like eyes, and often an elaborate period costume.`,[`China Doll`]),p(`Ewer`,`Ewer`,`A tall ceramic pitcher with a wide mouth, curved handle, and a pronounced spout or lip — decorative more than functional. Often ornately decorated in Victorian or historical styles.`)]},{id:`shakespeare-plays`,name:`Shakespeare Plays`,subject:`Arts & Culture`,difficulty:`Hard`,description:`Name the Shakespeare play depicted in this famous painting or scene.`,items:[m(`Hamlet`,`https://commons.wikimedia.org/wiki/Special:FilePath/John_Everett_Millais_-_Ophelia_-_Google_Art_Project.jpg`,`Millais' Ophelia — a pale woman in a white floral dress floating on her back in a stream, arms outstretched, eyes open, surrounded by flowers and lush green vegetation.`),m(`Romeo and Juliet`,`https://commons.wikimedia.org/wiki/Special:FilePath/Francesco_Hayez_-_Romeo_and_Juliet_(1823).jpg`,`Hayez's painting shows a passionate kiss on a staircase — a young man in red medieval doublet embracing a woman in a pale blue gown. Romantic, intense pose.`),m(`Macbeth`,`https://commons.wikimedia.org/wiki/Special:FilePath/Fuseli_-_The_Three_Witches.jpeg`,`Fuseli's Three Witches — three eerily lit, pale-faced women with outstretched arms and pointing fingers against a dark stormy background. Supernatural and sinister.`),m(`A Midsummer Night's Dream`,`https://commons.wikimedia.org/wiki/Special:FilePath/A_Midsummer_Night%27s_Dream_-_Titania_and_Bottom.jpg`,`Titania (fairy queen) asleep or embracing Bottom, who has a donkey's head — lush green forest, fairies, flowers everywhere. Whimsical and dreamlike.`,[`Midsummer Night's Dream`]),m(`Othello`,`https://commons.wikimedia.org/wiki/Special:FilePath/Desdemona_and_Othello_by_Antonio_Muñoz_Degrain.jpg`,`Muñoz Degrain's painting shows Othello (a dark-skinned Moorish man in rich Renaissance dress) with Desdemona (a pale woman in white). Dramatic, dimly lit interior.`),m(`King Lear`,`https://commons.wikimedia.org/wiki/Special:FilePath/King_Lear_mourns_Cordelia%27s_death.jpg`,`An old bearded king in robes holding a dead young woman in his arms — anguished expression, dramatic lighting. Usually shows a vast stormy landscape backdrop.`),m(`The Tempest`,`https://commons.wikimedia.org/wiki/Special:FilePath/The_Tempest_-_Prospero_(John_William_Waterhouse,_1916).jpg`,`Waterhouse's painting shows a woman (Miranda) reading on a rocky seashore, with a crouching dark figure (Caliban) lurking in shadows nearby. Dreamy and mysterious.`,[`Tempest`]),m(`Much Ado About Nothing`,`https://commons.wikimedia.org/wiki/Special:FilePath/Much_Ado_About_Nothing_by_Alfred_Elmore.jpg`,`Alfred Elmore's painting shows a woman in a bright period gown holding a letter, in an Italianate garden setting. Playful and romantic, not tragic.`),m(`Twelfth Night`,`https://commons.wikimedia.org/wiki/Special:FilePath/Twelfth_Night_by_Walter_Howell_Deverell.jpg`,`Deverell's painting shows a woman dressed as a male page presenting something to Olivia (a grand lady). Bright colours, Elizabethan costumes, formal garden setting.`),m(`The Merchant of Venice`,`https://commons.wikimedia.org/wiki/Special:FilePath/Portia_and_Shylock.jpg`,`Shows Portia (as a lawyer in robes) in a courtroom confrontation with Shylock (a grey-bearded man in dark clothing). Tense, legal drama setting.`,[`Merchant of Venice`]),m(`Julius Caesar`,`https://commons.wikimedia.org/wiki/Special:FilePath/Vincenzo_Camuccini_-_La_morte_di_Cesare.jpg`,`Camuccini's 'Death of Caesar' — toga-clad men in a crowded marble Roman room, with Caesar collapsed among them and senators with daggers raised. Very dramatic.`),m(`Richard III`,`https://commons.wikimedia.org/wiki/Special:FilePath/Clarence_drowning_in_the_butt_of_malmsey.jpg`,`Shows a man being drowned in a large wooden barrel (butt of malmsey wine) — dark, grim scene with hands and struggling figures. Historical murder.`),m(`Henry V`,`https://commons.wikimedia.org/wiki/Special:FilePath/Henry_V_at_the_Battle_of_Agincourt,_painted_by_Sir_John_Gilbert.jpg`,`Gilbert's painting shows Henry V on horseback in armour at Agincourt — chaotic medieval battlefield, armoured soldiers, horses, flags. Heroic battle scene.`),m(`As You Like It`,`https://commons.wikimedia.org/wiki/Special:FilePath/As_You_Like_It_by_John_Pettie.jpg`,`John Pettie's painting features characters in Elizabethan/rustic costume in an outdoor pastoral setting — forests of Arden, joyful romantic atmosphere.`),m(`The Taming of the Shrew`,`https://commons.wikimedia.org/wiki/Special:FilePath/The_Taming_of_the_Shrew_by_Washington_Allston.jpg`,`Washington Allston shows a combative domestic scene — a man (Petruchio) and woman (Katherine) in period dress, confrontational poses, interior setting.`,[`Taming of the Shrew`]),m(`The Winter's Tale`,`https://commons.wikimedia.org/wiki/Special:FilePath/Leontes_and_Hermione_by_George_Henry_Harlow.jpg`,`Harlow's painting shows Hermione (a stately woman in white) before Leontes (a dark, agitated king). Formal Elizabethan court setting, tense interaction.`,[`Winter's Tale`]),m(`Antony and Cleopatra`,`https://commons.wikimedia.org/wiki/Special:FilePath/Lawrence_Alma-Tadema_-_The_Meeting_of_Antony_and_Cleopatra.jpg`,`Alma-Tadema's meeting scene — Cleopatra reclining on a luxurious golden barge with Antony in Roman armour. Rich colours, Egyptian and Roman opulence.`),m(`Measure for Measure`,`https://commons.wikimedia.org/wiki/Special:FilePath/William_Holman_Hunt_-_Claudio_and_Isabella.jpg`,`Holman Hunt's painting shows a brother and sister in an intimate, imploring conversation — he wears prisoner garb, she is a novice nun. Dimly lit interior.`),d(`The Merry Wives of Windsor`,`The Merry Wives of Windsor`,[`Merry Wives of Windsor`]),d(`Coriolanus`,`Coriolanus (play)`),d(`Titus Andronicus`,`Titus Andronicus`),d(`The Comedy of Errors`,`The Comedy of Errors`,[`Comedy of Errors`]),d(`Love's Labour's Lost`,`Love's Labour's Lost`),d(`All's Well That Ends Well`,`All's Well That Ends Well`),d(`Troilus and Cressida`,`Troilus and Cressida`),d(`The Two Gentlemen of Verona`,`The Two Gentlemen of Verona`,[`Two Gentlemen of Verona`]),d(`Timon of Athens`,`Timon of Athens`),d(`Pericles`,`Pericles, Prince of Tyre`),d(`Cymbeline`,`Cymbeline`),d(`The Two Noble Kinsmen`,`The Two Noble Kinsmen`,[`Two Noble Kinsmen`])]},{id:`broadway-shows`,name:`Broadway Shows`,subject:`Arts & Culture`,difficulty:`Medium`,description:`Name the Broadway play or musical.`,items:[p(`Hamilton`,`Hamilton (musical)`,`Hip-hop Founding Fathers in Revolutionary-era costumes — tricorn hats, breeches, waistcoats, ruffled shirts. Cast is multiracial; staging features a rotating stage platform.`),p(`The Lion King`,`The Lion King (musical)`,`Spectacular African-inspired costumes with actors wearing animal puppet masks — a giraffe costume on stilts, a lion headpiece, a leopard bodysuit. Colourful headdresses dominate.`,[`Lion King`]),p(`Wicked`,`Wicked (musical)`,`Two witches dominate: Glinda in a sparkly white ballgown with a tiara and wand; Elphaba in all black with a pointed black hat. Iconic bubble-filled opening number.`),p(`Les Misérables`,`Les Misérables (musical)`,`Revolving stage of 19th-century Paris — barricade scenes with desperate people in grimy clothes, a girl holding a French Tricolour flag. The famous red-and-blue poster image.`,[`Les Miserables`]),p(`Chicago`,`Chicago (musical)`,`Jazz-era showgirls in black lingerie, fishnet stockings, corsets, and bowler hats performing under harsh spotlights. Very stylised, black-and-white aesthetic.`),p(`The Phantom of the Opera`,`The Phantom of the Opera (1986 musical)`,`A masked man in a white cape and black formal wear holding a candelabra; a chandelier dominates the ceiling of an ornate opera house. Iconic half-white mask.`,[`Phantom of the Opera`]),p(`Rent`,`Rent (musical)`,`Bohemian New Yorkers in 1990s grunge — ripped jeans, leather jackets, knit hats, bright scarves. Stark fire-escape set; very urban and gritty aesthetic.`),p(`Cats`,`Cats (musical)`,`Actors in full-body cat costumes with painted faces, furry leg warmers, and wild wig-like hair — entirely covered in feline makeup and tails. Junkyard set.`),p(`Sweeney Todd`,`Sweeney Todd: The Demon Barber of Fleet Street (musical)`,`Victorian London atmosphere — a barber in a white apron wielding a straight razor, grey industrial set, Mrs. Lovett's meat-pie shop below. Very dark and Gothic.`),p(`Into the Woods`,`Into the Woods`,`Fairy-tale characters in a dark, tangled forest — Little Red Riding Hood, Cinderella, a witch in a dark cloak, a giant's shadowy presence above. Storybook costumes.`),p(`West Side Story`,`West Side Story`,`1950s New York street gangs — the Jets in pale yellows and browns, the Sharks in purple and red. Snapping fingers, athletic choreography, fire-escape backdrops.`),p(`A Chorus Line`,`A Chorus Line`,`Dancers in leotards and tights standing in a line on a bare stage with mirrors behind them, all holding headshots. Stark, minimal staging with a reflecting gold finale.`),p(`Oklahoma!`,`Oklahoma!`,[`Oklahoma`],`Frontier Americana — men in cowboy hats, boots, and suspenders; women in gingham and calico dresses with bonnets. Bright sunny fields and barn-dance choreography.`),p(`Annie`,`Annie (musical)`,`A red-headed girl in a red dress with white collar, wearing no shoes or with black shoes. Depression-era orphanage setting; Daddy Warbucks is a bald man in a tuxedo.`),p(`Cabaret`,`Cabaret (musical)`,`Weimar-era Berlin cabaret: the Emcee in heavy painted makeup, suspenders, and a bowler hat; Kit Kat Girls in fishnets and corsets. Dark, decadent atmosphere.`),p(`Grease`,`Grease (musical)`,`1950s high school — the Pink Ladies in pink satin jackets; the Greasers in black leather jackets, slicked hair, and tight jeans. Bright diner and school gym settings.`),p(`Guys and Dolls`,`Guys and Dolls`,`1950s New York gamblers in bright pinstripe suits, fedoras, and spats; showgirls in colourful chorus costumes. Very stylised, bright colours.`),p(`Hair`,`Hair (musical)`,`1960s hippies with natural Afros and long flowing hair, tie-dye and beaded costumes, flowers. Famous for nudity; psychedelic poster art and protest atmosphere.`),p(`Mamma Mia!`,`Mamma Mia! (musical)`,`1970s ABBA-era disco fashion — white flared jumpsuits, platform shoes, sequined tops. Greek island setting with blue-and-white whitewashed scenery.`,[`Mamma Mia`]),p(`Spring Awakening`,`Spring Awakening (musical)`,`1890s German schoolchildren in period clothes — boys in suits and suspenders, girls in white blouses and skirts. Contrasts Victorian repression with explosive rock choreography.`),p(`Hairspray`,`Hairspray (musical)`,`1960s Baltimore — big bouffant hairdos, poodle skirts, and bright pastel colours. Integration of a TV dance show; lively, colourful retro aesthetic.`),p(`Mean Girls`,`Mean Girls (musical)`,`High school plastics in pink — pink outfits, designer bags, cheerleader energy. North Shore High sets and lockers; very millennial pop aesthetic.`),p(`Beetlejuice`,`Beetlejuice (musical)`,`The title character in black-and-white striped suit with wild white hair and green-tinted face makeup. Gothic, cartoonish set design; neon black-light aesthetic.`),p(`Six`,`Six (musical)`,`Six Tudor queens in sparkling modern pop star costumes — sequined mini-dresses, dramatic wigs and crowns. Concert stage setup with a live band.`),p(`Dear Evan Hansen`,`Dear Evan Hansen`,`A teen in a blue polo shirt with his arm in a white cast and cast in a sling. Minimalist modern staging; digital screens and text messages displayed on set.`),p(`Fun Home`,`Fun Home (musical)`,`A woman with short hair (adult Alison) observing her younger self (a child with pigtails) in a Victorian-style house with ornate furnishings. Memory and time overlap.`),p(`The Book of Mormon`,`The Book of Mormon (musical)`,`Mormon missionaries in formal white shirts, dark ties, and black name badges carrying Books of Mormon — set in rural Uganda with village scenery.`,[`Book of Mormon`]),p(`Come From Away`,`Come from Away`,`Actors in plaid shirts, jeans, and casual Canadian/rural clothing on a plain stage with wooden chairs that represent planes, bars, and school gymnasiums.`),p(`Moulin Rouge!`,`Moulin Rouge! The Musical`,`Opulent Belle Époque Parisian nightclub — red velvet curtains, can-can dancers in ruffled skirts, the iconic Moulin Rouge windmill in a rainbow-lit backdrop.`,[`Moulin Rouge`]),p(`Company`,`Company (musical)`,`Modern New York couples in contemporary clothes; Bobbie (a woman or man) surrounded by friends. Sleek modern set with chairs as recurring prop.`)]},{id:`face-painting`,name:`Face Painting`,subject:`Arts & Culture`,difficulty:`Easy`,description:`Name the design painted on faces.`,items:[p(`Butterfly`,`Butterfly`,`Wings painted across the cheeks and nose — usually colourful (pink, blue, purple, or orange) with detailed vein patterns, antennae up the forehead, and a body on the nose.`),p(`Tiger`,`Tiger`,`Orange and black stripes radiating from a pink nose, with white cheek patches, black whisker dots, and a striped forehead. The whole face becomes a tiger mask.`),p(`Lion`,`Lion`,`Tawny gold mane painted around the face, a golden nose, brown whisker lines, and possibly crown-like details. The face peeks through the painted mane.`),p(`Spider-Man`,`Spider-Man`,`Red-and-blue with a black web pattern — red covers most of the face, blue around the sides, and fine black web lines radiating from the nose and forehead.`),p(`Superman`,`Superman`,`A large yellow 'S' shield painted on the forehead or full-face blue and red with the iconic S symbol. Defined jawline paint and cape-like design.`),p(`Batman`,`Batman`,`A black bat mask painted around the eyes and nose — black wings spread across the cheeks, pointy ears on the forehead, grey around the rest of the face.`),p(`Rainbow`,`Rainbow`,`Bright arching rainbow stripes across one or both cheeks — red, orange, yellow, green, blue, and violet arcs, sometimes with clouds at each end.`),p(`Skull`,`Skull`,`White base with black hollow eye sockets (painted over real eyes), a black nose triangle, and black lines creating the illusion of exposed teeth on the lower face.`),p(`Zombie`,`Zombie`,`Grey or green skin tone, dark sunken eye circles, fake wounds and stitches, dripping fake blood, and exposed 'veins' or 'bones' painted on the face.`),p(`Witch`,`Witch`,`Green or grey skin tone, a large painted wart on the nose, exaggerated dark eye shadows, and sometimes a painted thin sinister smile with dark lipstick.`),p(`Cat`,`Cat`,`Painted whiskers radiating from each side of the nose, a black or pink painted nose tip, pointy ears on the forehead, and dark outlined eyes.`),p(`Dog`,`Dog`,`Droopy spots painted on the cheeks, a large black-tipped nose, floppy ear shapes on the forehead, and freckle dots. Often brown and white.`),p(`Clown`,`Clown`,`Exaggerated red or blue painted smile extending well beyond the natural lip line, a big red bulbous painted nose, white face base, and colourful eye triangles.`),p(`Dragon`,`Dragon`,`Scales painted across the cheeks and forehead in greens, purples, or reds — sometimes with painted horns above the brows and fire at the edges of the face.`),p(`Princess`,`Princess`,`Pink and purple swirls with glitter, a small painted tiara or crown on the forehead, sparkly gems around the eyes, and delicate floral details on the cheeks.`),p(`Pirate`,`Pirate`,`A black eye patch painted over one eye, a curled mustache and goatee, a skull-and-crossbones on the forehead, and a scowling expression.`),p(`Wolf`,`Gray wolf`,`Grey and white fur texture painted across the face, a dark muzzle area with a pink nose, amber eye highlights, and pointed ear shapes on the forehead.`,[`Werewolf`]),p(`Peacock`,`Indian peafowl`,`Vivid blue and green peacock feather 'eyes' — teardrop shapes with iridescent blue centres painted around the eyes and across the cheeks.`,[`Peacock`]),p(`Unicorn`,`Unicorn`,`A golden or rainbow spiral horn painted on the forehead, rainbow glitter swirls on the cheeks, star accents, and pastel sparkle around the eyes.`),p(`Flower`,`Flower`,`Bright petals radiating from a circular centre — usually around one or both cheeks, in pink, yellow, or orange. Often with a green leaf and stem detail.`),p(`Mermaid`,`Mermaid`,`Iridescent scales painted across the cheeks in teal, purple, and blue; starfish or shell accents near the eyes; glittery shimmer all over.`),p(`Fox`,`Red fox`,`Orange-red fur covering most of the face, a white muzzle, pointed ear tips on the forehead, and dark outlines around a black nose.`),p(`Panda`,`Giant panda`,`White base with large black ovals around each eye, a black nose, and black round ears on the forehead — simple but very effective.`),p(`Ladybug`,`Ladybug`,`Red face with large black spots painted on the cheeks, black antenna arching up from the forehead, and black outlines. Bright and graphic.`),p(`Bee`,`Honey bee`,`Yellow and black alternating stripes across the forehead and cheeks, painted antenna at the top, and sometimes small wings near the temples.`),p(`Rose`,`Rose`,`A detailed rose painted on one cheek — red or pink overlapping petals spiraling out from a centre, with green leaf accents at the edges.`),p(`American Flag`,`Flag of the United States`,`Red and white stripes painted on one side of the face, blue rectangle with small white stars painted near the eye on the other side — or a full-face version.`,[`US Flag`]),p(`Superhero`,`Superhero`,`Bold primary-colour mask painted around the eyes — typically a mask shape in red, blue, or yellow with defined edges and possibly a symbol on the forehead.`),p(`Vampire`,`Vampire`,`Pale white base, dark rimmed eyes, blood-red painted fangs and dripping blood at the corners of the mouth, and dark hollow cheekbones.`),p(`Frankenstein`,`Frankenstein's monster`,`Green-grey skin tone, a painted flat-top forehead with stitches, large painted bolt shapes on the neck, and dark sunken eye circles.`,[`Frankenstein's Monster`])]},{id:`art-history`,name:`Art History`,subject:`Arts & Culture`,difficulty:`Hard`,description:`Name the famous work of Art or Architecture, the Museum, or the Artist you see.`,items:[p(`Mona Lisa`,`Mona Lisa`,`A small Renaissance portrait of a woman with a faint enigmatic smile, brown hair, dark eyes, and folded hands. A hazy blue landscape behind her. Dark varnished tones.`),p(`The Starry Night`,`The Starry Night`,`Van Gogh's swirling night sky — bold spiraling brushstrokes of deep blue and yellow, a glowing crescent moon, bright swirling stars, and a village with a dark cypress tree in the foreground.`,[`Starry Night`]),p(`The Scream`,`The Scream`,`Munch's painting — an anguished figure with a skull-like face and wide-open mouth, holding its head, on a bridge with a blood-red swirling sky behind. Orange, red, and blue tones.`,[`Scream`]),p(`Girl with a Pearl Earring`,`Girl with a Pearl Earring`,`Vermeer's portrait — a young girl in a yellow-and-blue turban looking over her shoulder with parted lips and one large pearl earring catching the light. Dark background.`),p(`The Birth of Venus`,`The Birth of Venus`,`Botticelli's painting — a nude woman (Venus) standing on a giant scallop shell, long golden hair blowing, emerging from a teal sea. Winged figures blow wind; clothed figure reaches toward her.`,[`Birth of Venus`]),p(`American Gothic`,`American Gothic`,`Grant Wood's painting — a stern-faced farmer and woman standing in front of a white house with a Gothic arch window. He holds a pitchfork; both have tight-lipped expressions.`),p(`The Persistence of Memory`,`The Persistence of Memory`,`Dalí's surrealist painting — soft melting pocket watches draped over branches and a ledge in a barren desert landscape. Dreamlike, eerie, tan and blue tones.`,[`Persistence of Memory`,`Melting Clocks`]),p(`Nighthawks`,`Nighthawks (painting)`,`Hopper's painting of a late-night diner — three customers and a server visible through a curved plate-glass window, bathed in harsh green-white fluorescent light. Dark empty city street outside.`),p(`Campbell's Soup Cans`,`Campbell's Soup Cans`,`Warhol's iconic grid of identical red-and-white soup cans — each displaying a different Campbell's flavour. Bold graphic design, flat colour, commercial aesthetic.`,[`Soup Cans`]),p(`The Last Supper`,`The Last Supper (Leonardo)`,`Leonardo's mural — Jesus at the centre of a long table with 12 disciples arranged in groups of three. Dramatic arm gestures, a vaulted room with windows behind. Very long horizontal format.`,[`Last Supper`]),p(`The Creation of Adam`,`The Creation of Adam`,`Michelangelo's Sistine ceiling fresco — God (bearded elder in swirling robes) reaching from the right; Adam (muscular, reclining) reaching from the left. The iconic almost-touching fingers.`,[`Creation of Adam`]),p(`Water Lilies`,`Water Lilies (Monet series)`,`Monet's series — blurry, impressionistic patches of green lily pads, pink and white flowers, and reflections of sky on blue-green water. No horizon line; just rippling surface.`),p(`A Sunday on La Grande Jatte`,`A Sunday on La Grande Jatte`,`Seurat's pointillist painting — Parisians in Victorian dress with parasols, a monkey on a leash, a sailboat on the river. Made entirely of tiny coloured dots.`,[`Sunday on La Grande Jatte`]),p(`Whistler's Mother`,`Arrangement in Grey and Black No.1`,`Whistler's painting — an elderly woman in black dress and white cap sitting rigidly in profile in a grey room. A framed picture on the wall; curtain at left. Very austere.`,[`Arrangement in Grey and Black`]),p(`The Great Wave`,`The Great Wave off Kanagawa`,`Hokusai's woodblock print — a towering blue-white cresting wave about to engulf small fishing boats, with a snow-capped Mount Fuji in the distance. Bold blue-and-white design.`,[`Great Wave off Kanagawa`]),p(`Leonardo da Vinci`,`Leonardo da Vinci`,`Portraits show an elderly man with long white-grey flowing hair and beard, deeply set eyes, and a wise expression. His 1512 self-portrait in red chalk is the most famous likeness.`,[`Da Vinci`]),p(`Michelangelo`,`Michelangelo`,`Renaissance Italian artist; typically depicted as an intense middle-aged man in period dress. Closely associated with the Sistine Chapel ceiling, David statue, and the Pieta.`),p(`Vincent van Gogh`,`Vincent van Gogh`,`Instantly recognizable from his self-portraits — a pale man with red-orange hair and beard, bright blue or green eyes, often wearing a bandage over his ear. Intense, direct gaze.`,[`Van Gogh`]),p(`Pablo Picasso`,`Pablo Picasso`,`A stocky Spanish man with dark intense eyes, a broad forehead, and a powerful physical presence. Often photographed in a striped Breton shirt, bald or close-cropped in later life.`,[`Picasso`]),p(`Claude Monet`,`Claude Monet`,`In old age: a full white beard, wide-brimmed hat or beret, and round spectacles. Often photographed in his garden at Giverny beside the water lily pond.`,[`Monet`]),p(`Salvador Dalí`,`Salvador Dalí`,`One of the most recognizable artists — long upturned waxed moustache that curls sharply skyward, intense dark eyes, often in a black cape or eccentric clothing.`,[`Salvador Dali`,`Dali`]),p(`Frida Kahlo`,`Frida Kahlo`,`A Mexican woman with a distinctive unibrow, dark hair adorned with flowers or a traditional tehuana headdress, and embroidered traditional Mexican blouses. Intense dark eyes.`,[`Kahlo`]),p(`Andy Warhol`,`Andy Warhol`,`Silver-white bleached hair, large square glasses, pale skin, and a deadpan expression. Often photographed in a leather jacket with a polaroid camera.`,[`Warhol`]),p(`The Louvre`,`Louvre`,`A vast neoclassical palace in Paris with a modern glass-and-steel pyramid at the centre of its courtyard — the Pyramid Entrance. Cream-coloured stone facades; the world's most visited museum.`,[`Louvre Museum`]),p(`MoMA`,`Museum of Modern Art`,`A sleek modernist building in Midtown Manhattan — white stone and glass facade. Inside: bright minimalist white galleries. Home to Starry Night and other modern icons.`),p(`Sistine Chapel`,`Sistine Chapel`,`A rectangular chapel in Vatican City with a magnificent painted barrel-vaulted ceiling — Michelangelo's Creation of Adam fresco is the centrepiece. Golden and colourful ceiling panels.`),p(`Guggenheim Museum`,`Solomon R. Guggenheim Museum`,`Frank Lloyd Wright's New York building — a white spiral cylinder that widens as it rises. Like an inverted spiral; the interior is a continuous ramp gallery.`,[`Guggenheim`]),p(`Sagrada Família`,`Sagrada Família`,`Gaudí's unfinished Barcelona basilica — tall stone spires with organic twisting shapes, covered in intricate stone sculpture and coloured mosaic. Part Gothic, part Art Nouveau.`,[`Sagrada Familia`]),p(`Colosseum`,`Colosseum`,`Ancient Rome's oval amphitheatre — a massive elliptical stone structure with tiered arched arcades. The outer wall shows three levels of arches; the interior is partly ruined.`),p(`Grant Wood`,`Grant Wood`,`An American regionalist painter from Iowa; known for his precise, simplified style. Often photographed looking mild-mannered; associated with the American Gothic painting he created.`)]},{id:`photography`,name:`Photography`,subject:`Arts & Culture`,difficulty:`Medium`,description:`Name the item associated with photography, or the specific genre of photography, you see.`,items:[p(`DSLR Camera`,`Digital single-lens reflex camera`,`A large, chunky camera with an interchangeable lens, a viewfinder on top, and a prominent grip on the right side. Usually black; shows through a mirror system.`,[`DSLR`]),p(`Film Camera`,`35mm film`,`A compact rectangular camera with a film canister visible inside or a rewind knob on top. Mechanical dials; takes 35mm film cassettes.`,[`35mm Camera`]),p(`Polaroid Camera`,`Polaroid camera`,`A boxy instant camera with a film cartridge slot at the bottom that ejects a square white-bordered photo immediately after shooting.`,[`Polaroid`]),p(`Tripod`,`Tripod (photography)`,`Three extendable metal or carbon-fibre legs spreading from a central column, with a mounting head on top to hold a camera. Adjustable height; folds flat.`),p(`Camera Flash`,`Camera flash`,`A rectangular unit mounted on top of a camera via a hot shoe — fires a burst of bright white light when the shutter releases.`,[`Flash`]),p(`Zoom Lens`,`Zoom lens`,`A long cylindrical lens that extends longer when zooming in — shows a rotating zoom ring with focal length markings. Much bigger than a prime lens.`),p(`Prime Lens`,`Prime lens`,`A fixed focal length lens — shorter and lighter than a zoom, with a large maximum aperture (big front glass element). No zoom ring; only focus ring.`),p(`Aperture`,`Aperture`,`The opening inside a lens — shown as a hexagonal or circular opening formed by overlapping metal blades. Wider opening lets in more light.`),p(`Darkroom`,`Darkroom`,`A room lit only by dim red safelight, with enlarger machines on counters, chemical trays (developer, stop bath, fixer), and lines of drying photo prints.`),p(`Film Negative`,`Photographic film`,`A strip of transparent plastic with small rectangular frames — images appear as inverted colours (light areas are dark, darks are light) with perforated edges.`,[`Film Negative`]),p(`Portrait Photography`,`Portrait photography`,`A photograph focusing on a person's face and expression — shallow depth of field blurs the background, person looks directly at camera or slightly away.`,[`Portrait`]),p(`Landscape Photography`,`Landscape photography`,`Wide vistas of nature or cityscapes — mountains, fields, or coastlines captured from a low angle showing sky and land with a clear horizon line.`,[`Landscape`]),p(`Street Photography`,`Street photography`,`Candid black-and-white or colour photos of people in urban environments — caught mid-motion on busy streets, markets, or subway platforms.`),p(`Wildlife Photography`,`Wildlife photography`,`Animals photographed in natural habitats — often from long distances with telephoto lenses, showing sharp animal detail against blurred natural backgrounds.`),p(`Macro Photography`,`Macro photography`,`Extreme close-up photography where tiny subjects (insects, flowers, water drops) fill the entire frame, revealing details invisible to the naked eye.`,[`Macro`]),p(`Aerial Photography`,`Aerial photography`,`Bird's-eye view photos taken from drones or aircraft — urban grids, patchwork farmland, beaches, or forests seen from directly above.`,[`Drone Photography`]),p(`Underwater Photography`,`Underwater photography`,`Photos taken beneath water — scuba divers in masks and tanks with coral, fish, and blue-green filtered light. Camera in a waterproof housing.`),p(`Astrophotography`,`Astrophotography`,`Long-exposure night sky photos — vivid Milky Way arcing across a dark sky, star trails spiraling, or planet close-ups through a telescope.`,[`Astro Photography`]),p(`Sports Photography`,`Sports photography`,`Action-freeze shots of athletes — a ball mid-flight, a runner's muscles straining, a basketball player dunking — with very fast shutter speeds.`),p(`Photojournalism`,`Photojournalism`,`Documentary news photography — protests, war zones, natural disasters, or historic moments captured candidly in the field by reporters.`),p(`Fashion Photography`,`Fashion photography`,`Styled editorial photos with models in designer clothing in dramatic lighting — often high contrast, bold compositions in studios or exotic locations.`),p(`Ansel Adams`,`Ansel Adams`,`Black-and-white landscape photographer — his signature images are dramatic high-contrast shots of Yosemite, moonrise over Hernandez, and the Snake River.`),p(`Dorothea Lange`,`Dorothea Lange`,`Depression-era documentary photographer — known for 'Migrant Mother', a close-up of a worried woman with children. Black-and-white; deeply humanist.`),p(`Annie Leibovitz`,`Annie Leibovitz`,`Celebrity portrait photographer — known for large-scale, theatrical portraits of John Lennon, Demi Moore, and countless iconic Rolling Stone covers.`,[`Leibovitz`]),p(`Henri Cartier-Bresson`,`Henri Cartier-Bresson`,`Father of street photography — sharp, decisive-moment black-and-white street photos; a man jumping a puddle is his most famous image.`),p(`Richard Avedon`,`Richard Avedon`,`Fashion and portrait photographer — stark white backgrounds, very sharp focus, subjects often expressing raw emotion in simple compositions.`,[`Avedon`]),p(`Camera Obscura`,`Camera obscura`,`A dark box or darkened room with a small hole that projects an inverted image of the outside onto the opposite wall — the precursor to photography.`),p(`Daguerreotype`,`Daguerreotype`,`An early photographic process on a polished silver or silver-coated copper plate — shows a ghostly, highly detailed silver-toned image, often in an ornate hinged case.`),p(`Shutter Speed`,`Shutter speed`,`Shown on a camera display or dial — fractions of seconds (1/250, 1/1000). Fast speeds freeze motion; slow speeds create motion blur in photos.`),p(`Light Meter`,`Light meter`,`A small handheld device used to measure light intensity — usually has a white dome on the end and a dial readout. Held near the subject to set exposure.`,[`Exposure Meter`])]},{id:`ballet`,name:`Ballet`,subject:`Arts & Culture`,difficulty:`Medium`,description:`Name the item, position, movement, step, dance, person, or movie associated with ballet.`,items:[p(`Arabesque`,`Arabesque (ballet)`,`A dancer balancing on one leg with the other leg extended straight behind at 90° or higher, arms spread gracefully. Seen in profile; a classic elegant shape.`),p(`Plié`,`Plié`,`A bending of the knees while keeping the feet turned out — the dancer descends straight down, knees tracking over the toes. Often done at the barre.`,[`Plie`]),p(`Relevé`,`Relevé`,`Rising up onto the balls of the feet or pointe — heels lift off the floor, the dancer's body rises straight up. Often done in first or fifth position.`,[`Releve`]),p(`Pirouette`,`Pirouette`,`A spinning turn on one leg — the dancer rises to pointe or demi-pointe on one foot, the other leg in passé, and rotates one or many times.`),p(`Jeté`,`Jeté`,`A jump from one foot to the other — a leaping step where the leg is thrown outward. Creates a horizontal leaping movement across the stage.`,[`Jete`]),p(`Fouetté`,`Fouetté`,`A series of whipping turns on one leg — the working leg whips out and in as the dancer spins, generating momentum. Famous in Swan Lake.`,[`Fouette`]),p(`Pas de Deux`,`Pas de deux`,`A partnered dance for two — usually a male and female dancer, with lifts where the man supports the woman overhead, promenades, and shared choreography.`),p(`Grand Battement`,`Grand battement`,`A large leg kick — the working leg swings up to 90° or higher (to the front, side, or back) while the standing leg remains straight. Done at the barre or centre.`),p(`Swan Lake`,`Swan Lake`,`Female dancers in white tutus and white feathered headdresses — arms moving in slow, wing-like undulations. The iconic white swan corps de ballet scene.`),p(`The Nutcracker`,`The Nutcracker`,`Holiday ballet with dancers in Victorian party costumes, a giant Christmas tree that grows, soldiers fighting mice, and a snowflake scene in white tutus.`),p(`Sleeping Beauty`,`The Sleeping Beauty (ballet)`,`A fairy-tale ballet with elaborate historic costumes — a princess in pink, good and evil fairies in coloured tutus, a royal court setting.`,[`La Belle au Bois Dormant`]),p(`Giselle`,`Giselle (ballet)`,`A Romantic-era ballet — Act I in a peasant village (coloured skirts), Act II with white Wili spirits (long white tutus floating in moonlit forest).`),p(`Don Quixote`,`Don Quixote (ballet)`,`Colourful Spanish-inspired ballet — bright reds, golds, and flamenco-influenced costume
