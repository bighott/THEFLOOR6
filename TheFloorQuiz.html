s. Grand jumps, castanets, fans, and energetic character dancing.`),p(`Pointe Shoes`,`Pointe shoe`,`Satin ballet shoes with a reinforced box at the toe that allows dancers to balance and dance on the tips of their toes. Pale pink satin; ribbons tied at the ankle.`,[`Toe Shoes`,`Ballet Shoes`]),p(`Tutu`,`Tutu (clothing)`,`The iconic ballet skirt — classical (long, stiff horizontal tiers of tulle) or Romantic (long soft flowing white layers). Short 'pancake' tutus for classical ballets.`),p(`Ballet Barre`,`Barre (ballet)`,`A horizontal wooden or metal bar fixed to the wall or on freestanding supports at waist height — dancers hold it for warm-up exercises.`,[`Barre`]),p(`Leotard`,`Leotard`,`A one-piece, skin-tight garment with a scoop or square neck and short or long sleeves — worn for dance practice. Usually black, navy, or in pastel colours.`),p(`Mikhail Baryshnikov`,`Mikhail Baryshnikov`,`Russian-American ballet legend — seen in tights and dance clothes performing powerful jumps and extensions. Compact, athletic build; intense expression.`,[`Baryshnikov`]),p(`Rudolf Nureyev`,`Rudolf Nureyev`,`Soviet-born ballet star — known for wild, passionate energy on stage. Often photographed in tights in dramatic leaping poses or elaborate historic costumes.`,[`Nureyev`]),p(`Anna Pavlova`,`Anna Pavlova (ballerina)`,`Early 20th-century ballerina — seen in vintage black-and-white photos in a long white tutu, graceful swan-like arms, and a feathered headdress.`,[`Pavlova`]),p(`Misty Copeland`,`Misty Copeland`,`The first Black principal dancer at ABT — a powerful, muscular ballerina with an athletic build, seen in elaborate ballet costumes or practice wear.`,[`Copeland`]),p(`Black Swan`,`Black Swan (film)`,`Natalie Portman in a black feathered tutu and black feathered headdress — pale skin, dramatic black eye makeup, and an agonized expression.`),p(`Billy Elliot`,`Billy Elliot (film)`,`A young boy in a T-shirt and jeans doing ballet in a mining town — the contrast between ballet grace and industrial surroundings is the key visual image.`),p(`George Balanchine`,`George Balanchine`,`Ballet choreographer — usually seen in black-and-white photos in a suit or rehearsal clothes, directing or demonstrating to dancers in a studio.`,[`Balanchine`]),p(`Prima Ballerina`,`Prima ballerina assoluta`,`The lead female dancer in a company — performing the principal role in an elaborate, expensive production costume, often with a tiara or crown.`,[`Prima Ballerina Assoluta`]),p(`Coppélia`,`Coppélia`,`A comic ballet — Swanilda in a colourful folk costume tries to impersonate a mechanical doll. Features doll-like stiff robotic movements mixed with natural dance.`,[`Coppelia`]),p(`La Bayadère`,`La Bayadère`,`Famous for the 'Kingdom of the Shades' scene — a long procession of 24 corps dancers in white romantic tutus filing down a ramp in identical arabesques.`,[`La Bayadere`]),p(`Pas de Chat`,`Pas de chat`,`A cat-like leap where both legs are drawn up in sequence — the dancer springs off one foot, brings it up while the other leg follows, landing on both feet in succession.`),p(`Grand Jeté`,`Grand jeté`,`The spectacular leaping split — a dancer leaps from one foot into the air, both legs extending into a full split position before landing. A hallmark of virtuosity.`,[`Grand Jete`]),p(`Bun`,`Ballet bun`,`Smooth hair pulled back tightly into a round bun at the back of the head — secured with bobby pins and hairnet. Standard ballet hairstyle.`,[`Hair Bun`])]},{id:`needle-crafting`,name:`Needle Crafting`,subject:`Arts & Culture`,difficulty:`Easy`,description:`Name the item associated with sewing, crocheting, or knitting.`,items:[p(`Knitting Needles`,`Knitting needle`,`Two long, pointed sticks (metal, wood, or plastic) held in both hands, threading loops of yarn between them to create knitted fabric.`,[`Knitting Needle`]),p(`Crochet Hook`,`Crochet hook`,`A single hook-tipped stick used to pull loops of yarn through each other — the hook is at one end, often with a rubber grip near the middle.`),p(`Sewing Machine`,`Sewing machine`,`A mechanical or electric device for stitching fabric — a needle bobs up and down through a presser foot at the front; thread spools at the top.`),p(`Thimble`,`Thimble`,`A small metal or plastic cap worn on a fingertip — dimpled all over to grip a needle while pushing it through thick fabric. Looks like a tiny crown-shaped dome.`),p(`Seam Ripper`,`Seam ripper`,`A small tool with a hooked blade in a U-shape used to cut stitches — a sharp pointed tip and a curved cutting edge on a short handle.`),p(`Embroidery Hoop`,`Embroidery hoop`,`Two concentric wooden or plastic rings that clamp fabric taut between them — the inner ring is plain, the outer has a screw tightener. Fabric stretches across the centre.`,[`Hoop`]),p(`Bobbin`,`Bobbin`,`A small spool that sits inside a sewing machine's lower casing — holds the bottom thread that interlocks with the top thread to form a stitch.`),p(`Pincushion`,`Pincushion`,`A soft padded cushion bristling with straight pins or needles sticking out — often tomato-shaped, red with a strawberry attached, or in a decorative form.`,[`Pin Cushion`]),p(`Cross-Stitch`,`Cross-stitch`,`Embroidery made with small X-shaped stitches on evenly woven fabric — forms a pixelated image or pattern in colourful thread on white or beige Aida cloth.`),p(`Needlepoint`,`Needlepoint`,`Embroidery on stiff open-weave canvas — stitches cover the entire canvas surface to create a detailed picture or pattern, like a painted textile.`),p(`Macramé`,`Macramé`,`Decorative knotted cord or rope — thick natural or cotton rope tied into geometric knots forming wall hangings, plant holders, or bohemian décor.`,[`Macrame`]),p(`Quilting`,`Quilting`,`Layers of fabric sewn together — the top layer shows a patchwork of coloured fabric squares, triangles, or patterns; stitching runs through all layers.`),p(`Yarn`,`Yarn`,`A continuous strand of twisted fibres wound into a ball or skein — comes in every colour, thick or nd with thread — creates interlocking rings and chains of thread forming delicate lace edging.`),p(`Bobbin Lace`,`Bobbin lace`,`Lace made by weaving many threads wound on bobbins pinned to a pillow — the bobbins hang in groups and are crossed and twisted to create the pattern.`),p(`Thread`,`Thread`,`A fine, continuous strand of twisted fibres wound on a small spool — shiny polyester or matte cotton; used in sewing machines and for hand-stitching.`),p(`Pattern`,`Sewing pattern`,`A large sheet of tissue paper printed with cutting lines, fold marks, and symbols — pieces are laid on fabric and cut to sew a garment.`,[`Sewing Pattern`]),p(`Iron-on Patch`,`Patch (fabric)`,`A fabric emblem or decorative shape with a heat-activated glue backing — pressed onto clothing with an iron to bond permanently. Often emblems or artwork.`,[`Patch`]),p(`Binding`,`Quilt binding`,`A strip of folded fabric sewn along the edge of a quilt — covers the raw outer edges and frames the quilt in a coordinating or contrasting colour.`,[`Quilt Binding`]),p(`Darning`,`Darning`,`The repair of a hole or worn area in fabric using a darning mushroom (wooden dome) and needle — threads are woven back and forth to fill the gap.`)]},{id:`cheerleading`,name:`Cheerleading`,subject:`Arts & Culture`,difficulty:`Easy`,description:`Name the item, stunt, person, movie or TV show associated with Cheerleading.`,items:[p(`Pyramid`,`Cheerleading pyramid`,`Multiple cheerleaders forming a triangular tower — bases on the ground support flyers who climb on their shoulders, creating a human structure several levels high.`,[`Cheer Pyramid`]),p(`Basket Toss`,`Basket toss`,`Three or four bases clasp hands to form a cradle and launch a flyer high into the air — the flyer performs a trick before being caught on the way down.`),p(`Handspring`,`Handspring`,`A gymnastic move where a person kicks their legs over their head while pushing off with their hands — seen as front or back handspring on cheer floors.`),p(`Back Tuck`,`Back Ritz Carlton`]),p(`Four Seasons`,`Four Seasons Hotels and Resorts`,`A gold tree logo on a white background — simple, elegant emblem of the world's most prestigious hotel chain. Understated luxury aesthetic.`,[`Four Seasons Hotels`]),p(`Holiday Inn`,`Holiday Inn`,`The familiar green Holiday Inn sign with white letters and a globe — a roadside mid-range hotel, often attached to an indoor pool and restaurant.`),p(`Best Western`,`Best Western`,`A yellow-and-blue crown logo with 'Best Western' text — seen on two-story roadside motor lodges and mid-range urban hotels across North America.`),p(`Motel 6`,`Motel 6`,`A basic budget motel with the distinctive red '6' logo on a white sign — row of doors opening directly to a parking lot; basic rooms, low price.`),p(`Airbnb`,`Airbnb`,`The 'Bélo' symbol — a rounded pink loop that forms a shape combining an A, a pin-drop, a heart, and a person. Hot pink on white; appears on the app.`),p(`Concierge`,`Concierge`,`A uniformed hotel employee at a polished desk in the lobby — wearing a formal suit or hotel uniform, assisting guests with directions and reservations.`),p(`Bellhop`,`Bellhop`,`A hotel employee in a pillbox hat and gold-buttoned uniform — pushes a brass luggage cart loaded with bags through the lobby or elevator.`,[`Bellboy`]),p(`Valet`,`Valet parking`,`A young person in a uniform jacket and name badge who takes car keys from a guest and drives their car to a parking garage — standing at a red-carpeted entrance.`,[`Valet Parking`]),p(`Lobby`,`Lobby (room)`,`The grand entrance hall of a hotel — marble floors, large floral arrangements, seating areas, a front desk with the hotel logo behind it, and high ceilings.`),p(`Minibar`,`Minibar`,`A small under-counter refrigerator in a hotel room stocked with tiny bottles of spirits, soft drinks, snacks, and sometimes a wine glass.`),p(`Room Service`,`Room service`,`A tray brought to a hotel room — silver-domed plate covers, a folded napkin, a small vase with a flower, and a bill slip on a rolling trolley.`),p(`Hotel Key Card`,`Keycard lock`,`A flat plastic card about the size of a credit card with a magnetic stripe or chip — inserted into the door lock to unlock the room.`,[`Key Card`]),p(`Do Not Disturb Sign`,`Do not disturb`,`A small rectangular sign hung on the outer door handle — says 'Do Not Disturb' (or a translated version), often with a simple sleeping or privacy graphic.`,[`Do Not Disturb`]),p(`Hotel Pool`,`Swimming pool`,`An indoor or outdoor hotel pool — blue-lit water, white chaise lounges, towels folded on rails, and hotel branding on the poolside towels.`),p(`Spa`,`Spa (beauty)`,`A serene wellness facility — candles, bamboo, soft lighting, a massage table with crisp white linen, and an attendant in all-white offering treatments.`),p(`Turndown Service`,`Turndown service`,`Housekeeping has pulled down the bed covers, folded the corner back diagonally, placed a chocolate on the pillow, and dimmed the lights.`),p(`Suite`,`Suite (hotel)`,`A large, multi-room hotel accommodation — separate living room and bedroom, upscale furniture, a view, and premium amenities. Much larger than a standard room.`),p(`Penthouse`,`Penthouse (apartment)`,`The top floor of a luxury hotel — floor-to-ceiling windows with a panoramic city view, private terrace, and oversized living spaces with premium furnishings.`),p(`Continental Breakfast`,`Continental breakfast`,`A free or included hotel breakfast — a table with baskets of croissants, fruit, cereal, juice dispensers, and a coffee station. Simple and self-service.`),p(`The Plaza Hotel`,`The Plaza Hotel (New York City)`,`A grand Beaux-Arts building at the corner of Central Park South — gleaming white limestone, green copper roof, and an elegant facade facing the park.`,[`Plaza Hotel`]),p(`Waldorf Astoria`,`Waldorf Astoria New York`,`A grand art deco skyscraper on Park Avenue — ornate lobby with gold detailing, a famous clock in the centre, and a storied history of celebrity guests.`,[`Waldorf Astoria`]),p(`Hotel California`,`Hotel California`,`The Eagles album cover — a warm-toned California hotel at dusk seen from the parking lot; or imagery of a guest who can never leave the mysterious hotel.`,[`Hotel California Song`]),p(`W Hotels`,`W Hotels`,`A modern lifestyle hotel brand — the W logo in bold white on a dark background. Known for loud music, stylish bars, and contemporary design-focused rooms.`),p(`Hostel`,`Hostel`,`Budget accommodation for backpackers — bunk beds with thin mattresses in a shared dormitory room, with lockers, communal bathrooms, and a social common area.`),p(`Bed and Breakfast`,`Bed and breakfast`,`A cosy small inn in a private home — antique furniture, a home-cooked breakfast on a shared table, flowers in rooms, and a family-run intimate atmosphere.`,[`B&B`]),p(`Checkout`,`Hotel checkout`,`A guest at the front desk returning a key card and receiving a final bill — or a self-checkout kiosk near the lobby exit where guests review and settle charges.`,[`Check Out`])]},{id:`brand-icons`,name:`Brand Icons`,subject:`Business & Brands`,difficulty:`Easy`,description:`Name the brand associated with each logo or mascot.`,items:[p(`McDonald's`,`McDonald's`,`The golden 'M' arches logo — two curved yellow arcs forming an M shape on a red background. The most recognized fast-food symbol in the world.`,[`McDonalds`]),p(`Nike`,`Nike, Inc.`,`The simple curved swoosh — a single fluid check-mark shape in black or white. Appears on all Nike athletic gear; often alone without the wordmark.`,[`Nike`]),p(`Apple`,`Apple Inc.`,`A grey metallic apple silhouette with a single leaf and a bite taken out of the right side. Clean, minimal design; appears on all Apple products.`),p(`Coca-Cola`,`The Coca-Cola Company`,`The classic red logo with 'Coca-Cola' in a flowing white Spencerian script. The distinctive red and white colour scheme is globally recognized.`,[`Coke`,`Coca Cola`]),p(`Google`,`Google`,`The four-colour wordmark — 'Google' in blue, red, yellow, and green letters settings, exasperated by bad timing.`,[`Aflac`]),p(`Progressive Flo`,`Flo (Progressive)`,`A cheerful dark-haired woman in a white apron with heavy makeup — bright red lips, retro hairdo, and a big warm smile. Works in an all-white insurance store.`,[`Flo Progressive`]),p(`Snapchat`,`Snapchat`,`A yellow square with a bold white ghost outline in the centre — a simple cartoon ghost shape with two hollow eyes on a bright yellow background.`),p(`Twitter/X`,`Twitter`,`Originally a small blue bird silhouette (Twitter); rebranded to a bold white X on black background. The bird version is still widely recognized.`,[`X`,`Twitter`]),p(`Instagram`,`Instagram`,`A rounded square outline representing a camera — gradient from yellow-orange at the bottom to pink-red to purple at the top-left corner. Small circle dot and square inside.`),p(`Facebook`,`Facebook`,`A lowercase white 'f' on a blue square background. Very simple, clean. Also now the Meta logo — a blue infinity-symbol figure eight.`,[`Meta`]),p(`Starbucks`,`Starbucks`,`A green circle with a twin-tailed siren (mermaid) in white at the centre — bare-shouldered figure with two fish tails that frame her face. 'Starbucks Coffee' around the edge.`),p(`Target`,`Target Corporation`,`A red bullseye — a red outer ring and a red central dot on a white background. Simple and bold; immediately recognizable as the American retailer.`,[`Target Bullseye`]),p(`NBC Peacock`,`NBC`,`A stylized peacock facing right with six colourful tail feathers spreading outward — red, orange, yellow, green, teal, and blue. A classic broadcast network logo.`,[`Peacock Logo`]),p(`MGM Lion`,`Metro-Goldwyn-Mayer`,`A roaring lion inside a gold film-reel frame — the real lion named Leo opens its mouth wide, filmed against a plain background. 'Ars Gratia Artis' in the banner.`,[`MGM`]),p(`Lacoste Crocodile`,`Lacoste`,`A small embroidered green crocodile on the chest of polo shirts — facing right, mouth slightly open, with a textured scaly back. The symbol of French preppy sportswear.`,[`Lacoste`]),p(`Ralph Lauren Polo`,`Ralph Lauren Corporation`,`A small embroidered polo player on horseback — a figure in a polo helmet leaning forward with a mallet raised, riding a galloping horse. Usually in navy or white.`,[`Polo Ralph Lauren`]),p(`Playboy Bunny`,`Playboy`,`The iconic white rabbit head silhouette with a bow tie — a clean, graphic rabbit head in profile wearing a neat bow tie. Black or white; used on the magazine logo.`,[`Playboy`]),p(`Batman Logo`,`Batman`,`A black bat silhouette — wide, angular wings spread against a yellow oval background. Different versions vary in wing shape but always a dark bat on bright yellow.`),p(`Superman Logo`,`Superman`,`A shield shape with a stylized red 'S' on a yellow background — the diamond/pentagon shield outline is yellow, the S is red on yellow inside. Very bold and heroic.`),p(`Red Bull`,`Red Bull`,`Two red bulls facing each other head-on as if about to charge, with a yellow circle sun behind them. Bold, aggressive, energetic design in red, yellow, and silver-blue.`)]},{id:`perfumes`,name:`Perfumes`,subject:`Business & Brands`,difficulty:`Medium`,description:`You will see a perfume bottle with the name of its brand missing. Name the brand.`,items:[p(`Chanel No. 5`,`Chanel No. 5`,`A minimal rectangular glass bottle with a flat cap and simple black label — the most iconic perfume bottle design in history. Clean, symmetric, modernist.`,[`Chanel`]),p(`Dior`,`Christian Dior (fashion house)`,`The J'adore bottle — a tall gold amphora shape tapering to a narrow gold neck with a gold ring; or the Miss Dior bow-tied rectangular bottle.`,[`Christian Dior`]),p(`Gucci`,`Gucci`,`Gucci Guilty or Flora — floral printed rectangular bottle with gold details and the interlocking GG logo; or a bold cylindrical bottle with green-red-green stripe.`),p(`Versace`,`Versace`,`The Bright Crystal or Eros bottles — often featuring the Medusa head or Greek key pattern in gold. Bold, glamorous, Italian luxury aesthetic.`),p(`Burberry`,`Burberry`,`The Burberry Her or My Burberry bottle — often features the iconic Burberry check pattern (tan, black, and red plaid) on the packaging or label.`),p(`Marc Jacobs`,`Marc Jacobs (fashion designer)`,`Daisy — a white cylindrical bottle with a huge plastic daisy on the gold cap; playful, feminine, and instantly recognizable by the flower-topped lid.`,[`Marc Jacobs`]),p(`Calvin Klein`,`Calvin Klein`,`CK One — a simple, minimalist frosted glass bottle with a silver cap and a clean, understated label. Very 1990s unisex aesthetic.`),p(`Polo Ralph Lauren`,`Polo Ralph Lauren`,`The classic Polo bottle — a dark green cylindrical bottle with a silver horse-and-rider logo; or Ralph's Ralph — a whimsical, colourful floral design.`,[`Ralph Lauren`]),p(`Viktor & Rolf`,`Viktor & Rolf`,`Flowerbomb — a faceted gem-cut glass bottle shaped like a grenade or hand bomb, with a pink bow tied around the neck. Very distinctive angular crystal shape.`),p(`Jean Paul Gaultier`,`Jean Paul Gaultier`,`Le Male — a torso-shaped bottle moulded to look like a male body in a striped sailor shirt. Very unusual figurative bottle design.`),p(`Yves Saint Laurent`,`Yves Saint Laurent`,`Opium — a bold lacquered red bottle with a gold tassel; or Black Opium with a glittery black finish. The YSL logo is stamped prominently.`,[`YSL`]),p(`Dolce & Gabbana`,`Dolce & Gabbana`,`The One — an amber-coloured rounded bottle with a gold D&G logo on the front. Very Italian, warm, and luxurious aesthetic.`),p(`Thierry Mugler`,`Thierry Mugler`,`Angel — a dark blue five-pointed star-shaped bottle, instantly recognizable by its geometric star silhouette. Very dramatic and futuristic.`,[`Mugler`]),p(`Paco Rabanne`,`Paco Rabanne`,`1 Million — a gold bar-shaped bottle moulded to look exactly like a gold ingot or bar. Very over-the-top and ostentatious; pure gold colour.`),p(`Lancôme`,`Lancôme`,`La Vie est Belle — a wide, flat, curved bottle with a rounded bottom half, the top half forming a bow shape. Pink juice inside; Lancôme rose icon.`,[`Lancome`]),p(`Hermès`,`Hermès`,`Hermès Terre d'Hermès — a square, functional bottle in orange (the brand's signature colour) with a simple silk-rope or orange label.`,[`Hermes`]),p(`Tom Ford`,`Tom Ford`,`Black Orchid or Tobacco Vanille — a sleek, heavy rectangular dark bottle with embossed Tom Ford logo and a very sophisticated all-black aesthetic.`),p(`Jo Malone`,`Jo Malone London`,`A simple cream-coloured rectangular bottle with a black and cream grosgrain ribbon tied in a bow around the neck. Understated, elegant, British.`,[`Jo Malone`]),p(`Creed`,`Creed (company)`,`A tall, elegant bottle with a classic crown-shaped metal sprayer cap — the Creed logo in gold on a clean rectangular glass bottle. Very old-world prestige.`),p(`Givenchy`,`Givenchy`,`L'Interdit — a white and gold square-cut bottle with the Givenchy name on a white label; or Ange ou Démon, a faceted jewel-like glass bottle.`),p(`Valentino`,`Valentino S.p.A.`,`Donna Born in Roma — a bottle with pink and frosted glass elements and the Valentino V logo; or Valentina — an art nouveau-inspired curved glass shape.`,[`Valentino`]),p(`Bvlgari`,`Bulgari`,`Man in Black or Omnia — a round, smooth jewel-like bottle, often with the distinctive BVLGARI wordmark in elegant serif font and gem-inspired colours.`,[`Bulgari`]),p(`Cartier`,`Cartier SA`,`La Panthère — a sleek bottle in white with a panther-printed cap; or Baiser Volé — a tall, slim cylindrical bottle in pale blue-green frosted glass.`),p(`Armani`,`Giorgio Armani`,`Acqua di Giò — a bottle of clear blue-tinted glass shaped like a smooth rounded pebble or water droplet; very clean, maritime, minimal.`,[`Giorgio Armani`]),p(`Davidoff`,`Davidoff`,`Cool Water — a simple blue-clear rectangular bottle with the Davidoff name; the classic blue-and-silver packaging is immediately recognizable.`),p(`Hugo Boss`,`Hugo Boss`,`Hugo Boss Bottled — a cylindrical bottle with a black-and-silver cap and simple, masculine 'BOSS' branding on a clean white label.`),p(`Dolce`,`Dolce & Gabbana`,`The Dolce by Dolce & Gabbana — a white, rounded, flower-shaped bottle with a cream and gold label; softer and more feminine than D&G's other scents.`),p(`Juicy Couture`,`Juicy Couture`,`Viva la Juicy — a rounded bottle with a charm-bracelet cap featuring tiny gold charms; pastel pink juice and a playful girly aesthetic.`),p(`Vera Wang`,`Vera Wang`,`The Vera Wang bottle — a minimalist frosted light lavender glass bottle with a flower cap; delicate, simple, and bridal in feel.`),p(`Elizabeth Arden`,`Elizabeth Arden (brand)`,`Red Door or 5th Avenue — an art deco-influenced bottle with elegant metalwork and the Elizabeth Arden name in a classic serif font.`,[`Elizabeth Arden`])]},{id:`y2k-stars`,name:`Y2K Stars`,subject:`Celebrities & Pop Culture`,difficulty:`Medium`,description:`Name these celebrities who were popular at the turn of the millennium.`,items:[p(`Britney Spears`,`Britney Spears`,`Blonde pop princess — often seen in low-rise jeans, crop tops, or sparkling stage outfits. Signature high ponytail or loose waves. Famous schoolgirl outfit in 'Baby One More Time' video.`,[`Britney`]),p(`Christina Aguilera`,`Christina Aguilera`,`Bleached platinum blonde hair, heavy cat-eye makeup, and very revealing stage outfits. Known for dramatic 'Dirrty' era chaps and bandana; also elegant in polished retro looks.`),p(`Justin Timberlake`,`Justin Timberlake`,`In his Y2K peak: frosted curly tips, matching denim-on-denim outfits (infamously with Britney), and NSYNC choreography looks. Clean-cut handsome face, brown hair.`),p(`Eminem`,`Eminem`,`White rapper with close-cropped bleached blonde hair (in his early career), often in baggy Adidas or Detroit Tigers gear. Intense light-blue eyes and a scowl.`),p(`Jennifer Lopez`,`Jennifer Lopez`,`Latina pop star with a curvy figure, long dark hair or slicked-back styles, and glamorous red-carpet gowns. Famous for the green Versace jungle print dress at the 2000 Grammys.`,[`J.Lo`,`JLo`]),p(`Destiny's Child`,`Destiny's Child`,`Three women (Beyoncé, Kelly, Michelle) in matching coordinated outfits — often silver, gold, or colourful co-ord sets with boots. R&B girl group, tight harmonies on stage.`),p(`Beyoncé`,`Beyoncé`,`Light brown-skinned woman with long honey-blonde ombre hair, strong stage presence, and elaborate sparkly costumes. Powerful body and very expressive performing.`,[`Beyonce`]),p(`NSYNC`,`NSYNC`,`Five young men in matching futuristic or sportswear outfits — frosted tips, baggy jeans, and tight choreography. Justin Timberlake's curly blonde hair was their most recognizable look.`,[`*NSYNC`]),p(`Backstreet Boys`,`Backstreet Boys`,`Five young men with Y2K fashion — frosted tips, cargo pants, leather jackets, coordinated casual outfits. Multi-ethnic group; Kevin Richardson is the older, taller dark-haired one.`),p(`Jessica Simpson`,`Jessica Simpson`,`Blonde bombshell with long straight platinum-blonde hair, blue eyes, and a very curvy figure. Known for the Daisy Duke shorts in 'Dukes of Hazzard'; bubbly smile.`),p(`Lindsay Lohan`,`Lindsay Lohan`,`Young redhead (natural) who later dyed hair blonde or auburn. Freckles, green eyes, and a wide smile. Signature look in films like 'Mean Girls' — straight hair, preppy style.`),p(`Paris Hilton`,`Paris Hilton`,`Tall, very thin blonde heiress with long platinum-blonde hair, oversized sunglasses, and designer mini-dresses. Often seen with a tiny chihuahua. Bored socialite aesthetic.`),p(`Nicole Richie`,`Nicole Richie`,`Petite, very slender with straight or wavy dark hair (later bleached blonde). Heavy boho jewelry — headbands, layered necklaces — and often in flowy festival-style clothes.`),p(`Hilary Duff`,`Hilary Duff`,`Teen pop star with long blonde hair, a wide bright smile, and wholesome girl-next-door style. Associated with 'Lizzie McGuire' — school hallway scenes and casual early 2000s outfits.`),p(`Ashlee Simpson`,`Ashlee Simpson`,`Darker than sister Jessica — black or dark-dyed hair, punk-inflected style with eye makeup and studded accessories. Appeared on Saturday Night Live in an infamous lip-sync incident.`),p(`Nick Carter`,`Nick Carter (musician)`,`Backstreet Boys' tall, blonde, blue-eyed heartthrob. Long frosted-tipped hair swept to one side, wide jaw, strong build. The most famous face of the BSB.`),p(`Aaron Carter`,`Aaron Carter`,`Younger brother of Nick Carter — sandy blonde shaggy hair, boyish face, baggy Y2K streetwear. Teen pop look similar to his brother but younger and smaller.`),p(`Kelly Clarkson`,`Kelly Clarkson`,`American Idol winner — warm, girl-next-door look with medium-length dark blonde hair and big smile. Curvy build; wore casual and fun stage outfits rather than super-glam looks.`),p(`Ruben Studdard`,`Ruben Studdard`,`American Idol Season 2 winner — a large Black man with a warm, round face, friendly smile, and smooth R&B style. Often wore simple T-shirts and jackets.`),p(`Lil' Kim`,`Lil' Kim`,`Known for outrageous fashion — wigs of every colour, pasties, tiny rhinestone outfits, and bold makeup. Short stature but enormous stage presence. Bleached or coloured hair.`,[`Lil Kim`]),p(`Nelly`,`Nelly (rapper)`,`St. Louis rapper with a distinctive Band-Aid on his left cheek (his trademark look), baggy sportswear, and often a baseball cap or doo-rag. Relaxed, cool demeanour.`),p(`Mariah Carey`,`Mariah Carey`,`Long wavy honey-blonde or dark hair, glamorous sparkly outfits, and a very curvy figure. Often in bodycon dresses or elegant gowns; wide bright smile and expressive eyes.`),p(`Pink`,`Pink (singer)`,`Known for short spiky pink hair (in her early career), edgy leather-and-punk stage outfits, and athletic aerial acrobatics during performances. Tomboyish but glamorous.`,[`P!nk`]),p(`Nelly Furtado`,`Nelly Furtado`,`Canadian-Portuguese pop singer — long dark wavy hair, a warm earthy style, and ethnic-influenced accessories. Very natural look compared to more glam peers.`),p(`Missy Elliott`,`Missy Elliott`,`Known for oversized futuristic trash-bag suit in 'The Rain' video, bold printed outfits, and avant-garde fashion. Short Black woman with big personality and flashy accessories.`),p(`Usher`,`Usher (entertainer)`,`Smooth R&B singer — athletic build, clean-cut handsome features, and tailored outfits often showing his muscular physique. Often seen without a shirt or in a fitted suit.`,[`Usher`]),p(`Alicia Keys`,`Alicia Keys`,`Known for her natural beauty, braided or natural hair, and soulful look. Often wears minimal makeup in her natural-beauty era; seen at piano in elegant performance outfits.`),p(`Ja Rule`,`Ja Rule`,`New York rapper — lean build, goatee, often shirtless or in vest tops showing tattoos. Raspy voice and gravelly look; gold jewelry and streetwear.`),p(`Eve`,`Eve (rapper)`,`Female rapper with distinctive paw-print tattoos on her chest. Close-cropped platinum-blonde hair, tough-girl style mixed with feminine fashion. Athletic and confident look.`),p(`Ja Rule`,`Ja Rule`,`New York rapper — lean build, goatee, often shirtless or in vest tops showing tattoos. Raspy voice and gravelly look; gold jewelry and streetwear.`)]},{id:`peanuts-gang`,name:`Peanuts Gang`,subject:`Characters`,difficulty:`Easy`,description:`Name the Peanuts character.`,items:[p(`Charlie Brown`,`Charlie Brown`,`A bald, round-headed boy in a yellow shirt with a zigzag black stripe around the middle — always with a slightly sad or worried expression.`,[`Charlie Brown`]),p(`Snoopy`,`Snoopy`,`A white beagle with long black ears and a black spot over one eye — often lying on top of his red doghouse or imagining himself as the WWI flying ace.`),p(`Lucy van Pelt`,`Lucy van Pelt`,`A dark-haired girl in a blue dress who is always confident and bossy — often seen holding a football for Charlie Brown or staffing her psychiatric help booth.`,[`Lucy`]),p(`Linus van Pelt`,`Linus van Pelt`,`A small boy who carries a tattered blue security blanket everywhere — round head, striped shirt, and always sucking his thumb when anxious.`,[`Linus`]),p(`Schroeder`,`Schroeder (Peanuts)`,`A boy with a striped shirt who obsessively plays a tiny toy piano with his eyes closed — Lucy often leans on the piano gazing at him adoringly.`,[`Schroeder`]),p(`Woodstock`,`Woodstock (Peanuts)`,`Snoopy's tiny yellow bird friend — a small fluffy bird with an orange beak, always shown as a few scribbled yellow lines and three feathers on the head.`,[`Woodstock`]),p(`Peppermint Patty`,`Peppermint Patty`,`A tomboyish girl with straight red-brown hair and freckles — always in sandals and a striped green-and-white shirt; refers to Charlie Brown as 'Chuck.'`),p(`Marcie`,`Marcie (Peanuts)`,`Peppermint Patty's friend — a small girl with large round glasses and a neat bob, always in a white shirt. Calls Peppermint Patty 'sir.'`,[`Marcy`]),p(`Franklin`,`Franklin (Peanuts)`,`A Black boy in a light-blue and yellow shirt who is one of Charlie Brown's friends — shown playing baseball, at school, or on Thanksgiving.`),p(`Sally Brown`,`Sally Brown (Peanuts)`,`Charlie Brown's younger sister — blonde, curly hair, always in a pink dress, and secretly in love with Linus. Often uses malapropisms in her speeches.`,[`Sally`]),p(`Pigpen`,`Pig-Pen`,`A boy perpetually surrounded by a cloud of dirt — a grey dust cloud floats around him wherever he goes; he seems completely unaware and content.`,[`Pig Pen`]),p(`Violet Gray`,`Violet Gray (Peanuts)`,`A girl with dark hair often worn in two small pigtails — usually in a purple dress; one of the early recurring friends in the Peanuts strip.`,[`Violet`]),p(`Shermy`,`Shermy (Peanuts)`,`One of the original Peanuts characters — a boy with a flat-top haircut and simple striped shirt. Appeared in the very first strip.`,[`Shermy`]),p(`Patty`,`Patty (Peanuts)`,`One of the original Peanuts girls — different from Peppermint Patty; has dark braided hair and often wears a pink or red dress.`,[`Patty Swanson`]),p(`Joe Cool`,`Snoopy`,`Snoopy wearing sunglasses and leaning against something with a relaxed pose — his alter ego 'Joe Cool', a laid-back campus cool guy.`,[`Snoopy Joe Cool`]),p(`The Red Baron`,`Red Baron`,`Snoopy's imaginary aerial nemesis — seen in Snoopy's WWI pilot daydreams as a menacing red triplane. Snoopy shakes his fist at the sky.`,[`Baron`]),p(`Frieda`,`Frieda (Peanuts)`,`A girl who boasts about her 'naturally curly hair' — shown with a head of curly hair, often seen with her cat Faron.`),p(`A Charlie Brown Christmas`,`A Charlie Brown Christmas`,`The TV special showing Charlie Brown with a scraggly, sparsely decorated little Christmas tree — the tree droops under the weight of one ornament.`),p(`It's the Great Pumpkin, Charlie Brown`,`It's the Great Pumpkin, Charlie Brown`,`Linus sits in a pumpkin patch at night, waiting for the Great Pumpkin to rise and deliver toys — Charlie Brown gets rocks while trick-or-treating.`,[`Great Pumpkin`]),p(`A Charlie Brown Thanksgiving`,`A Charlie Brown Thanksgiving`,`The gang seated at a ping-pong table eating popcorn and toast — Charlie Brown's attempt at a Thanksgiving feast. Very informal and funny.`),p(`Security Blanket`,`Security blanket`,`Linus's tattered light-blue blanket — a small square of worn, frayed cloth that he drags everywhere and cannot be separated from.`,[`Blanket`]),p(`Charles Schulz`,`Charles M. Schulz`,`The creator of Peanuts — a gentle-looking man in glasses, often photographed at a drawing board surrounded by Peanuts characters. White-haired in later years.`,[`Schulz`,`Charles M. Schulz`]),p(`Lucy's Psychiatric Booth`,`Lucy van Pelt`,`A small wooden lemonade-stand-style booth with a sign reading 'Psychiatric Help 5¢' — Lucy sits inside dispensing terrible advice to Charlie Brown.`,[`Psychiatric Booth`]),p(`The Piano`,`Schroeder (Peanuts)`,`A tiny toy piano — flat and small with painted-on keys, barely functional. Schroeder treats it as a full concert grand and plays Beethoven on it.`,[`Piano`]),p(`Baseball`,`Baseball`,`A round white ball with red stitching — central to many Peanuts strips where Charlie Brown's team perpetually loses. He never wins as pitcher.`),p(`Red Baron Doghouse`,`Snoopy`,`Snoopy lying dramatically on the roof of his red doghouse, pretending it is a WWI Sopwith Camel biplane in the heat of aerial battle.`,[`Doghouse`]),p(`Good Grief!`,`Good grief`,`Charlie Brown's catchphrase — seen in a speech bubble above his head, hands on cheeks, looking dejected. Sometimes accompanied by him falling to the ground.`,[`Good Grief`]),p(`Beagle`,`Beagle`,`A small, compact dog with black, white, and tan colouring — floppy ears, a white-tipped tail, and big brown eyes. Snoopy is the most famous beagle.`),p(`Football`,`Football`,`The classic scene: Lucy holds a football for Charlie Brown to kick — then pulls it away at the last second, sending him flying through the air.`),p(`Happiness is a Warm Puppy`,`Happiness Is a Warm Puppy`,`The famous book cover showing Charlie Brown hugging Snoopy — a simple sweet drawing of a boy embracing his dog with closed eyes.`)]},{id:`lion-king`,name:`The Lion King`,subject:`Characters`,difficulty:`Easy`,description:`Identify the character, location, voice actor or songwriter from THE LION KING franchise.`,items:[p(`Simba`,`Simba`,`The lion cub — golden fur, large eyes, black-tipped tail; as an adult, develops a flowing golden-brown mane. The main protagonist of The Lion King.`),p(`Mufasa`,`Mufasa`,`Simba's father — a large, noble male lion with a thick reddish-brown mane, powerful build, and a wise, regal expression. Voiced by James Earl Jones.`),p(`Scar`,`Scar (The Lion King)`,`A lean, dark-maned lion with a scar over his left eye — angular face, green eyes, dark fur, and a perpetually scheming expression. The villain.`,[`Taka`]),p(`Nala`,`Nala (The Lion King)`,`Simba's childhood friend and later queen — a tawny lioness with teal-blue eyes, lighter than Simba, and a strong, confident bearing.`,[`Nala`]),p(`Timon`,`Timon (The Lion King)`,`A wisecracking meerkat — an upright, slender, brown-and-tan small mammal with large eyes and ears, always scheming with Pumbaa.`),p(`Pumbaa`,`Pumbaa`,`A friendly warthog — large grey body, big warty face, prominent tusks, and a big heart. Pumbaa and Timon are inseparable comic duo.`),p(`Rafiki`,`Rafiki (The Lion King)`,`An old mandrill — a blue-and-red face, colourful markings, and a painted staff. Holds Simba aloft at Pride Rock in the iconic opening scene.`,[`Rafiki`]),p(`Zazu`,`Zazu (The Lion King)`,`A red-billed hornbill — a small blue-and-white bird with an oversized bright red-orange beak, serving as Mufasa's majordomo.`),p(`Sarabi`,`Sarabi`,`Simba's mother — a regal, strong lioness with a darker coat and a proud, enduring expression. Stands up to Scar even under his reign.`),p(`Shenzi`,`Shenzi, Banzai, and Ed`,`The lead hyena — a spotted hyena with a dark face, lighter ears, and a menacing grin. Leader of the trio who serve Scar.`,[`Shenzi`]),p(`Banzai`,`Shenzi, Banzai, and Ed`,`One of Scar's hyena henchmen — a spotted hyena with dark shoulder markings, narrowed eyes, and an aggressive, impatient manner.`,[`Banzai`]),p(`Ed`,`Shenzi, Banzai, and Ed`,`The dopey hyena — perpetually cross-eyed with a goofy grin and tongue lolling out. Laughs maniacally at everything.`,[`Ed the Hyena`]),p(`Pride Rock`,`Pride Rock`,`A massive rocky outcrop rising above the African savanna — a broad, flat-topped rock with a large ledge where Mufasa surveys his kingdom.`),p(`Hakuna Matata`,`Hakuna matata`,`Timon and Pumbaa's philosophy — shown in a lush jungle scene with the duo lounging by a waterfall while Simba learns to eat bugs.`),p(`Circle of Life`,`Circle of Life`,`The opening scene — Rafiki holds baby Simba aloft on Pride Rock as the African sun rises and animals of the Pride Lands bow from below.`),p(`Can You Feel the Love Tonight`,`Can You Feel the Love Tonight`,`Adult Simba and Nala in a romantic sequence in a moonlit jungle — gazing at each other as the iconic Elton John ballad plays.`),p(`Elton John`,`Elton John`,`Flamboyant British rock icon — known for outrageous sequined costumes, oversized tinted glasses, and playing a grand piano. White-haired in recent years.`),p(`Hans Zimmer`,`Hans Zimmer`,`Oscar-winning film composer — a compact man with silver hair and a warm smile, often photographed in the recording studio surrounded by screens.`),p(`Tim Rice`,`Tim Rice`,`British lyricist who wrote Lion King songs with Elton John — a charming, grey-haired man with a warm, genial expression. Also wrote lyrics for Evita and Jesus Christ Superstar.`),p(`James Earl Jones`,`James Earl Jones`,`A tall, imposing Black actor with one of the most distinctive deep voices in Hollywood — white-haired and dignified in formal or casual wear.`),p(`Matthew Broderick`,`Matthew Broderick`,`American actor — a boyish, approachable-looking man with a light build. Famous as Ferris Bueller and the voice of adult Simba.`),p(`Jeremy Irons`,`Jeremy Irons`,`British actor known for his melancholic, elegant screen presence — lean, angular face, deep-set eyes, and a cultured voice. Perfect for Scar.`),p(`Nathan Lane`,`Nathan Lane`,`A stocky, expressive Broadway and film comedian — warm, round face with mischievous eyes. Famous as Max in The Birdcage and voice of Timon.`),p(`Ernie Sabella`,`Ernie Sabella`,`An American character actor with a warm, round face — known for Broadway and the voice of Pumbaa the warthog.`),p(`Beyoncé`,`Beyoncé`,`A powerhouse singer with honey-blonde hair, luminous stage presence, and elaborate sparkly costumes — provided the voice of Nala in the 2019 remake.`,[`Beyonce`]),p(`Donald Glover`,`Donald Glover`,`A young actor, comedian, and musician — slim build, bright eyes, and a warm smile. Voiced Simba in the 2019 Lion King; also known as Childish Gambino.`,[`Childish Gambino`]),p(`Chiwetel Ejiofor`,`Chiwetel Ejiofor`,`A British actor of Nigerian heritage — intense, thoughtful dark eyes and a commanding presence. Voiced Scar in the 2019 remake.`),p(`Graveyard of the Elephants`,`Elephant graveyard (The Lion King)`,`A dark, foreboding landscape of enormous elephant skulls and bones — grey and pale in a mist-shrouded wasteland. Home of the hyenas.`,[`Elephant Graveyard`]),p(`Kovu`,`Kovu (The Lion King)`,`An adult lion from the Outlanders — dark fur, a scar over one eye (like Scar), and green eyes. Son of Zira; love interest for Kiara in Lion King II.`),p(`Kiara`,`Kiara (The Lion King)`,`Simba and Nala's daughter — a young lioness with tawny golden fur and her father's large eyes. Adventurous and spirited, the heroine of Lion King II.`)]},{id:`famous-babies`,name:`Famous Babies`,subject:`Characters`,difficulty:`Medium`,description:`Name the real or fictional famous baby or babies.`,items:[p(`Grogu`,`Grogu`,`A tiny green alien baby with huge round ears and big dark eyes — wrinkly face, about half a foot tall. Wears a small robe and levitates objects with the Force.`,[`Baby Yoda`,`The Child`]),p(`Stewie Griffin`,`Stewie Griffin`,`A football-shaped baby head with a huge round skull — in a yellow shirt and red overalls. Speaks in a proper British accent and builds weapons. Family Guy.`),p(`Maggie Simpson`,`Maggie Simpson`,`The silent pacifier-sucking baby of the Simpson family — always in a pink onesie with a matching bow on her head and a blue pacifier in her mouth.`,[`Maggie`]),p(`Tommy Pickles`,`Tommy Pickles`,`The brave, bald baby hero of Rugrats — a very small bald baby with two front teeth and a blue outfit; always the leader of the babies.`,[`Tommy`]),p(`Angelica Pickles`,`Angelica Pickles`,`Tommy's domineering blonde cousin — long curly blonde pigtails, a purple dress, and a spoiled, bossy expression. The villain of the Rugrats nursery.`,[`Angelica`]),p(`The Boss Baby`,`The Boss Baby`,`A baby in a tiny grey business suit and tie — carries a briefcase, wears a small white dress shirt and jacket, and speaks with adult authority.`,[`Boss Baby`]),p(`Bambi`,`Bambi`,`A tiny spotted fawn with large dark eyes, white spots on its back, and wobbly legs — the Disney deer. Brown with a white tail.`),p(`Simba`,`Simba`,`The lion cub — small golden-furred cub with big eyes and a dark-tipped tail, being held aloft by Rafiki above Pride Rock in the sunrise.`),p(`Dumbo`,`Dumbo`,`A small grey baby elephant with comically oversized ears that hang down past his feet — big blue eyes and a small pink cap. The ears are the giveaway.`),p(`Baby Sinclair`,`Dinosaurs (TV series)`,`The baby dinosaur from the 1990s TV show — a green infant dinosaur with a giant head, who hits his father with a frying pan and yells 'Not the Mama!'`,[`Not the Mama`]),p(`Chuckie Finster`,`Chuckie Finster`,`Tommy's anxious, red-headed best friend in Rugrats — wild red hair sticking out at all angles, thick round glasses, a striped shirt, and a worried expression.`,[`Chuckie`]),p(`Phil and Lil DeVille`,`Phil and Lil DeVille`,`Rugrats twins — a boy and girl who look identical in purple outfits, with wild flipped-out hair and matching purple rompers. Always together.`,[`Phil and Lil`]),p(`Jack Jack Parr`,`Jack-Jack Parr`,`The baby from The Incredibles — a chubby, wide-eyed baby in a red outfit who can transform, shoot fire, pass through walls, and turn into metal.`,[`Jack Jack`]),p(`Bam-Bam Rubble`,`Bamm-Bamm Rubble`,`The Flintstones' adopted baby — a super-strong toddler with a bone tied in his pale blond hair, wearing a spotted animal-skin onesie, carries a big club.`,[`Bam Bam`]),p(`Pebbles Flintstone`,`Pebbles Flintstone`,`The Flintstones' red-haired baby girl — a tiny baby with a topknot tied with a bone, spotted animal-skin dress, and cheerful wide eyes.`,[`Pebbles`]),p(`Rudy Huxtable`,`Rudy Huxtable`,`The youngest Huxtable child on The Cosby Show — a small, round-cheeked, very cute Black girl with large expressive eyes and big hair puffs.`,[`Rudy`]),p(`Baby Shark`,`Baby Shark`,`The viral children's song character — a brightly coloured cartoon shark family, usually shown in yellows and pinks with huge eyes on a kids' app.`,[`Baby Shark Song`]),p(`North West`,`North West (celebrity)`,`Kim Kardashian and Kanye West's daughter — seen in celebrity photos from birth, often in all-black outfits or fashionable children's clothes.`,[`North West`]),p(`Blue Ivy Carter`,`Blue Ivy Carter`,`Beyoncé and Jay-Z's daughter — seen at award shows in elegant outfits alongside her famous parents. She has won her own Grammy.`,[`Blue Ivy`]),p(`Suri Cruise`,`Suri Cruise`,`Tom Cruise and Katie Holmes's daughter — photographed constantly as an infant through childhood in fashionable, sometimes adult-style children's clothing.`),p(`Royal Baby`,`George, Prince of Wales`,`Prince George being carried outside the Lindo Wing of St. Mary's Hospital — a tiny newborn wrapped in a white blanket, parents beaming.`,[`Prince George`]),p(`Tweety Bird`,`Tweety`,`A tiny yellow cartoon canary — huge head, big blue eyes, tiny beak, and orange feet. Always escaping Sylvester the cat's clutches.`,[`Tweety`]),p(`Pikachu`,`Pikachu`,`A small, round yellow mouse-like Pokémon — red cheeks, pointy ears with black tips, and a lightning bolt tail. The most famous Pokémon.`),p(`Baby Groot`,`Groot`,`A tiny potted sapling version of the giant tree creature — small green sprout in a brown pot, with small eyes and one tiny leaf growing. Dances to music.`,[`Baby Groot`]),p(`Rosemary's Baby`,`Rosemary's Baby`,`The 1968 horror film — Mia Farrow as a pregnant woman in New York who suspects her baby will be Satan's child. Iconic shot of her horrified face.`),p(`Baby Driver`,`Baby Driver (film)`,`A 2017 Edgar Wright film about a young getaway driver — the protagonist wears earbuds constantly, often seen in a red jacket.`),p(`Baby Herman`,`Baby Herman`,`From Who Framed Roger Rabbit — a cigar-chomping adult trapped in a baby body, played by Bob Hoskins' co-star; wears a white onesie.`,[`Roger Rabbit Baby`]),p(`Dil Pickles`,`Dil Pickles (Rugrats)`,`Tommy's baby brother in Rugrats — an even smaller, completely bald baby with big blue eyes, constantly dribbling, in a green outfit.`,[`Dil`]),p(`Elmo`,`Elmo`,`A small, furry red Muppet from Sesame Street — bright red body, round orange nose, big white eyes with black pupils, and a friendly high-pitched giggle.`,[`Elmo Sesame Street`])]},{id:`bakery`,name:`Bakery`,subject:`Culinary`,difficulty:`Easy`,description:`Name the baked good, ingredient, or item you might find at a bakery.`,items:[p(`Croissant`,`Croissant`,`A flaky, buttery crescent-shaped pastry with golden-brown layered exterior — curved like a crescent moon with visible laminated dough layers when torn.`),p(`Sourdough Bread`,`Sourdough bread`,`A round artisan loaf with a thick, hard, dark-brown crust — often has scored patterns on top (a cross, leaf, or spirals). Dense, chewy crumb with large irregular holes.`,[`Sourdough`]),p(`Baguette`,`Baguette`,`A long, thin French loaf — golden-brown crispy crust with diagonal scoring slashes along the top, about 60 cm long. Pale cream-coloured interior.`),p(`Brioche`,`Brioche`,`A rich, golden-yellow bread with a glossy egg-washed surface — often baked as a round loaf with a small topknot ball, or as individual rolls. Very soft and pillowy.`),p(`Cinnamon Roll`,`Cinnamon roll`,`A swirling spiral roll with a cinnamon-brown sugar centre — pale golden bun with visible swirled layers, often topped with white cream cheese frosting.`),p(`Éclair`,`Éclair`,`An oblong choux pastry finger topped with dark chocolate glaze and filled with cream. Long, smooth, shiny chocolate-covered exterior with flat bottom.`,[`Eclair`]),p(`Macaron`,`French macaroon`,`Two smooth, rounded pastel-coloured sandwich cookies with a filling in between — perfectly round, slightly domed, with a distinctive 'foot' ruffle at the base.`,[`Macaron`]),p(`Cannoli`,`Cannoli`,`A crunchy fried pastry tube with cream-filled ends — brown-gold crispy shell with white ricotta cream piped out both ends, often dotted with chocolate chips.`),p(`Biscotti`,`Biscotti`,`Long, twice-baked Italian cookies with a very hard, dry texture — often contain almonds or chocolate chips. Pale tan colour; flat-bottomed and oblong.`),p(`Pain au Chocolat`,`Pain au chocolat`,`A rectangle of flaky laminated croissant dough encasing one or two dark chocolate batons — golden-brown exterior, buttery layers visible at the ends.`,[`Chocolate Croissant`]),p(`Danish Pastry`,`Danish pastry`,`A flaky laminated pastry square or oval with a filling of cream cheese, jam, or apple in the centre — often latticed or folded, with a shiny glaze.`,[`Danish`]),p(`Donut`,`Doughnut`,`A ring-shaped fried dough with a hole in the middle — golden-brown exterior, topped with glazed sugar, chocolate icing, or coloured sprinkles.`,[`Doughnut`]),p(`Muffin`,`Muffin`,`A domed, cupcake-shaped individual baked good — tall dome rises above a crimped paper liner, golden-brown top. Can be blueberry, chocolate, or bran.`),p(`Bagel`,`Bagel`,`A dense, ring-shaped yeasted bread — smooth shiny surface from boiling, chewy texture, with a hole in the centre. Can be plain, sesame, poppy seed, or everything.`),p(`Pretzel`,`Pretzel`,`A twisted bread knot in a distinctive interlocked shape — usually dark brown with coarse salt crystals on a shiny surface. Soft baked or hard crispy versions.`),p(`Scone`,`Scone`,`A wedge-shaped or round British quick bread — pale golden exterior, crumbly texture. Often plain, fruity, or cheese-flavoured; served with clotted cream.`),p(`Focaccia`,`Focaccia`,`A thick, flat Italian bread with a dimpled surface — golden olive-oil-soaked exterior with rosemary, salt, or toppings pressed into the dimples.`),p(`Ciabatta`,`Ciabatta`,`An Italian bread with a very flat, elongated shape and a very open, porous crumb structure — pale floury exterior, large irregular holes inside.`),p(`Challah`,`Challah`,`A braided golden-brown loaf — six or three strands of dough woven in a complex braid pattern, with a shiny egg-washed surface.`),p(`Pumpernickel`,`Pumpernickel`,`A very dark brown to almost black rye bread — dense, moist, slightly sweet, with a very dark crust. Sliced thin; much darker than regular bread.`),p(`Rolling Pin`,`Rolling pin`,`A cylindrical wooden or marble tool for rolling dough flat — typically a smooth cylinder with handles at each end.`),p(`Proofing Basket`,`Proofing basket`,`A round or oval woven basket lined with cloth or bare wicker used to shape and proof bread dough — leaves a characteristic spiral or circular pattern on the loaf.`,[`Banneton`]),p(`Stand Mixer`,`Stand mixer`,`A heavy countertop appliance with a large bowl and a rotating mixing attachment — often in bright colours (KitchenAid is iconic in tilt-head design).`),p(`Bread Loaf Pan`,`Bread pan`,`A rectangular metal pan about 22cm long — used to bake sandwich bread into uniform loaf shapes. Often shown with a risen golden-brown loaf inside.`,[`Loaf Pan`]),p(`Pastry Brush`,`Pastry brush`,`A small flat brush with soft bristles — used to brush egg wash, butter, or glaze onto pastry before baking.`),p(`Cake`,`Cake`,`A round or rectangular baked dessert — covered in smooth frosting (often white or coloured) with decorations, layers visible when sliced.`),p(`Cupcake`,`Cupcake`,`A single-serving cake in a paper liner — dome of frosting piped on top, often in swirls, with sprinkles or decorations.`),p(`Cheesecake`,`Cheesecake`,`A dense, creamy pale-yellow or white filling in a golden biscuit/cracker crust — smooth flat surface, often with a fruit topping.`),p(`Tart`,`Tart`,`A shallow pastry shell with a thin, crumbly pastry base and a filling — can be fruit (bright coloured fruits in a glaze), custard, or chocolate.`),p(`Strudel`,`Strudel`,`A long cylindrical rolled pastry — very thin, flaky layers wrapped around a filling of apple, cherry, or cheese. Dusted with powdered sugar.`)]},{id:`italian-cuisine`,name:`Italian Cuisine`,subject:`Culinary`,difficulty:`Easy`,description:`Name the Italian dish or ingredient used in Italian cooking.`,items:[p(`Spaghetti`,`Spaghetti`,`Long, thin round pasta strands in a tomato or meat sauce — the classic Italian dish with meatballs or bolognese sauce on a white plate.`),p(`Fettuccine Alfredo`,`Fettuccine Alfredo`,`Wide, flat ribbon pasta coated in a creamy pale yellow Parmesan and butter sauce — thick, glossy, and clings to every strand.`,[`Alfredo`]),p(`Lasagna`,`Lasagna`,`Layers of flat pasta, meat or vegetable filling, béchamel, and tomato sauce baked in a rectangular dish — cut slices show distinct strata.`,[`Lasagne`]),p(`Risotto`,`Risotto`,`A creamy, thick rice dish — arborio rice cooked until starchy and saucy, served in a shallow bowl with a wave pattern or a sprinkle of Parmesan.`),p(`Gnocchi`,`Gnocchi`,`Small, soft potato dumplings — oval pillows about 1 inch long, often with ridged edges from a fork, served in sauce or browned in butter.`),p(`Osso Buco`,`Ossobuco`,`A cross-cut veal shank braised until tender — the large round bone is visible in the centre with marrow inside, in a rich saffron or gremolata sauce.`,[`Ossobuco`]),p(`Tiramisu`,`Tiramisù`,`A layered dessert in a glass or dish — espresso-soaked ladyfinger biscuits alternated with mascarpone cream, dusted with cocoa powder on top.`,[`Tiramisu`]),p(`Gelato`,`Gelato`,`Italian ice cream served in colourful mounds — denser and creamier than American ice cream, displayed in large shallow pans in a gelateria.`),p(`Panna Cotta`,`Panna cotta`,`A silky, pale, wobbly cream dessert unmoulded onto a plate — smooth white dome with a berry coulis or caramel sauce pooled around it.`),p(`Carpaccio`,`Carpaccio`,`Very thin slices of raw beef or fish arranged flat on a plate — translucent crimson layers of raw meat drizzled with olive oil, lemon, and capers.`),p(`Bruschetta`,`Bruschetta`,`Thick slices of toasted Italian bread rubbed with garlic and topped with diced tomatoes, fresh basil, and olive oil — bright red topping on golden bread.`),p(`Prosciutto`,`Prosciutto`,`Very thin, paper-like slices of cured ham — pale pink with a ribbon of white fat along one edge. Draped or rolled; slightly translucent.`),p(`Mozzarella`,`Mozzarella`,`A fresh white cheese — a round ball or log that is very white, moist, and mild. Often sliced to reveal a smooth, slightly springy interior.`),p(`Parmesan`,`Parmigiano-Reggiano`,`A hard, golden-yellow aged cheese with a grainy, crystalline texture — crumbles into shards; rind is thick and dark. Grated over pasta.`,[`Parmigiano Reggiano`,`Parmesan Cheese`]),p(`Ricotta`,`Ricotta`,`A fresh white cheese with a slightly grainy, fluffy texture — very light and mild, scooped into a bowl or used to fill pasta. Snow-white appearance.`),p(`Burrata`,`Burrata`,`A pouch of fresh mozzarella filled with cream and curd — the outside is smooth white, but cut open, it oozes a creamy, rich interior.`),p(`Arancini`,`Arancini`,`Round or cone-shaped fried rice balls — golden-brown breadcrumb coating outside, with a soft rice interior filled with cheese or meat.`),p(`Calamari`,`Calamari`,`Golden-fried rings of squid — round rings and tentacles in a crispy pale batter, served with marinara or aioli dipping sauce.`,[`Fried Calamari`]),p(`Ribollita`,`Ribollita`,`A thick Tuscan bread soup — very dense, chunky, dark with beans and kale, thickened with day-old bread to an almost porridge-like consistency.`),p(`Polenta`,`Polenta`,`A thick yellow cornmeal porridge — served creamy and soft in a bowl, or cooled and sliced as firm golden cakes, sometimes with a crispy grilled exterior.`),p(`Pesto`,`Pesto alla genovese`,`A bright green sauce — vivid green paste made from crushed basil, Parmesan, pine nuts, and olive oil; coats pasta generously.`,[`Pesto Sauce`]),p(`Marinara`,`Marinara sauce`,`A bright red tomato sauce — simple, chunky, with visible pieces of tomato in a red oil-based sauce with herbs. Classic pizza or pasta topping.`,[`Marinara Sauce`]),p(`Caprese Salad`,`Caprese salad`,`Alternating slices of ripe red tomato and white fresh mozzarella, with fresh basil leaves — red, white, and green like the Italian flag.`,[`Insalata Caprese`]),p(`Antipasto`,`Antipasto`,`An Italian starter platter — arranged meats (prosciutto, salami), olives, roasted peppers, artichokes, and cheeses on a wooden or marble board.`),p(`Minestrone`,`Minestrone`,`A hearty Italian vegetable soup — thick broth with tomatoes, beans, small pasta shapes, and chunks of zucchini, carrot, and onion.`),p(`Pizza Margherita`,`Pizza Margherita`,`A simple Neapolitan pizza — thin charred crust with a tomato sauce base, white mozzarella melted in patches, and fresh green basil leaves.`,[`Margherita Pizza`]),p(`Focaccia`,`Focaccia`,`A thick, flat Italian bread — golden olive-oil-soaked surface dimpled with finger indentations and topped with rosemary and coarse sea salt.`),p(`Pancetta`,`Pancetta`,`Italian cured pork belly — rolled and sliced in thin rounds showing a spiral of white fat and pink meat, or cut into cubed lardons for cooking.`),p(`Limoncello`,`Limoncello`,`A vivid bright yellow Italian liqueur in a tall chilled shot glass — the colour of lemon sunshine, often served ice-cold from the freezer.`),p(`Chianti`,`Chianti`,`A Tuscan red wine — deep ruby-red in a glass or a traditional wicker-covered Fiasco bottle. Pairs with pasta and cheese.`)]},{id:`compost`,name:`Compost`,subject:`Culinary`,difficulty:`Easy`,description:`Name these compostable items.`,items:[p(`Apple Core`,`Apple`,`The fibrous centre of an eaten apple — a small cylinder of pale cream core with seeds, surrounded by a little remaining fruit. Stems at top and bottom.`,[`Apple`]),p(`Banana Peel`,`Banana peel`,`A curved yellow-to-brown peel from a banana — limp and spotted, with the inner white surface visible. The classic slipping hazard.`,[`Banana`]),p(`Coffee Grounds`,`Coffee grounds`,`Fine dark brown grainy residue left after brewing coffee — a damp, dark, earthy-smelling pile of tiny particles, often from a paper filter.`),p(`Eggshells`,`Eggshell`,`Thin, brittle white or brown shell fragments from cracked eggs — smooth on the outside, papery membrane on the inside.`,[`Egg Shells`]),p(`Newspaper`,`Newspaper`,`A folded or crumpled broadsheet or tabloid in black-and-white newsprint — large pages of small-print text and photos printed on thin, grey paper.`),p(`Cardboard`,`Cardboard`,`A flat brown corrugated or solid board — the corrugated kind shows a wavy inner layer between two flat layers when torn. Brown, stiff, bendable.`),p(`Grass Clippings`,`Lawn mowing`,`Fresh-cut short grass — a pale green, slightly wet pile of short grass blade clippings, often left in a row by a lawnmower.`,[`Grass`]),p(`Leaves`,`Leaf`,`Fallen autumn leaves in shades of orange, red, brown, and yellow — dry, curled, and crispy or freshly fallen and still pliable.`,[`Fall Leaves`]),p(`Tea Bags`,`Tea bag`,`A small paper pouch of tea leaves with a string attached — stained dark brown after steeping. Square or circular with a metal staple or paper tag.`,[`Tea Bag`]),p(`Vegetable Scraps`,`Vegetable`,`Carrot tops, celery ends, kale stems, corn husks — assorted vegetable peelings and offcuts in green and orange, often damp and limp.`,[`Veggie Scraps`]),p(`Fruit Peel`,`Fruit`,`Bright coloured fruit skins — orange or lemon peel in curved strips, or apple peelings in long thin spirals. Fragrant and citrus-scented.`,[`Fruit Scraps`]),p(`Bread`,`Bread`,`Old or stale bread slices — soft white or brown bread that has gone hard; may show mould spots. Often whole slices or torn chunks.`),p(`Pasta`,`Pasta`,`Leftover cooked pasta — limp, slightly sticky shapes (spaghetti, penne) in a lump. Usually pale yellow or white if plain, darker if sauced.`),p(`Hair`,`Human hair`,`A clump of loose human hair — a tangled, dark or light bundle of fine strands collected from a brush or comb. Very light and feathery.`,[`Human Hair`]),p(`Cardboard Egg Carton`,`Egg carton`,`A grey-brown moulded paper carton with 12 round cups for eggs — rough, papier-mâché texture with a hinged lid. Biodegradable alternative to foam.`,[`Egg Carton`]),p(`Paper Towel`,`Paper towel`,`A crumpled, used white paper towel — soft, slightly damp, and creased from being used to wipe a surface.`,[`Paper Towels`]),p(`Wood Chips`,`Wood chip`,`Small irregular chunks of shredded wood — light tan to brown, fibrous, splintered edges. Used as garden mulch around trees and flower beds.`,[`Mulch`]),p(`Sawdust`,`Sawdust`,`Fine, powdery wood particles from cutting or sanding — a pale tan or yellow-brown fine powder with a woody smell.`),p(`Straw`,`Straw`,`Dry, pale yellow hollow stems of cereal plants — light, brittle, and bundled into bales or loose piles. Looks like dried spaghetti.`),p(`Cotton`,`Cotton`,`Soft, fluffy white bolls of raw cotton — very light, cloud-like puffs of white fibres, or cotton balls used for cosmetics.`),p(`Corn Cob`,`Corncob`,`The hard, pale yellow or cream-coloured cob left after corn kernels have been eaten off — rows of small indentations where kernels were attached.`,[`Corn Cob`]),p(`Avocado Pit`,`Avocado`,`A large, round, dark brown pit from inside an avocado — smooth, hard, and round with a slightly dusty brown surface.`,[`Avocado Seed`]),p(`Orange Peel`,`Orange peel`,`Curved strips of bright orange rind — bumpy outer texture, white pith on the inside. Fragrant with citrus oils.`,[`Orange`]),p(`Watermelon Rind`,`Watermelon`,`The pale green-and-white outer layer of a watermelon slice — thick white rind with a thin dark green exterior, after the red flesh has been eaten.`),p(`Pumpkin`,`Pumpkin`,`A large round orange gourd — ribbed skin, flat bottom, and curly stem on top. In autumn, often carved or left whole as seasonal decoration.`),p(`Nut Shells`,`Walnut`,`Hard, crinkled brown shells of walnuts, peanuts, or other nuts — rough, dry, and irregular in shape after the nut has been removed.`,[`Walnut Shells`]),p(`Seaweed`,`Seaweed`,`Dark green or brown slimy marine algae — flat, rubbery fronds or stringy clusters found on rocky beaches or sold dried in flat sheets.`),p(`Wine Corks`,`Cork (material)`,`Cylindrical plugs of natural cork — tan, slightly rough-textured bark material stamped with a winery name. Expands to seal a wine bottle neck.`,[`Cork`]),p(`Onion Skin`,`Onion`,`Papery, translucent dry layers peeled from an onion — very thin, rustling, golden-brown or purple-red sheets.`,[`Onion Skins`]),p(`Moldy Food`,`Mold`,`Food with fuzzy green, blue, or white mould growth — soft patches of fuzzy growth on bread, fruit, or leftovers.`,[`Old Food`])]},{id:`charcuterie`,name:`Charcuterie Board`,subject:`Culinary`,difficulty:`Medium`,description:`Name the food or item associated with Charcuterie Boards.`,items:[p(`Prosciutto`,`Prosciutto`,`Very thin, paper-like slices of Italian cured ham — pale pink with a ribbon of white fat. Draped or rolled loosely on a board.`),p(`Salami`,`Salami`,`Dark red cured sausage sliced into rounds — visible white fat specks on a deep red background. Slices are about 2mm thick and slightly oily.`),p(`Sopressata`,`Soppressata`,`An Italian dry-cured salami — drier and flatter than round salami, with a rustic, pressed shape and coarser texture.`,[`Soppressata`]),p(`Bresaola`,`Bresaola`,`Air-dried salted beef — sliced paper-thin to a deep ruby-red colour, almost translucent at the edges. Very lean with no visible fat.`),p(`Coppa`,`Capicola`,`Cured pork neck and shoulder — sliced thin with a marbled pink-and-white pattern, more fat-streaked than prosciutto.`,[`Capicola`,`Capocollo`]),p(`Brie`,`Brie (cheese)`,`A wheel of soft French cheese — pale yellow interior with an edible white bloomy rind. Soft and runny when ripe; often cut in wedges.`),p(`Camembert`,`Camembert`,`A small round of soft cheese — in a thin wooden box with a white bloomy rind. Similar to Brie but smaller and more pungent.`),p(`Gouda`,`Gouda cheese`,`A Dutch cheese in a wheel or wedge — pale ivory to golden-yellow interior, firm but slightly waxy, with a red or yellow wax rind.`),p(`Manchego`,`Manchego`,`A Spanish sheep's milk cheese — firm, pale yellow with a distinctive herringbone basket-weave rind pattern. Nutty and slightly crumbly.`),p(`Gruyère`,`Gruyère cheese`,`A Swiss hard cheese — pale yellow with small irregular holes. Firm and slightly granular; pale straw colour throughout.`,[`Gruyere`]),p(`Blue Cheese`,`Blue cheese`,`A creamy white cheese with visible blue-green veins running through it — crumbly or creamy texture; strong and pungent.`,[`Gorgonzola`]),p(`Fig Jam`,`Fig jam`,`A dark purple-brown jam with visible fig seeds — a thick, glossy spread in a small jar or ramekin with a rich, sweet scent.`,[`Fig Preserves`]),p(`Honeycomb`,`Honeycomb`,`A section of natural beeswax comb — yellow hexagonal wax cells filled with honey, sometimes placed directly on a board to drizzle.`),p(`Crackers`,`Cracker (food)`,`Thin, pale, crispy wafers — usually round or rectangular, lightly salted. Stacked or fanned out beside cheese on a board.`,[`Water Crackers`]),p(`Cornichons`,`Cornichon`,`Tiny French pickles — very small, dark green, bumpy gherkins packed in a jar with tarragon. Crisp, sour, and vinegary.`,[`Gherkins`]),p(`Olives`,`Olive`,`Small oval fruits — green or black, sometimes stuffed with red pimento. Plump, glossy, and briny in a small bowl.`),p(`Dried Fruit`,`Dried fruit`,`Wrinkled, concentrated fruit — dark brown dried apricots, figs, cranberries, or cherries add sweetness and colour to the board.`),p(`Grapes`,`Grape`,`A bunch of plump green or red-purple grapes on the stem — round, glossy, and fresh-looking. Used for contrast and sweetness on boards.`),p(`Walnuts`,`Walnut`,`Knobbly, wrinkled brown nut halves inside a hard shell — the nut meat is a tan-brown brain-like shape. Earthy and slightly bitter.`),p(`Almonds`,`Almond`,`Smooth, oval, pale tan nuts — slightly pointed at one end. Eaten whole or sliced; mild and slightly sweet.`),p(`Pistachios`,`Pistachio`,`Small oval nuts in a partially split tan shell — the green-purple kernel inside is vivid pistachio green. Often served in the shell.`),p(`Sliced Baguette`,`Baguette`,`Thin diagonal slices of a French baguette — pale cream interior with a golden crust, fanned out on the board for spreading with cheese.`),p(`Rosemary`,`Rosemary`,`A sprig of fresh rosemary — dark green needle-like leaves on a woody stem, very fragrant. Used to garnish the board aesthetically.`),p(`Slate Board`,`Slate`,`A flat, dark grey natural stone board — smooth, slightly matte, with a sophisticated dark background that makes colourful charcuterie pop.`),p(`Wooden Board`,`Cutting board`,`A large rectangular or oval wooden board — natural wood grain, sometimes with a handle. The classic base for a charcuterie spread.`,[`Cutting Board`]),p(`Pâté`,`Pâté`,`A smooth, spreadable paste of finely ground meat — grey-brown, matte surface in a ceramic ramekin. Silky and rich in texture.`,[`Pate`]),p(`Hummus`,`Hummus`,`A pale beige smooth chickpea dip — swirled in a bowl with a drizzle of olive oil and dusting of paprika on top. Creamy and velvety.`),p(`Mustard`,`Mustard (condiment)`,`A small pot or dollop of mustard — bright yellow Dijon or grainy whole-grain mustard in an amber colour with visible seeds.`),p(`Artichoke Hearts`,`Artichoke`,`Pale green-yellow layered artichoke heart segments from a jar — marinated, tender, and slightly translucent.`,[`Artichokes`]),p(`Pretzels`,`Pretzel`,`Small, twisted, dark brown mini pretzels — crispy with a shiny glazed surface and coarse salt crystals. Perfect finger food.`)]},{id:`southern-cookin`,name:`Southern Cookin'`,subject:`Culinary`,difficulty:`Medium`,description:`Name the person, dish, or ingredient.`,items:[p(`Fried Chicken`,`Fried chicken`,`Golden-brown chicken pieces with a thick crispy breadcrumb crust — dark and crunchy outside, juicy white or dark meat inside.`),p(`Biscuits and Gravy`,`Biscuits and gravy`,`Soft, fluffy split biscuits smothered in thick white sausage gravy — the grey-flecked white cream gravy covers the biscuits completely.`,[`Biscuits & Gravy`]),p(`Collard Greens`,`Collard greens`,`Dark leafy greens braised until very tender — a deep olive-green mound of soft, silky leaves cooked with pork and vinegar.`),p(`Cornbread`,`Cornbread`,`A golden-yellow quick bread baked in a cast-iron skillet or pan — slightly rough, golden-brown crust with a pale yellow crumb.`),p(`Grits`,`Grits`,`A pale, creamy white porridge made from ground corn — thick and smooth in a bowl, often topped with butter that melts in.`),p(`Shrimp and Grits`,`Shrimp and grits`,`Plump pink shrimp on a bed of creamy white grits — often with a Cajun sauce or gravy pooled around the shrimp.`),p(`Hush Puppies`,`Hush puppy (food)`,`Small, round fried cornmeal balls — golden-brown and crispy outside, pale yellow cornbread interior. Served in a basket.`,[`Hush Puppy`]),p(`Pecan Pie`,`Pecan pie`,`A dark, glossy pie with a very sweet filling — whole pecan halves arranged in concentric circles on top of a thick caramel-brown filling.`),p(`Banana Pudding`,`Banana pudding`,`Layers of vanilla wafers, sliced bananas, and creamy vanilla pudding — topped with meringue or whipped cream in a clear bowl or cup.`),p(`Peach Cobbler`,`Cobbler (food)`,`Soft, golden biscuit or cake topping over bubbling fresh peaches — a caramelised peach filling visible around the edges of the fluffy topping.`,[`Cobbler`]),p(`Sweet Potato Pie`,`Sweet potato pie`,`A single-crust pie with a smooth orange-tan filling — similar to pumpkin pie but slightly sweeter; often dusted with cinnamon.`),p(`Red Beans and Rice`,`Red beans and rice`,`Dark red kidney beans in a thick smoky sauce served over white rice — the red beans pool around a mound of fluffy white rice.`),p(`Jambalaya`,`Jambalaya`,`A one-pot Louisiana rice dish — rice cooked with shrimp, sausage, and chicken in a red-orange Cajun sauce. Very colourful and hearty.`),p(`Gumbo`,`Gumbo`,`A thick, dark Southern stew — a very dark roux-based broth with shrimp, okra, sausage, and rice. Deep mahogany colour with hearty chunks.`),p(`Po'boy`,`Po' boy sandwich`,`A New Orleans sandwich on a long French roll — stuffed with fried shrimp, oysters, or roast beef, with lettuce, tomato, and remoulade.`,[`Po Boy`,`Poboy`]),p(`Boudin`,`Boudin`,`A Cajun pork-and-rice sausage — encased in a natural casing that is squeezed out to eat; the filling is a grey-beige rice-and-pork mixture.`),p(`Crawfish`,`Crayfish`,`Small bright-orange freshwater crustaceans — resembling tiny lobsters, served piled in a large pot boiled with corn and potatoes. Vivid orange pile.`,[`Crayfish`,`Crawdad`]),p(`Pimento Cheese`,`Pimento cheese`,`A thick, creamy orange-pink cheese spread — shredded cheddar mixed with mayonnaise and red pimento peppers, visible as red flecks.`),p(`Okra`,`Okra`,`A green ridged pod vegetable — tapered and slightly fuzzy, about 3-4 inches long. When fried, coated in cornmeal and golden-brown.`),p(`Boiled Peanuts`,`Peanut`,`Wet, soft peanuts cooked in brine — limp, tan-to-dark shells with a very soft, salty nut inside. Served warm in a paper cup or bag.`),p(`Paula Deen`,`Paula Deen`,`A Southern celebrity chef — a plump, blonde white woman with a wide infectious smile; known for buttery, indulgent Southern cooking.`),p(`Guy Fieri`,`Guy Fieri`,`A celebrity chef with bleached spiky hair worn backwards, a goatee, and flame-decorated shirts — host of Diners, Drive-Ins and Dives.`),p(`Dolly Parton`,`Dolly Parton`,`A blonde, curvaceous country music icon with voluminous wigs, rhinestone-covered outfits, and a huge warm smile. Tennessee born.`),p(`Sweet Tea`,`Sweet tea`,`A tall glass of iced tea — very dark amber liquid over ice cubes, sometimes with a lemon wedge on the rim. The Southern staple drink.`),p(`Moonshine`,`Moonshine`,`A clear, high-proof distilled spirit — often in a mason jar or unmarked glass jug. Colourless like water but very strong.`),p(`Pulled Pork Sandwich`,`Pulled pork`,`Shredded tender pork piled high on a soft bun — smoky, slightly sauced meat in a big heap, often with coleslaw on top.`,[`Pulled Pork`]),p(`Mac and Cheese`,`Macaroni and cheese`,`Elbow macaroni in a thick orange cheese sauce — a golden, creamy bowl with a baked breadcrumb crust or straight from the pot.`,[`Macaroni and Cheese`]),p(`Buttermilk`,`Buttermilk`,`A thick, slightly yellow-white liquid — opaque and tangy; sold in cartons or pitchers. Used for biscuits, pancakes, and fried chicken marinades.`),p(`Lard`,`Lard`,`Pure rendered pig fat — a white, waxy, solid block or tub of opaque white fat, similar in appearance to shortening or Crisco.`),p(`Cast Iron Skillet`,`Cast-iron cookware`,`A heavy, thick black metal frying pan — perfectly flat, very dark (seasoned with oil), with a long handle and a helper handle. Often still warm.`,[`Cast Iron Pan`])]},{id:`hot-dogs`,name:`Hot Dogs`,subject:`Culinary`,difficulty:`Easy`,description:`Name the ingredient, brand, type of hot dog, or thing associated with hot dogs.`,items:[p(`Oscar Mayer`,`Oscar Mayer`,`The Oscar Mayer logo on bright yellow and red packaging — the iconic brand appears on hot dog packs and the famous Wienermobile.`),p(`Nathan's Famous`,`Nathan's Famous`,`Bright yellow Nathan's Famous signage on a hot dog stand or storefront — associated with Coney Island, NY, and the July 4th eating contest.`,[`Nathan's`]),p(`Hebrew National`,`Hebrew National`,`A kosher hot dog brand in distinctive navy-blue and red packaging — slightly longer and skinnier than some brands, with a snap casing.`),p(`Ball Park`,`Ball Park Franks`,`The Ball Park Franks logo and packaging — blue and silver with a ballpark stadium graphic. Known for their plump, juicy all-beef franks.`,[`Ball Park Franks`]),p(`Vienna Beef`,`Vienna Beef`,`The Vienna Beef brand — red packaging or storefront, associated with Chicago-style hot dogs. The official dog of Chicago.`),p(`Chicago-Style Hot Dog`,`Chicago-style hot dog`,`A beef hot dog in a poppy-seed bun with yellow mustard, neon-green relish, onion, tomato, a pickle spear, sport peppers, and celery salt. No ketchup.`,[`Chicago Dog`]),p(`New York-Style Hot Dog`,`New York-style hot dog`,`A steamed hot dog in a plain soft white bun with yellow mustard and/or sauerkraut — minimal, no-frills. Sold from a cart with a steam compartment.`,[`New York Dog`]),p(`Corn Dog`,`Corn dog`,`A hot dog on a wooden stick coated in a thick yellow cornmeal batter and deep-fried — golden-brown corn batter casing on a stick.`),p(`Chili Dog`,`Chili dog`,`A hot dog in a bun smothered in thick chili con carne — the dark reddish-brown chili sauce mounded over the frank, with optional cheese.`),p(`Coney Island Hot Dog`,`Coney Island hot dog`,`A Detroit-style coney dog — a beef hot dog in a steamed bun with chili sauce, yellow mustard, and raw onion. Often two in a row.`,[`Coney Dog`]),p(`Sauerkraut`,`Sauerkraut`,`Tangy fermented shredded cabbage — a pale, pale yellow-grey, limp, slightly wet pile of thin cabbage strands with a sour vinegar smell.`),p(`Relish`,`Relish (condiment)`,`Bright neon-green chopped sweet pickle relish — vivid fluorescent green, chunky, and glossy. The key Chicago dog condiment.`,[`Pickle Relish`]),p(`Mustard`,`Mustard (condiment)`,`A squeeze of bright yellow mustard — vivid canary yellow condiment in a squeeze bottle, lines of yellow across a hot dog bun.`),p(`Ketchup`,`Ketchup`,`A thick, red tomato-based sauce — bright red, poured from a bottle. Chicago-style hot dog aficionados consider this a crime on their dog.`),p(`Celery Salt`,`Celery salt`,`A pale tan powder — a fine seasoning salt with a faint celery aroma. The secret finishing touch on an authentic Chicago-style hot dog.`),p(`Sport Peppers`,`Sport pepper`,`Small, pale green pickled peppers — oval, about an inch long, in a jar of brine. Essential topping on a Chicago-style hot dog.`),p(`Tomato Slice`,`Tomato`,`A wedge-cut slice of ripe tomato — a triangular cross-section showing red flesh, seeds, and lighter core. Served fresh on a Chicago dog.`),p(`Dill Pickle`,`Dill pickle`,`A whole or sliced sour cucumber pickle — bright green, bumpy, with dill herbs. On a Chicago dog served as a long spear along the side.`,[`Pickle`]),p(`Hot Dog Bun`,`Hot dog bun`,`A soft, slightly sweet oblong white bread roll — split along the top (or side), designed to cradle a hot dog.`,[`Bun`]),p(`Nathan's Hot Dog Eating Contest`,`Nathan's Famous International Frankfurter Eating Contest`,`Held every July 4th at Coney Island — competitors eating stacks of hot dogs in buns as fast as possible, mustard-stained jerseys and crowds cheering.`,[`Hot Dog Eating Contest`]),p(`Joey Chestnut`,`Joey Chestnut`,`The legendary competitive eater — a large, athletic-looking man in a yellow champion belt, famously downing 70+ hot dogs in 10 minutes.`),p(`Snap`,`Sausage casing`,`The natural or synthetic casing of a hot dog — when bitten, it snaps, releasing juices. Visible as a thin, slightly translucent skin on the sausage.`,[`Casing`]),p(`Bratwurst`,`Bratwurst`,`A thick, pale pinkish-white German sausage — bigger than a hot dog, grilled until browned, often served in a bun with mustard and onions.`,[`Brat`]),p(`Kielbasa`,`Kielbasa`,`A Polish smoked sausage — dark reddish-brown casing, U-shaped or in a ring, with a smoky, garlicky smell. Sliced diagonally on a plate.`),p(`Andouille`,`Andouille`,`A coarsely smoked sausage from Louisiana — dark, almost black exterior from smoking, with a spicy and garlicky smell. Sliced in rounds.`),p(`Frankfurter`,`Frankfurter Würstchen`,`The classic slim hot dog sausage — a pink-red, smooth, glossy tube about 6 inches long. The American definition of a hot dog.`,[`Frank`,`Weiner`]),p(`Footlong`,`Footlong hot dog`,`An extra-long hot dog — a 12-inch frank in a correspondingly long bun, extending past both ends. Sold at ballparks and stadiums.`,[`Footlong Dog`]),p(`Ballpark`,`Baseball park`,`A baseball stadium — green diamond of turf, hot dog vendors walking the aisles, and the smell of grilled franks wafting through the stands.`),p(`Grilled Hot Dog`,`Grilling`,`Hot dogs on a grill — dark char lines across the frank where the grill bars seared them, slight splitting of the casing from the heat.`),p(`Pigs in a Blanket`,`Pigs in blankets`,`Tiny hot dogs or cocktail sausages wrapped in crescent roll pastry — golden-brown baked rolls with the sausage end peeking out.`,[`Pigs in Blankets`])]},{id:`protein`,name:`Protein`,subject:`Culinary`,difficulty:`Easy`,description:`Name the ingredient or food used to bulk up.`,items:[p(`Chicken Breast`,`Chicken as food`,`A boneless, skinless chicken breast — pale, off-white cooked meat, grilled with char lines or baked to a smooth pale surface.`,[`Chicken`]),p(`Tuna`,`Tuna`,`Canned tuna flaked in a bowl — pale pink-grey chunks of fish broken apart. Or a fresh ahi tuna steak: deep red and meaty.`,[`Canned Tuna`]),p(`Egg Whites`,`Egg white`,`Clear, translucent liquid from cracked eggs — very white and slightly jelly-like when raw; turns pure white and firm when cooked.`,[`Egg White`]),p(`Greek Yogurt`,`Strained yogurt`,`Thick, very dense white yogurt — much thicker than regular yogurt, almost like cream cheese in consistency. Served in a bowl or jar.`,[`Strained Yogurt`]),p(`Protein Shake`,`Protein shake`,`A creamy blended drink in a shaker bottle or glass — often chocolate or vanilla coloured, sometimes with a scoop of protein powder nearby.`,[`Protein Powder`]),p(`Whey Protein`,`Whey protein`,`A large tub or scoop of protein powder — the tub has bold branding; the powder is fine and slightly clumpy, in white, chocolate, or vanilla.`,[`Whey`]),p(`Tofu`,`Tofu`,`A white, smooth, cube of soy bean curd — very pale cream-white, firm or silken, cut in cubes and often marinated or stir-fried.`),p(`Tempeh`,`Tempeh`,`A firm, dense slab of fermented soy beans — light tan or brown, with visible whole soy beans pressed together. Sliced in rectangles.`),p(`Edamame`,`Edamame`,`Bright green fuzzy pods of young soy beans — lightly salted and steamed, served in the pod in a bowl. Vivid green and fresh.`),p(`Lentils`,`Lentil`,`Small, flat, round legumes — dried are brown, green, or red. Cooked into a thick, mushy, earthy-brown dal or soup.`),p(`Chickpeas`,`Chickpea`,`Round, beige-tan legumes — smooth, slightly wrinkled spheres the size of a small marble. In a ca
