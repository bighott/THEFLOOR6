m words.`),p(`Clue`,`Cluedo`,`A murder mystery board game — a mansion floor plan with rooms like the Library and Kitchen, coloured game tokens (Colonel Mustard yellow), and weapon cards.`,[`Cluedo`]),p(`Risk`,`Risk (game)`,`A world map board divided into territories — armies represented by tiny infantry, cavalry, and cannon pieces in six player colours. Dice battles on continents.`),p(`Battleship`,`Battleship (game)`,`Two players face each other across a plastic divider with a grid — pegs (white for miss, red for hit) placed on a 10×10 ocean grid to find hidden ships.`),p(`Sorry!`,`Sorry! (game)`,`A board game with coloured pawns moving around a track — 'Sorry!' cards allow bumping opponents back to Start. Pastel blue, green, red, yellow pawns.`,[`Sorry`]),p(`Trivial Pursuit`,`Trivial Pursuit`,`A pie-shaped game board — players move tokens collecting coloured wedge pie slices for six categories (geography, arts, science). Small coloured plastic pie pieces.`),p(`Connect Four`,`Connect Four`,`A vertical plastic grid — yellow and red discs dropped into columns to connect four in a row. Yellow plastic frame with a row of coloured counters.`),p(`Jenga`,`Jenga`,`A tall tower of wooden blocks stacked in rows of three, with individual blocks being carefully removed and stacked on top without toppling the wobbly tower.`),p(`Yahtzee`,`Yahtzee`,`A dice game — five white dice in a red or black shaker cup, a score pad with columns for Full House, Yahtzee, and other combinations.`),p(`Cranium`,`Cranium (board game)`,`A brightly coloured board game with a purple box — players sculpt with clay, hum songs, draw, and answer trivia. Very diverse activity-based gameplay.`),p(`Taboo`,`Taboo (game)`,`A card game where one player describes a word without using forbidden hint words — a red buzzer is slammed when forbidden words are spoken.`),p(`Twister`,`Twister (game)`,`A large coloured dot mat on the floor — players stretch across red, blue, yellow, green circles following a spinner's instructions like 'right hand on blue.'`),p(`Boggle`,`Boggle (word game)`,`A plastic dome shaken over a 4×4 grid of letter cubes — players find words from adjacent letters before a sand timer runs out.`),p(`Candy Land`,`Candy Land`,`A colourful children's board game — a winding path through sweet landscapes like Gumdrop Mountains and Candy Castle, with rainbow-coloured spaces.`),p(`Chutes and Ladders`,`Chutes and Ladders`,`A numbered grid board — landing on a ladder sends your token up, landing on a chute (slide) sends it down. Simple colourful children's game.`,[`Snakes and Ladders`]),p(`Operation`,`Operation (game)`,`A toy operating table with a patient figure — tweezers used to remove plastic 'ailments' from cavities without touching the metal edges and buzzing the alarm.`),p(`Guess Who?`,`Guess Who?`,`Two plastic frames with flap-up portraits of cartoon faces — players flip down faces asking yes/no questions to identify the mystery character.`,[`Guess Who`]),p(`Hungry Hungry Hippos`,`Hungry Hungry Hippos`,`Plastic hippo heads on levers around a game board — players slam levers to gobble up white marble balls as fast as possible. Very noisy and chaotic.`),p(`Mouse Trap`,`Mouse Trap (game)`,`An elaborate chain-reaction trap — when triggered, a ball rolls down a ramp, kicks a boot, drops a ball into a tub, activating a cage that falls over a mouse.`,[`Mousetrap`]),p(`Trouble`,`Trouble (board game)`,`A circular board with a pop-o-matic bubble in the centre — players press the dome to roll the built-in die, moving coloured pegs around the track.`),p(`Life`,`The Game of Life`,`A game board with a winding road through life stages — a small plastic car with pink and blue peg people, passing college, marriage, and retirement.`,[`Game of Life`]),p(`Perfection`,`Perfection (game)`,`A yellow tray with shaped holes — players race to fit 25 different plastic shapes before the timer causes the tray to pop up and scatter all the pieces.`),p(`Bop It`,`Bop It`,`A handheld electronic toy — bright plastic with handles, buttons, and a twistable section. A voice commands 'Bop it! Twist it! Pull it!' in rapid sequence.`),p(`Simon`,`Simon (game)`,`A circular electronic game with four large coloured buttons (red, blue, green, yellow) — it flashes a pattern and you repeat it, getting longer each round.`),p(`Mr. Potato Head`,`Mr. Potato Head`,`A large plastic potato body — mix-and-match plastic face parts (eyes, nose, ears, lips, hat) pushed into holes on the potato's face. Classic toy.`),p(`Nerf`,`Nerf (brand)`,`Bright orange-and-yellow foam dart guns — various blasters from small pistols to large automatic-style guns that shoot soft foam darts or balls.`),p(`Transformers`,`Transformers`,`Robotic action figures that fold and rearrange into vehicles — Optimus Prime transforms between a red semi-truck and a robot. Bright primary colours.`),p(`My Little Pony`,`My Little Pony`,`Small plastic pony figurines with very colourful manes and tails — pastel-coloured bodies with symbols on their hindquarters (cutie marks). Sparkly and shiny.`),p(`G.I. Joe`,`G.I. Joe`,`Military action figures in olive drab or camouflage uniforms — originally 12-inch, later 3.75-inch figures with weapons and accessories. Eagle crest logo.`)]},{id:`battle-games`,name:`Battle Games`,subject:`Games`,difficulty:`Easy`,description:`Name the games and toys associated with fake battles and fun competition.`,items:[p(`Nerf Gun`,`Nerf Blaster`,`Bright orange-and-yellow foam dart blaster — various shapes from pistol to gatling gun styles. Darts are soft orange foam cylinders.`,[`Nerf Blaster`]),p(`Water Gun`,`Super Soaker`,`A large colourful pump-action or pressurized water gun — the Super Soaker has a translucent water reservoir and a bright pump handle.`,[`Super Soaker`,`Water Pistol`]),p(`Paintball`,`Paintball`,`Players in camouflage gear and goggle-style masks carrying paintball markers — colourful paint splats on vests and barriers.`),p(`Laser Tag`,`Laser tag`,`Players in dark arenas with glowing vests and handheld laser guns — neon lights, fog machines, and targets on the chest that light up when shot.`),p(`Dodgeball`,`Dodgeball`,`Players in two lines throwing red rubber balls at each other in a gym — the classic foam/rubber ball and the excited or pained expressions of players hit.`),p(`Battleship`,`Battleship (game)`,`Two players face each other with plastic dividers — calling coordinates like 'B4' and placing red or white pegs on a grid to find hidden ship silhouettes.`),p(`Risk`,`Risk (game)`,`A world map board game — coloured infantry, cavalry, and cannon pieces on territory spaces; dice battles determine who controls continents.`),p(`Stratego`,`Stratego`,`A two-player strategy board game — an 8×10 grid with red and blue plastic pieces, each with a hidden rank. Miner, Scout, Marshal, and the Bomb pieces.`),p(`Lightsaber`,`Lightsaber`,`The glowing sword from Star Wars — a cylindrical metal handle with a long luminous blade (blue for heroes, red for villains, green for Jedi). Humming glow effect.`),p(`Foam Sword`,`Foam weapon`,`A brightly coloured foam-covered sword or pool noodle sword — safe enough for backyard battles, soft and flexible when it hits.`,[`Pool Noodle Sword`]),p(`Bow and Arrow Toy`,`Archery`,`A plastic or wooden toy bow with a string, paired with rubber-tipped arrows — a child's version of archery equipment for backyard play.`,[`Toy Bow`]),p(`Capture the Flag`,`Capture the flag`,`Two teams each defend a flag in their territory — players tag opponents to freeze them, trying to grab the other team's flag and return it safely.`),p(`Tug of War`,`Tug of war`,`Two teams pulling opposite ends of a thick rope over a central mud pit or line — red tape marks the centre and the losing team gets dragged over.`),p(`Sock Em Boppers`,`Sock 'em Boppers`,`Giant inflatable boxing glove bags worn on the hands — brightly coloured padded mitts for mock-punching. 'More fun than a pillow fight.'`,[`Boppers`]),p(`Rock 'Em Sock 'Em Robots`,`Rock 'Em ody surface is covered densely in tattoo ink — face, neck, hands, and all visible skin filled with patterns and designs.`),p(`Largest Pizza`,`Pizza`,`An enormous round pizza covering an entire room floor — a massive flat bread crust covered in sauce and cheese, requiring many people to prepare it.`),p(`Fastest 100m`,`Usain Bolt`,`Usain Bolt mid-race or celebrating — a very tall, lean Jamaican man with his iconic 'lightning bolt' pose; finishing tape at the 100m finish line.`,[`Usain Bolt`,`100 Meter Dash`]),p(`Largest Pumpkin`,`Pumpkin`,`A gigantic orange pumpkin on a scale or flatbed truck — far larger than any normal pumpkin, often requiring a forklift to move.`),p(`Most Piercings`,`Body piercing`,`A person with hundreds of visible metal rings, studs, and barbells across face, ears, nose, and body — the sheer quantity of piercings is the key feature.`,[`Body Piercing`]),p(`Longest Beard`,`Beard`,`An extraordinarily long beard trailing down past the waist — often plaited, shaped, or simply hanging in a single very long curtain of hair from the face.`),p(`Most Sticky Notes on Face`,`Post-it note`,`A face covered entirely in yellow (and multicoloured) Post-it notes stuck all over the forehead, cheeks, chin, and nose.`,[`Post-it Notes`]),p(`Rubik's Cube Speed Solve`,`Rubik's Cube`,`A Rubik's Cube held by a competitor at a tabletop timer — hands blurring at incredible speed, a solved or near-solved cube visible.`),p(`Tallest Stack of Pancakes`,`Pancake`,`A tower of pancakes stacked absurdly high on a plate — dozens of flat golden pancakes balanced one on top of another, wobbling under their own weight.`),p(`Most Dominoes Toppled`,`Dominoes`,`A vast floor covered in elaborate patterns of thousands of standing dominoes — the chain reaction of falling tiles branching in complex colourful paths.`),p(`Largest Human Mattress Domino`,`Mattress`,`Rows of people holding mattresses upright in a large space — then falling one by one like dominoes, each person tipping into the next.`),p(`Most People Hula Hooping`,`Hula hoop`,`A large open space (stadium or park) filled with hundreds of people simultaneously spinning hula hoops around their waists.`,[`Hula Hoop`]),p(`Largest Rubber Band Ball`,`Rubber band`,`An enormous sphere made entirely of rubber bands — the size of a boulder, mostly tan or multicoloured, covered in stretched rubber bands.`,[`Rubber Band Ball`]),p(`Fastest Furniture`,`Lawnmower`,`A motorized reclining armchair or modified lawnmower on a racetrack — a person sitting in furniture speeding down a road.`,[`Lawnmower Racing`]),p(`Most Socks Worn on One Foot`,`Sock`,`A person's leg with an absurd amount of socks layered and pulled up — the foot and leg look like a bulging, colourful tube of stacked fabric.`),p(`Fastest Marathon in a Superhero Costume`,`Marathon`,`A runner in a full superhero costume (cape, mask, tights) crossing a marathon finish line or running among other race participants.`),p(`Largest Gathering of People Dressed as Vampires`,`Vampire`,`A large crowd of people all dressed in vampire costumes — black capes, white face paint, fangs, and red fake blood.`),p(`Most Ice Cream Scoops Balanced on Cone`,`Ice cream cone`,`An impossibly tall tower of ice cream scoops balanced on a single cone — the stack rises far above a person's head in a wobbling multi-flavour tower.`),p(`Longest Lego Walk`,`LEGO`,`A long path of LEGO pieces on the floor — a person walking barefoot across the bricks, or the sheer length of the brick path stretching into the distance.`),p(`Most Yo-Yo Tricks in One Minute`,`Yo-yo`,`A person performing rapid yo-yo tricks — the string a blur, the yo-yo a spinning disc executing loops, walk-the-dog, and string tricks at high speed.`,[`Yo Yo`]),p(`Longest Skateboard`,`Skateboard`,`An extraordinarily long skateboard stretching many metres — requires multiple riders standing along its length, or visible in comparison to a car.`),p(`Most Toilet Seats Broken with Head`,`Toilet seat`,`A person smashing wooden toilet seat lids over their own head — a stack of seats beside them, the wooden ring splitting on impact.`),p(`Fastest Time to Eat a Raw Onion`,`Onion`,`A person chomping through a whole raw onion as fast as possible — eyes watering, face scrunched against the intense smell and heat.`),p(`Largest Spoon`,`Spoon`,`A comically enormous spoon — either a massive metallic sculpture or a purpose-built giant utensil dwarfing the person standing beside it.`),p(`Most Balloons Burst by Cats`,`Balloon`,`Cats surrounded by brightly coloured latex balloons — claws extended, popping one after another in rapid succession.`),p(`Most T-Shirts Worn at Once`,`T-shirt`,`A person whose torso is layered in dozens or hundreds of T-shirts — they look like a round, fabric-stuffed ball, barely able to lift their arms.`)]},{id:`racing-events`,name:`Racing Events`,subject:`Games`,difficulty:`Easy`,description:`Name the type of race you see.`,items:[p(`Formula 1`,`Formula One`,`Single-seat open-wheel cars with wide aerodynamic wings — sleek, low, and covered in sponsor logos. Teams wear matching uniforms; pit stops in seconds.`,[`F1`]),p(`NASCAR`,`NASCAR`,`Stock cars in oval track racing — nearly stock-looking colourful cars (with sponsor liveries) running three abreast on a banked oval track.`),p(`Indy 500`,`Indianapolis 500`,`Open-wheel IndyCar at the Brickyard — slightly different from F1 with oval-track configuration, the yard-of-bricks starting line, and wing-style cars.`,[`Indianapolis 500`]),p(`Drag Racing`,`Drag racing`,`Two cars side by side on a straight quarter-mile strip — massive back tyres, engine supercharger sticking out the hood, Christmas tree light starting system.`),p(`Rally Racing`,`Rally racing`,`A car sliding sideways on a dirt, gravel, or snow road stage — a co-driver in the passenger seat calling instructions from a pace note book.`,[`Rally`]),p(`Le Mans`,`24 Hours of Le Mans`,`Sports car prototypes racing through the night on the Circuit de la Sarthe — headlights blazing in the dark, long straight past the famous Ford Chicanes.`,[`24 Hours Le Mans`]),p(`Daytona 500`,`Daytona 500`,`NASCAR superspeedway with steeply banked turns — colourful stock cars packed in a tight draft around the high-banked Daytona International Speedway.`),p(`Tour de France`,`Tour de France`,`A peloton of cyclists in colourful jerseys racing through French countryside — the yellow jersey leader visible, mountains or cobblestones underfoot.`),p(`Kentucky Derby`,`Kentucky Derby`,`Jockeys in bright silk colours on thoroughbreds charging around Churchill Downs — the Twin Spires grandstand and the crowd in extravagant hats.`),p(`Iditarod`,`Iditarod Trail Sled Dog Race`,`A dog musher in thick winter gear on a sled being pulled by a team of huskies across the Alaskan tundra and snow-covered wilderness.`,[`Dog Sled Race`]),p(`Soap Box Derby`,`Soap box derby`,`Children in small homemade gravity-powered wooden vehicles rolling down a hill — sleek wooden coaster cars with helmeted young drivers.`,[`Soapbox Derby`]),p(`Go-Kart Racing`,`Kart racing`,`Small low-riding karts on an asphalt track — drivers in helmets and racing suits; the karts have no suspension and hug the ground tightly.`,[`Go Kart`]),p(`Monster Truck Racing`,`Monster truck`,`Enormous trucks on massive tyres rolling over and crushing car rows — the trucks have huge wheels taller than a person, often with wild paint jobs.`,[`Monster Truck`]),p(`Boat Racing`,`Motorboat racing`,`High-speed powerboats racing on water — spray flying, hulls lifted partially out of the water, colourful sponsor liveries on the hull.`,[`Powerboat Racing`]),p(`Sailboat Racing`,`Sailboat racing`,`A fleet of sailboats with colourful spinnaker sails billowing — boats heeled over in the wind, crews hiking out over the side.`,[`Sailing Race`]),p(`Luge`,`Luge`,`An athlete in a tight aerodynamic bodysuit lying flat on their back on a tiny sled — feet forward, chin tucked, shooting feet-first down an icy tube at top speed.`),p(`Bobsled`,`Bobsleigh`,`A four-person crew in a streamlined metal bullet bobsled — helmeted heads visible, shooting down an icy curved track at high speed.`,[`Bobsleigh`]),p(`Skeleton`,`Skeleton (sport)`,`An athlete face-down on a tiny flat sled — chin nearly touching the ice, body flat with arms at sides, rocketing head-first down a luge track.`),p(`Sprint Race`,`Sprint (running)`,`Runners in athletics gear exploding out of starting blocks — a straight 100m or 200m flat track, arms pumping and heads down in maximum effort.`,[`Sprinting`]),p(`Marathon`,`Marathon`,`Thousands of runners on a city road race — course markings, charity costumes, mile markers, and the iconic finish line banner.`),p(`Relay Race`,`Relay race`,`A runner extending a baton toward the next team member — the handoff moment in a relay, both runners at full sprint in track uniforms.`,[`Relay`]),p(`Triathlon`,`Triathlon`,`Competitors in wetsuits and swim caps emerging from open water — transition to bikes, then running. Often seen at a crowded lake start with buoys.`),p(`Horse Racing`,`Horse racing`,`Jockeys in silk colours crouched low on thoroughbreds — thundering down a track in a tight pack, hooves kicking up turf at a flat race.`),p(`Greyhound Racing`,`Greyhound racing`,`Lean, streamlined greyhounds in numbered racing jackets chasing a mechanical lure around an oval track.`,[`Dog Racing`]),p(`Camel Racing`,`Camel racing`,`Camels with robotic jockeys (small backpack robots) or small human jockeys in a desert race — galloping in a line across sandy desert terrain.`),p(`Pigeon Racing`,`Pigeon racing`,`Racing pigeons being released from wicker baskets in a group — the birds circling and heading home, with an electronic timer ring on each leg.`),p(`Canoe Sprint`,`Sprint canoe`,`Kayak or canoe paddlers in a straight flat-water lane — low-seated boats with narrow hulls, paddles dipping alternately at high speed.`,[`Canoe Race`]),p(`Rowing`,`Rowing (sport)`,`A crew of eight rowers in a long, narrow shell — synchronized oar strokes on flat water, coxswain at the stern calling the pace.`,[`Crew Racing`]),p(`Snowmobile Racing`,`Snowmobile racing`,`Riders on snowmobiles racing through snowy terrain — the sleds have wide skis at front and a track at the rear, spraying snow at speed.`,[`Snowmobile`]),p(`ATV Racing`,`All-terrain vehicle`,`Quad bike racers on dirt or desert terrain — four-wheeled vehicles with knobby tyres, riders in helmets and body armour.`,[`ATV`])]},{id:`hawaii`,name:`Hawaii`,subject:`Geography`,difficulty:`Medium`,description:`Name these people, places, things and words associated with Hawaii.`,items:[p(`Hula`,`Hula`,`Hawaiian dance — women in grass skirts and flower leis swaying their hips and making fluid arm movements symbolizing nature. Flowers in hair; often outdoors at sunset.`),p(`Lei`,`Lei (garland)`,`A necklace of fresh or silk flowers (often plumeria or orchids) strung together in a chain — yellow, white, pink, or multicoloured; given as a greeting in Hawaii.`,[`Flower Lei`]),p(`Luau`,`Luau`,`An outdoor Hawaiian feast — long tables of food including roasted pig from an imu (underground oven), poi, and tropical fruits under tiki torches on the beach.`),p(`Ukulele`,`Ukulele`,`A small four-stringed guitar-like instrument — about the size of a toy guitar, with a round body, nylon strings, and a high, sweet plucking tone.`),p(`Poi`,`Poi (food)`,`A thick, purple-grey paste made from taro root — served in a small bowl, eaten by dipping fingers. Unusual grey-lavender colour distinguishes it.`),p(`Spam Musubi`,`Spam musubi`,`A slice of grilled Spam on a block of white rice, wrapped in a band of nori (seaweed) — looks like a large, meaty sushi onigiri.`),p(`Loco Moco`,`Loco moco`,`A Hawaiian comfort dish — white rice topped with a hamburger patty, fried egg, and brown gravy, all in a bowl or on a plate.`),p(`Plate Lunch`,`Plate lunch`,`A Hawaiian-style lunch plate — two scoops of white rice, a scoop of macaroni salad, and a main protein (teriyaki chicken, katsu) on a styrofoam plate.`),p(`Shave Ice`,`Shave ice`,`A Hawaiian snow cone — ultra-fine shaved ice (not crushed) packed into a cone or bowl and soaked with colourful flavoured syrups, creating vivid gradient colours.`,[`Shaved Ice`]),p(`Poke Bowl`,`Poke (Hawaiian dish)`,`Raw cubed fish (usually ahi tuna) — ruby red or pink cubes of tuna with soy sauce, sesame oil, and toppings in a bowl with rice or greens.`,[`Poke`]),p(`Mauna Kea`,`Mauna Kea`,`Hawaii's highest peak — a snow-capped dormant volcanic mountain with white observatories at the summit, rising above the clouds.`),p(`Mauna Loa`,`Mauna Loa`,`The world's largest active volcano — a very broad, gently sloping shield volcano with a flat top and occasional lava flows down its slopes.`),p(`Kilauea`,`Kīlauea`,`An actively erupting volcano — glowing orange-red lava rivers flowing into the dark sea, or lava lakes glowing in a caldera at night.`,[`Kilauea Volcano`]),p(`Waikiki Beach`,`Waikiki`,`A famous urban beach with white sand, gentle waves, tall Diamond Head crater in the background, and Honolulu hotel towers rising behind the palm trees.`,[`Waikiki`]),p(`Diamond Head`,`Diamond Head, Hawaii`,`A distinctive tuff cone crater on Oahu — a broad, sloping, flat-topped green volcanic ridge easily recognizable from Waikiki Beach.`,[`Diamond Head Crater`]),p(`Pearl Harbor`,`Attack on Pearl Harbor`,`The USS Arizona Memorial — a white floating structure built over the sunken battleship, with oil still seeping up from the wreck below.`,[`Pearl Harbor`]),p(`Aloha`,`Aloha`,`The Hawaiian greeting — shown as a word on a sign, a lei greeting at the airport, or someone making the shaka hand gesture (thumb and pinky extended).`),p(`Mahalo`,`Mahalo`,`Hawaiian for 'thank you' — often seen on signs, souvenir items, or recycling bins in Hawaii that say 'Mahalo for keeping Hawaii beautiful.'`),p(`Ohana`,`ʻOhana`,`Means 'family' in Hawaiian — most popularly known from the Lilo & Stitch phrase 'Ohana means family, family means nobody gets left behind.'`,[`Family`]),p(`Hawaiian Shirt`,`Aloha shirt`,`A brightly coloured, loose-fitting short-sleeved shirt covered in large tropical flower, hibiscus, and leaf patterns — worn open over a T-shirt.`,[`Aloha Shirt`]),p(`Surfing`,`Surfing`,`A surfer standing on a longboard riding a large ocean wave — board slides down the face of the wave, arms outstretched for balance.`),p(`Outrigger Canoe`,`Outrigger canoe`,`A long, narrow wooden canoe with a float (outrigger) extending from one side on booms — used for traditional Hawaiian paddling races.`),p(`Lava`,`Lava`,`Glowing orange-red molten rock flowing slowly, or black hardened lava rock with a ropy (pahoehoe) or rough jagged (a'a) surface.`),p(`Pineapple`,`Pineapple`,`A spiky tropical fruit — green crown of stiff leaves on top, golden-yellow scaly oval body. Very distinctive shape; Hawaii is closely associated with pineapple farming.`),p(`Macadamia Nut`,`Macadamia`,`A round, cream-coloured nut in a very hard shell — in Hawaii often sold in tins, chocolate-covered, or as a whole-roasted snack.`,[`Macadamia`]),p(`Nene`,`Nene (bird)`,`Hawaii's state bird — a goose-like bird with a black face and cap, cream-buff neck with fine black streaks, and greyish-brown body. Only partially webbed feet.`,[`Hawaiian Goose`]),p(`Monk Seal`,`Hawaiian monk seal`,`A plump, silver-grey seal with a short blunt snout and large dark eyes — often resting on Hawaiian beaches, roped off with warning signs.`,[`Hawaiian Monk Seal`]),p(`Humpback Whale`,`Humpback whale`,`A massive whale with very long white pectoral fins, breaching dramatically out of the ocean — spectacular aerial leaps, common in Hawaiian winter waters.`),p(`Maui`,`Maui (island)`,`Hawaii's second-largest island — Road to Hana's lush greenery, Haleakala volcanic crater above the clouds, and Kaanapali beach with black lava rock.`,[`Maui Island`]),p(`Barack Obama`,`Barack Obama`,`44th U.S. president — a tall, lean Black man with a warm smile, short dark hair, and an elegant, coo ular glass tower.`),p(`Seoul`,`Seoul`,`Gyeongbokgung Palace — traditional low-slung Korean palace buildings with tiled roofs in front of modern skyscrapers; or N Seoul Tower on Namsan.`),p(`Beijing`,`Beijing`,`Tiananmen Square and the Forbidden City — vast red-walled imperial palace complex with yellow glazed-tile roofs; or the Bird's Nest stadium.`),p(`Shanghai`,`Shanghai`,`The Bund — colonial European-era buildings on one bank of the Huangpu River facing the futuristic Pudong skyline with the Pearl TV Tower.`),p(`Mumbai`,`Mumbai`,`The Gateway of India — a triumphal arch by the waterfront built for King George V's visit, overlooking the Arabian Sea.`,[`Bombay`]),p(`Nairobi`,`Nairobi`,`Nairobi National Park — the unusual sight of lions, zebras, and giraffes in front of a modern African city skyline. Very distinctive wildlife-meets-city image.`),p(`Lagos`,`Lagos`,`Eko Atlantic — a modern business district on reclaimed land, with new glass towers rising beside the Atlantic Ocean in Africa's largest city.`),p(`São Paulo`,`São Paulo`,`The world's most dense skyline — thousands of residential towers packed together as far as the eye can see; the vast urban grid from the air.`,[`Sao Paulo`]),p(`Los Angeles`,`Los Angeles`,`The Hollywood Sign on the hillside, the Griffith Observatory, the Santa Monica Pier, or the downtown glass skyline with palm trees.`,[`LA`])]},{id:`vacation-destinations`,name:`Vacation Destinations`,subject:`Geography`,difficulty:`Medium`,description:`You will see a vacation destination labeled with its country or state. Name the destination.`,items:[p(`Grand Canyon`,`Grand Canyon`,`A mile-deep, layered red and orange canyon — horizontal stripes of rust, tan, and purple rock visible from the rim. The Colorado River visible at the bottom.`),p(`Yellowstone`,`Yellowstone National Park`,`Famous for Old Faithful geyser shooting steam high into the air, neon-ringed hot springs (Grand Prismatic), and bison herds on open plains.`,[`Yellowstone`]),p(`Yosemite`,` he clearest, flattest, most vividly turquoise water in the world — 'the Exumas' with shallow bright aqua water between low sandy islands.`,[`Bahamas`]),p(`Hawaii`,`Hawaii`,`Volcanic black rock lava flows beside turquoise Pacific water; hula dancers; Na Pali Coast cliffs; Diamond Head crater — tropical flowers and rainbows.`),p(`Tahiti`,`Tahiti`,`French Polynesia — overwater bungalows on stilts in an impossibly clear lagoon, surrounding a volcanic island with jagged green-black peaks.`),p(`Fiji`,`Fiji`,`Blue Pacific water, white sand beaches, and traditional thatched bure huts — very lush tropical green island vegetation against warm blue water.`),p(`Cape Town`,`Cape Town`,`Table Mountain — a perfectly flat-topped sandstone mountain looming over the city and harbour. Combined with colorful Bo-Kaap houses on the slopes.`),p(`Iceland`,`Iceland`,`Northern lights (aurora borealis) — green and purple curtains of light over snow-covered volcanic landscapes; or blue-white glaciers and geysers.`),p(`Alaska`,`Alaska`,`Glacier Bay — massive blue-white tidewater glaciers calving into dark water; or Denali (North America's tallest peak) towering over tundra.`)]},{id:`area-codes`,name:`Area Codes`,subject:`Geography`,difficulty:`Hard`,description:`You will see an area code on a map. Name the largest city the area code belongs to.`,items:[f(`New York City`,`New York City`,`212 — Largest City?`,[`New York`,`NYC`]),f(`Los Angeles`,`Los Angeles`,`213 — Largest City?`,[`LA`]),f(`Chicago`,`Chicago`,`312 — Largest City?`),f(`Houston`,`Houston`,`713 — Largest City?`),f(`Philadelphia`,`Philadelphia`,`215 — Largest City?`,[`Philly`]),f(`Phoenix`,`Phoenix, Arizona`,`602 — Largest City?`),f(`San Antonio`,`San Antonio`,`210 — Largest City?`),f(`Dallas`,`Dallas`,`214 — Largest City?`),f(`San Diego`,`San Diego`,`619 — Largest City?`),f(`San Jose`,`San Jose, California`,`408 — Largest City?`),f(`Detroit`,`Detroit`,`313 — Largest City?`),f(`Denver`,`Denver`,`303 — Largest City?`),f(`Las Vegas`,`L  name, venue, date, and barcode — often with colourful event artwork and seat information.`,[`Concert`]),p(`Movie Ticket`,`Movie ticket`,`A small thermal paper strip from a cinema — movie title, showtime, seat number, and price printed; often torn in half by the usher.`,[`Movie`]),p(`Lottery Ticket`,`Lottery ticket`,`A small rectangular scratch card or paper ticket with numbers — scratch panels on a silver coating, or a printed grid of lotto numbers.`,[`Lotto`]),p(`Plane Ticket`,`Airline ticket`,`A boarding pass — airline name, flight number, gate, seat, and passenger name with a large barcode or QR code. Often thermal paper or on a phone screen.`,[`Boarding Pass`,`Airplane Ticket`]),p(`Train Ticket`,`Rail ticket`,`A small cardboard or paper ticket with departure, destination, class, and date — often magnetic strip on the back for barrier gates.`,[`Train Pass`]),p(`Bus Ticket`,`Bus ticket`,`A narrow paper bus ticket with route, fare, and a tear line — or a transit card/pass with a tap-to-pay chip.`),p(`Sports Ticket`,`Ticket`,`An event ticket with team logos, stadium seating chart section, row, and seat number — often colourful with team colours.`,[`Game Ticket`]),p(`Parking Ticket`,`Parking ticket`,`An orange or yellow fine notice placed under a windshield wiper — a notice of violation with the time, date, violation code, and fine amount.`),p(`Speeding Ticket`,`Traffic ticket`,`An official traffic citation form — a pink or white carbonless paper form filled in by a police officer, with fine amount and court date.`,[`Traffic Ticket`]),p(`Broadway Ticket`,`Theatre ticket`,`A Broadway show ticket — show title, theatre name, seat section, and performance date. Often a keepsake with full-colour artwork.`,[`Theatre Ticket`]),p(`Raffle Ticket`,`Raffle ticket`,`Small numbered paper strips sold in rolls — each matching a counterfoil that goes into a drum. Simple printing with a number on each half.`),p(`Carnival Ticket`,`Carnival`,`Thin paper strips with a printed value — often sold in rolls of red, blue, or yellow tickets used to pay for rides and games at a fair.`,[`Fair Ticket`]),p(`Amusement Park Ticket`,`Amusement park`,`A colourful wristband or ticket book for a theme park — park logo, date of validity, often with Disney or Six Flags branding.`,[`Theme Park Ticket`]),p(`Museum Ticket`,`Museum`,`A small admission ticket or timed-entry pass — museum logo, date, and price. Sometimes sticker badges or peel-back coloured dots.`),p(`Admission Ticket`,`Admission (commerce)`,`A generic entry ticket — tear here perforation in the middle, numbered halves, one for the guest and one for the box office.`,[`Admission`]),p(`Stub`,`Ticket stub`,`The torn portion of a ticket left after entry — a small rectangle with partial printing, often kept as a souvenir after the event.`,[`Ticket Stub`]),p(`E-Ticket`,`Paperless ticket`,`A smartphone screen showing a QR code or barcode ticket — the phone's screen is held up to be scanned at entry.`,[`Electronic Ticket`]),p(`Season Pass`,`Season ticket`,`A card or booklet granting unlimited admission for a season — team or venue logo, holder's name, and a photo ID strip.`,[`Season Ticket`]),p(`Wristband`,`Wristband`,`A paper or plastic snap-on wristband in a single colour — applied at entry to concerts, festivals, and events. Often fluorescent colours.`),p(`VIP Pass`,`VIP pass`,`A laminated badge on a lanyard marked VIP — often with gold text, a colourful logo, and a clip or hole punch for the lanyard.`,[`VIP Ticket`]),p(`All-Access Pass`,`All-access pass`,`A laminated backstage pass on a lanyard — often in black with 'ALL ACCESS' in bold; worn by crew and celebrities at concerts.`,[`Backstage Pass`]),p(`Day Pass`,`Day pass`,`A single-day wristband or stamp — applied at the door of a water park, festival, or ski resort for that day's entry.`),p(`Gift Card`,`Gift card`,`A credit-card-sized plastic card with a brand logo and a scratch-off PIN on the back — sold in racks at grocery stores and pharmacies.`,[`Gift Certificate`]),p(`Coupon`,`Coupon`,`A small rectangular paper or digital savings voucher — usually showing a product image, percentage off, and a barcode at the bottom.`),p(`Voucher`,`Voucher`,`An official printed certificate or digital code — entitles the holder to a service or discount, often with fine print and an expiry date.`),p(`Golden Ticket`,`Charlie and the Chocolate Factory`,`The iconic shiny golden foil ticket from Charlie and the Chocolate Factory — printed gold with Wonka's signature, found inside a chocolate bar.`,[`Willy Wonka Ticket`]),p(`Hall Pass`,`Hall pass`,`A laminated card, wooden paddle, or clipboard sent with a student leaving the classroom — teacher's name and class written on it.`),p(`Boarding Pass`,`Boarding pass`,`An airline boarding pass — passenger name, flight code, gate, boarding time, and seat number with a barcode; often printed on thermal paper or shown on a phone.`),p(`Pawn Ticket`,`Pawn shop`,`A small paper receipt from a pawnbroker — item description, loan amount, interest rate, and redemption date. Often yellowed or stamped.`,[`Pawn`]),p(`Rain Check`,`Rain check`,`A ticket or note given when an event is rained out — entitles the holder to return another day; simple printed card with a future date.`)]},{id:`girl-scouts`,name:`Girl Scouts`,subject:`Lifestyle`,difficulty:`Easy`,description:`Identify these cookies, badges, items, and levels associated with the Girl Scouts.`,items:[p(`Thin Mints`,`Thin Mints`,`Dark chocolate-coated round cookies with a cooling mint flavour — stacked in a plastic sleeve inside a green Girl Scout box.`),p(`Samoas`,`Samoas (cookie)`,`Caramel-striped coconut cookies with chocolate on the bottom — ring-shaped with a toasted coconut and caramel top, chocolate-drizzled.`,[`Caramel deLites`,`Caramel Delites`]),p(`Tagalongs`,`Tagalongs`,`Peanut butter-filled round cookies coated in chocolate — short stacked discs with a peanut butter layer inside a chocolate shell.`,[`Peanut Butter Patties`]),p(`Do-si-dos`,`Do-si-dos`,`Oatmeal sandwich cookies with peanut butter filling — two rough-textured oatmeal cookies with a peanut butter cream between them.`,[`Peanut Butter Sandwich`]),p(`Trefoils`,`Trefoils (cookie)`,`Classic shortbread cookies shaped like the Girl Scout trefoil clover logo — simple, butter-coloured, with a delicate crumb texture.`,[`Shortbread`]),p(`Lemon-Ups`,`Lemon-Ups`,`Crispy lemon-flavoured rounds with an inspirational word stamped into each cookie — pale yellow, with a clean citrus flavour.`),p(`Girl Scout Daisy`,`Daisy (Girl Scouts)`,`The youngest Girl Scout level — girls in light blue vest or tunic with multicoloured daisy petals attached. Very young girls age 5-6.`,[`Daisy Scout`]),p(`Girl Scout Brownie`,`Brownie (Girl Scouts)`,`Girls in a brown vest with badges and a tan uniform — the second level of Girl Scouts, ages 6-8. Small children in brown uniforms.`,[`Brownie Scout`]),p(`Girl Scout Junior`,`Junior (Girl Scouts)`,`Girls in a green vest covered in merit badges and a khaki uniform — the third level, ages 8-11. Green vest with many coloured patches.`,[`Junior Scout`]),p(`Girl Scout Cadette`,`Cadette (Girl Scouts)`,`Older girls in a green vest with more advanced patches — ages 11-14. More mature look with the same green vest and khaki uniform.`,[`Cadette Scout`]),p(`Girl Scout Senior`,`Senior (Girl Scouts)`,`Teen Girl Scouts ages 14-17 — wearing the green vest with senior-level patches and pins on a khaki or alternative uniform.`,[`Senior Scout`]),p(`Girl Scout Ambassador`,`Ambassador (Girl Scouts)`,`The highest Girl Scout level ages 17-18 — older teens in the green vest with ambassador-level gold pins and the most badges.`,[`Ambassador Scout`]),p(`Green Vest`,`Girl Scouts of the USA`,`The green Girl Scout vest — a plain khaki-green fabric vest covered in patches, merit badges, and pins. The central symbol of membership.`,[`Girl Scout Vest`]),p(`Merit Badge`,`Merit badge`,`A small embroidered circular patch — distinctive symbol stitched in thread on a round background, sewn onto a scout sash or vest.`,[`Badge`]),p(`Sash`,`Sash (clothing)`,`A wide diagonal fabric band worn from shoulder to hip across the body — covered in rows of merit badge patches, pins, and awards.`),p(`Cookie Booth`,`Girl Scout cookie`,`A folding table set up outside a grocery store or public place — stacked cookie boxes, a cash box, and girls in green uniforms with a sign.`,[`Cookie Sale`]),p(`Camping Badge`,`Camping`,`A merit badge featuring a tent, tree, or campfire icon — earned for learning wilderness survival and outdoor camping skills.`,[`Camp Badge`]),p(`Juliette Gordon Low`,`Juliette Gordon Low`,`Historical portraits of the Girl Scout founder — a 19th/early 20th century woman in period dress; her face appears on badges and commemorative items.`),p(`Trefoil Logo`,`Trefoil`,`The three-leaf clover-like trefoil symbol of the Girl Scouts — three profiles in a rounded clover shape, usually in green on a white background.`,[`Girl Scout Logo`]),p(`Gold Award`,`Gold Award (Girl Scouts)`,`A round gold-coloured medallion pin — the highest honour in Girl Scouting, featuring the trefoil logo in gold.`,[`Gold Award`]),p(`Silver Award`,`Silver Award (Girl Scouts)`,`A round silver-coloured trefoil pin — the middle of the three major Girl Scout awards, earned through community service projects.`,[`Silver Award`]),p(`Bronze Award`,`Bronze Award (Girl Scouts)`,`A round bronze/copper-coloured trefoil pin — the first major Girl Scout award, earned through a team service project.`,[`Bronze Award`]),p(`Cookie S'mores`,`S'mores (cookie)`,`A graham-flavoured sandwich cookie with chocolate and marshmallow flavoured filling — evokes the classic campfire treat in cookie form.`,[`S'mores`]),p(`Adventurefuls`,`Adventurefuls`,`A brownie-inspired cookie with caramel-flavoured crème and a hint of sea salt — rectangular chocolate cookies with an indentation on top.`),p(`Raspberry Rally`,`Raspberry Rally (cookie)`,`A thin, crispy cookie dipped in chocolate with a raspberry-flavoured interior — a raspberry version of the Thin Mint style cookie.`),p(`Bandanna`,`Bandana`,`A folded triangular scarf worn at the neck or as a headband — typically in solid colour or paisley print, tied with a slide or knot.`,[`Neckerchief`]),p(`Pinecone`,`Pinecone`,`A dry brown conifer cone with overlapping woody scales — often used in scout crafts; collected on nature hikes and used for bird feeders.`),p(`Sit-Upon`,`Sit-upon`,`A homemade waterproof cushion — plastic bag covers stitched or woven around old newspapers or foam, often circular or square.`,[`Sitz-Upon`]),p(`Camp Song`,`Campfire`,`Girls seated around a glowing campfire in the dark — singing songs like 'Kumbaya' or 'Make New Friends' with linked arms.`,[`Campfire Song`]),p(`Service Project`,`Community service`,`Girls in scout uniforms doing volunteer work — cleaning a park, planting trees, serving at a food bank, or helping in a community garden.`,[`Service Project`])]},{id:`field-trips`,name:`Field Trips`,subject:`Lifestyle`,difficulty:`Easy`,description:`Name the place you might visit with a permission slip.`,items:[p(`Zoo`,`Zoo`,`Animals in enclosures behind fencing or glass — lions, elephants, giraffes, and primates visible; map signs and uniformed staff throughout.`),p(`Science Museum`,`Science museum`,`Large open exhibits with interactive buttons and hands-on demonstrations — pendulums, Tesla coils, model rockets, and school groups gathered around displays.`),p(`Art Museum`,`Art museum`,`Paintings hung on white walls in quiet galleries — benches in the centre, security guards nearby, and framed artworks with small name plaques.`,[`Museum`]),p(`Natural History Museum`,`Natural history museum`,`A large dinosaur skeleton in a grand entrance hall — fossil exhibits, taxidermied animals in dioramas, and ancient artifacts behind glass.`),p(`Aquarium`,`Aquarium`,`Dark corridor with huge lit tanks — sharks and rays gliding overhead in a walk-through tunnel, jellyfish in cylindrical tanks glowing blue.`,[`Public Aquarium`]),p(`Planetarium`,`Planetarium`,`A domed theatre with reclining seats — stars projected onto the curved ceiling by a central projector, creating an artificial night sky.`),p(`Farm`,`Farm`,`A red barn with a silo, fields of crops, chickens and cows — a tractor in the field, a farmhouse, and children petting animals at a petting zone.`),p(`Fire Station`,`Fire station`,`Red fire trucks parked in open bays — firefighters in gear, a brass pole descending through the ceiling, helmets and hoses visible.`,[`Firehouse`]),p(`Police Station`,`Police station`,`A building with police cars parked outside — an officer at a front desk, booking area, evidence locker, and the iconic blue-and-white building.`),p(`State Capitol`,`State capitol building`,`A large neoclassical building with a white or gold dome — columns at the entrance, a state flag flying out front, legislative chambers inside.`,[`Capitol Building`]),p(`National Park`,`National park`,`A wooden entrance sign (like 'Welcome to Yellowstone') — a ranger in a flat-brimmed hat, scenic trails, and wildlife or landscapes behind.`),p(`Historical Site`,`Historic site`,`A heritage marker plaque on a post or building — a preserved building, battlefield, or monument with informational signs and tourists taking photos.`),p(`Shakespeare Theater`,`Theatre`,`A historic theatre with tiered balconies, red velvet curtains, and ornate plasterwork — actors in period costumes on a thrust stage.`),p(`Symphony Hall`,`Concert hall`,`An orchestra on a formal stage — musicians in black formal wear, a conductor raising a baton, tiered seating filled with audience members.`,[`Concert Hall`]),p(`Factory`,`Factory`,`An industrial building with assembly lines and machinery — workers in hard hats, conveyor belts moving products, large robotic arms in the background.`),p(`Newspaper Office`,`Newspaper`,`A busy newsroom — rows of desks with computers, people on phones, a big screen with a map, and the editorial board in a glass-walled office.`),p(`Bakery`,`Bakery`,`A shop with glass cases of bread, pastries, and cakes — flour-dusted bakers in aprons behind the counter, the smell of fresh bread implied.`),p(`Library`,`Library`,`Long rows of bookshelves with a card catalog or computer terminals — a quiet study area, librarians at a desk, and children's picture books in a corner.`),p(`Botanical Garden`,`Botanical garden`,`A glass greenhouse or outdoor garden of rare and tropical plants — labelled specimens, winding paths, water features, and exotic blooms.`,[`Botanical Gardens`]),p(`Recycling Center`,`Recycling center`,`Conveyor belts sorting glass, paper, and plastic — workers in reflective vests at a sorting facility with large bins labelled by material.`,[`Recycling Plant`]),p(`Observatory`,`Observatory`,`A white domed building on a hilltop — the dome open to reveal a massive telescope inside, pointed at the night sky.`),p(`Courthouse`,`Courthouse`,`A formal neoclassical building with columns — a courtroom with a judge's bench, jury box, witness stand, and scales of justice.`),p(`Hospital`,`Hospital`,`A multi-story building with emergency signs, ambulances outside — inside: blue-scrubbed staff, gurneys, IV stands, and beeping monitors.`),p(`Television Studio`,`Television studio`,`A bright soundstage with multiple cameras on dollies — a news desk, colourful set lighting, a floor manager with a headset and clipboard.`,[`TV Studio`]),p(`Post Office`,`Post office`,`A government building with a flag outside — inside: a long counter with postal scales, stamp dispensers, and stacks of flat-rate priority boxes.`),p(`Airport`,`Airport`,`Departure hall with check-in counters, overhead display boards, and security lines — gates, jet bridges, planes visible through large windows.`),p(`Stadium`,`Stadium`,`A large oval arena with tiered seating — a grass or artificial turf field, scoreboards, and a crowd filling the stands in team colours.`),p(`Beach`,`Beach`,`Golden sand beach with ocean waves — swimmers, lifeguard towers, beach umbrellas, and footprints in the wet sand near the waterline.`),p(`Cave`,`Cave`,`A dark underground chamber with stalactites hanging from the ceiling and stalagmites rising from the floor — tour groups with helmets and headlamps.`),p(`Battlefield`,`Battlefield`,`A preserved historic field with cannon monuments, plaques, and informational markers — rolling green hills and a quiet solemnity.`)]},{id:`state-fair`,name:`State Fair`,subject:`Lifestyle`,difficulty:`Easy`,description:`Name the person, item, food, animal, event, or attraction associated with state fairs.`,items:[p(`Ferris Wheel`,`Ferris wheel`,`A giant rotating wheel with gondola cars — passengers visible in the seats, colourful lights at night, towering over the fairgrounds.`),p(`Roller Coaster`,`Roller coaster`,`A looping or wooden-track coaster with screaming passengers in a train of cars — steep drops, loops, and twisted track visible against the sky.`),p(`Corn Dog`,`Corn dog`,`A hot dog on a stick coated in golden-brown cornbread batter — often served with mustard and ketchup at a counter or food cart.`),p(`Funnel Cake`,`Funnel cake`,`A fried pastry in squiggly lattice form — golden-brown deep-fried batter squirted through a funnel, dusted with powdered sugar in a paper boat.`),p(`Deep-Fried Oreos`,`Deep-fried Oreo`,`Oreos coated in batter and deep-fried to golden brown — powdered sugar on top, served in a paper tray at a fair food booth.`,[`Fried Oreos`]),p(`Elephant Ear`,`Elephant ear (pastry)`,`A large flat fried dough sheet — stretched thin and fried to a golden crisp, dusted with cinnamon sugar. Literally the size of a large ear.`,[`Fried Dough`]),p(`Cotton Candy`,`Cotton candy`,`A fluffy cloud of spun sugar on a paper cone or stick — pink, blue, or multicoloured; light and wispy as a cloud.`),p(`Caramel Apple`,`Candy apple`,`An apple on a stick coated in shiny red candy or golden caramel — sometimes rolled in nuts or toppings; the stick protrudes from the top.`,[`Candy Apple`]),p(`Lemonade`,`Lemonade`,`A large clear cup of yellow lemonade — a slice of lemon on the rim, ice cubes, and a straw. Often sold from a bright yellow lemonade cart.`),p(`Turkey Leg`,`Turkey leg`,`A massive smoked turkey leg — a huge cooked drumstick held in two hands; dark smoky skin on a very large piece of meat.`,[`Smoked Turkey Leg`]),p(`Deep-Fried Butter`,`Deep-fried butter`,`Butter coated in dough and deep-fried to golden — a decadent state fair novelty; the butter melts inside a crispy fried shell.`),p(`Pie Contest`,`Pie baking`,`A table of assorted pies with ribbons — first, second, and third place ribbons on baked pies at a county fair judging table.`,[`Pie Competition`]),p(`Blue Ribbon`,`Blue ribbon award`,`A blue silk rosette ribbon — the first-place award at fairs and exhibitions, pinned to an animal, produce, or baked good.`,[`Blue Ribbon Award`]),p(`Livestock Show`,`Livestock`,`Children or adults leading cows, sheep, or pigs by halters in a show ring — a judge walking alongside evaluating the animals.`,[`Livestock Exhibition`]),p(`4-H`,`4-H`,`The four-leaf clover 4-H logo with H on each leaf — young farmers and students in 4-H shirts showing animals or projects at a fair.`),p(`Rodeo`,`Rodeo`,`A cowboy on a bucking bronco or bull — one hand raised, the other gripping a rope; dusty arena, cowboy hat, wranglers watching from the fence.`),p(`Demolition Derby`,`Demolition derby`,`Battered, smashed cars slamming into each other in a dirt arena — colourfully spray-painted cars with dents, crumpled hoods, and steam rising.`),p(`Tractor Pull`,`Tractor pulling`,`A large farm tractor pulling a weighted sled down a dirt track — front wheels lifting as it strains against increasing resistance.`,[`Tractor Pulling`]),p(`Midway`,`Midway (fair)`,`A crowded lane of carnival game booths — stuffed animal prizes hanging above, barkers calling out, balloon darts, ring toss, and milk bottle throw.`,[`Carnival Midway`]),p(`Ring Toss`,`Ring toss`,`A carnival game — a cluster of glass bottles or pegs; a player tossing a plastic ring hoping to land it around a bottle neck.`),p(`Duck Pond`,`Duck pond game`,`Small yellow rubber ducks floating in a shallow pool — children pick up a duck to reveal a prize number on the bottom.`,[`Rubber Duck Game`]),p(`Dunk Tank`,`Dunk tank`,`A clear plexiglass tank of water with a person sitting on a platform — a target on the side; hitting it collapses the seat and dunks them.`),p(`Petting Zoo`,`Petting zoo`,`A fenced enclosure with baby goats, sheep, pigs, and rabbits — children leaning over the fence to pet the gentle animals.`),p(`Pig Race`,`Pig racing`,`Small pigs wearing tiny numbered vests running around a short oval track — spectators cheering at the railing of a miniature racing course.`,[`Pig Racing`]),p(`Square Dance`,`Square dance`,`Couples in Western attire doing a do-si-do — women in circle skirts, men in cowboy hats and boots; a caller shouting directions.`),p(`Talent Show`,`Talent show`,`A small stage with a microphone — performers singing, dancing, or doing a magic act in front of a row of seated judges and an audience.`),p(`Biggest Pumpkin`,`Pumpkin`,`An enormous orange pumpkin on a scale — far larger than normal, requiring a flatbed or forklift to move; a blue ribbon attached.`,[`Giant Pumpkin`]),p(`Carnival Game`,`Carnival game`,`A game booth with stuffed animal prizes — a skee-ball lane, milk bottle stacks, or a shooting gallery with a attendant and an overstuffed prize wall.`),p(`Lumberjack Competition`,`Logrolling`,`Lumberjacks in flannel shirts competing — log rolling on water, tree climbing, axe throwing, or crosscut sawing a log at speed.`,[`Log Rolling`]),p(`Butter Sculpture`,`Butter sculpture`,`A life-size or large sculpture carved entirely from yellow butter — a cow, a person, or scene created with incredible detail from a dairy product.`,[`Butter Carving`])]},{id:`retirement-hobbies`,name:`Retirement Hobbies`,subject:`Lifestyle`,difficulty:`Easy`,description:`Name these hobbies and other activities associated with retirement.`,items:[p(`Golf`,`Golf`,`A golfer in a polo shirt and cap addressing a ball on a fairway — a bag of clubs on a cart, green flag in the distance on a well-manicured course.`),p(`Birdwatching`,`Birdwatching`,`A person with binoculars raised to their eyes — a field guide in hand, standing in a marsh or woodland in quiet, still concentration.`,[`Bird Watching`]),p(`Gardening`,`Gardening`,`A person kneeling in a flower bed wearing gloves — hand trowel, watering can, and rows of colourful plants, mulched soil beds.`),p(`Knitting`,`Knitting`,`Two long needles with yarn looped between them — a person's hands working the yarn into a growing piece of fabric. Yarn in a basket nearby.`),p(`Quilting`,`Quilting`,`A patchwork quilt spread on a frame — colourful fabric squares sewn in geometric patterns, needle and thread visible; intricate needlework.`),p(`Woodworking`,`Woodworking`,`A workshop with a lathe, hand plane, or chisel — wood shavings on the floor, a craftsperson sanding or chiselling a wooden piece.`),p(`Fishing`,`Fishing`,`A person in a folding chair on a dock or riverbank — fishing rod line in calm water, a tackle box beside them, and a serene quiet scene.`,[`Angling`]),p(`RV Camping`,`Recreational vehicle`,`A large motorhome or travel trailer parked at a campsite — slides extended, awning out, camp chairs set up outside, forest or mountain backdrop.`,[`RV`,`Motorhome`]),p(`Cruising`,`Cruise ship`,`A massive ocean liner — white hull, multiple decks with lifeboats, a lido deck with a pool, and a wake behind the ship on a blue sea.`,[`Cruise`]),p(`Pickleball`,`Pickleball`,`A court similar to a small tennis court — players with solid paddle rackets hitting a plastic wiffle-like ball over a low net.`),p(`Bocce Ball`,`Bocce`,`Coloured metal balls rolled on a gravel or grass court — trying to land closest to the small white target ball (pallino) at one end.`,[`Bocce`]),p(`Shuffleboard`,`Shuffleboard`,`A long narro ng`,`Boxing`,`Two fighters in a ring wearing boxing gloves and boxing trunks — throwing punches (jab, cross, hook, uppercut) in a leather-gloved match.`,[`Kickboxing`]),p(`Wrestling`,`Wrestling`,`Two athletes in singlets grappling on a mat — trying to pin each other's shoulders or score points with takedowns and reversals.`),p(`Aikido`,`Aikido`,`A flowing Japanese martial art — practitioners in a white gi redirect an attacker's energy into throws and wrist locks. Very circular, dance-like movements.`),p(`Capoeira`,`Capoeira`,`Brazilian martial art that looks like dance — acrobatic kicks and cartwheels performed to Berimbau music in a roda (circle). Very fluid and rhythmic.`),p(`Krav Maga`,`Krav Maga`,`Israeli self-defence system — practitioners in workout clothes using aggressive, practical techniques. Focus pads, training with partners, very street-fight oriented.`),p(`Sambo`,`Sambo (martial art)`,`Russian combat sport combining judo-style throws with wrestling — practitioners in a blue or red jacket (kurtka) and shorts on a mat.`),p(`Hapkido`,`Hapkido`,`Korean martial art combining joint locks, throws, and kicks — practitioners in white gi applying wrist locks or performing spinning kicks.`),p(`Ninjutsu`,`Ninjutsu`,`Ninja martial art — practitioners often in all-black outfit (shinobi shōzoku) with weapons like shuriken, sword, and black mask.`),p(`Sumo`,`Sumo`,`Two very large wrestlers in a minimal cloth belt (mawashi) — trying to force the other out of a clay ring (dohyo) or to the ground. Very large, powerful builds.`),p(`Gi`,`Gi (uniform)`,`A thick white cotton uniform with a jacket, pants, and a coloured belt — standard in karate, judo, and BJJ. The jacket wraps left over right.`,[`Kimono`]),p(`Black Belt`,`Black belt (martial arts)`,`A thick black fabric belt tied in a knot around a white gi — represents advanced mastery of a martial art. Usually with Japanese kanji embroidered.`),p(`Nunchaku`,`Nunchaku`,`Two short wooden or metal sticks connected by a chain nd fingerless gloves in an octagon-shaped cage, combining striking and ground-grappling techniques.`,[`Mixed Martial Arts`]),p(`UFC`,`Ultimate Fighting Championship`,`The UFC octagon — an eight-sided chain-link fence cage with padded canvas floor and colourful sponsor logos; fighters in shorts and gloves.`,[`UFC`])]},{id:`paralympic-events`,name:`Paralympic Events`,subject:`Sports`,difficulty:`Hard`,description:`Name the Paralympic event you see.`,items:[p(`Wheelchair Basketball`,`Wheelchair basketball`,`Athletes in sport wheelchairs with smaller turning wheels racing across a basketball court — dribbling and shooting from a seated position.`,[`Para Basketball`]),p(`Wheelchair Racing`,`Wheelchair racing`,`Athletes in low streamlined racing wheelchairs — gloved hands on small push rings, a three-wheel design with a small front caster.`,[`Para Racing`]),p(`Sitting Volleyball`,`Sitting volleyball`,`Six players per side seated on a court floor — a lower net, players sliding on their hands to reach the ball.`,[`Para Volleyball`]),p(`Boccia`,`Boccia`,`Athletes throwing or rolling coloured leather balls close to a white target ball (jack) — precision sport often played from a wheelchair.`,[`Bocce`]),p(`Goalball`,`Goalball`,`Players wearing blackout eyeshades on a court — diving to block or throwing a bell-embedded ball toward the opponent's goal by sound.`),p(`Para Swimming`,`Paralympic swimming`,`Swimmers with various physical disabilities competing in a pool — some with one arm, prosthetic legs removed, or swimming with adapted stroke techniques.`,[`Para Swimming`]),p(`Para Athletics`,`Paralympic athletics`,`Athletes with amputations, visual impairments, or cerebral palsy racing on a track — prosthetic blades visible on sprinters, guide runners alongside.`,[`Track and Field`]),p(`Wheelchair Tennis`,`Wheelchair tennis`,`Two players in sport wheelchairs rallying on a standard tennis court — allowed two bounces; rackets held the same as able-bodied tennis.`),p(`Blind Soccer`,`Blind football`,`Players wearing eyeshades chasing a ball with a bell inside — a partially sighted goalkeeper, a guide behind the goal calling instructions.`,[`Blind Football`]),p(`Para Archery`,`Archery at the Summer Paralympics`,`An archer in a wheelchair drawing a bow — compound or recurve, shooting at a target; feet or mouth release adaptations visible.`,[`Wheelchair Archery`]),p(`Wheelchair Fencing`,`Wheelchair fencing`,`Two fencers in wheelchairs facing each other on a raised platform — their chairs locked to the floor, upper-body sword fighting only.`),p(`Para Rowing`,`Rowing at the Summer Paralympics`,`Athletes in adaptive rowing shells — some with fixed seats for para athletes who only use their arms and trunk to row.`,[`Adaptive Rowing`]),p(`Para Cycling`,`Cycling at the Summer Paralympics`,`Handbikes, tandem bicycles with a sighted guide, or recumbent trikes — athletes competing on a velodrome track or open road.`,[`Hand Cycling`]),p(`Para Equestrian`,`Equestrian at the Summer Paralympics`,`A rider with a disability on a horse in dressage — some without legs or with arm adaptations, performing elegant dressage movements.`,[`Para Dressage`]),p(`Para Shooting`,`Shooting at the Summer Paralympics`,`A shooter in a wheelchair or prone on a mat — shooting rifle or pistol at a target; adaptations for arm or hand disabilities.`,[`Para Shooting`]),p(`Para Judo`,`Judo at the Summer Paralympics`,`Visually impaired judoka in gi — they grip each other before the match begins; full judo throws on a mat.`,[`Blind Judo`]),p(`Para Table Tennis`,`Table tennis at the Summer Paralympics`,`A wheelchair user playing table tennis — paddle held from a chair, reaching to return shots across a standard-height table.`,[`Para Ping Pong`]),p(`Para Weightlifting`,`Powerlifting at the Summer Paralympics`,`A para powerlifter lying on a horizontal bench — pressing a heavy barbell from the chest, legs at rest or strapped down.`,[`Para Powerlifting`]),p(`Sledge Hockey`,`Para ice hockey`  pitches and bats — seen in Los Angeles Dodgers blue and white, or Angels red and white. #17.`,[`Ohtani`]),p(`Aaron Judge`,`Aaron Judge`,`An enormous outfielder (6'7", 280 lbs) in New York Yankees pinstripes — towering above most players, with a calm, focused expression. #99.`,[`Judge`]),p(`Mookie Betts`,`Mookie Betts`,`A compact, athletic outfielder in Dodger blue — short stature but exceptional range. Often seen making diving catches or celebrating with teammates. #50.`,[`Betts`]),p(`Freddie Freeman`,`Freddie Freeman`,`First baseman in Dodger blue — a tall, left-handed hitter with a smooth, powerful swing. Dark complexion, friendly face. Often seen with #5 jersey.`,[`Freeman`]),p(`Mike Trout`,`Mike Trout`,`Angels outfielder in red and white (#27) — very athletic build with a round, clean-shaven face. Often seen making leaping catches against the outfield wall.`,[`Trout`]),p(`Julio Rodríguez`,`Julio Rodríguez (baseball)`,`Young Dominican outfielder in Seattle Mariners teal and navy (#44) — athletic, energetic, with a wide smile and exuberant personality after big hits.`,[`Julio Rodriguez`]),p(`Ronald Acuña Jr.`,`Ronald Acuña Jr.`,`Atlanta Braves outfielder in red and navy (#13) — lean and powerful, known for his speed and hitting ability. Venezuelan; energetic, stylish on the basepaths.`,[`Acuna`]),p(`Juan Soto`,`Juan Soto (baseball)`,`Known for his unique batting stance — a wide sway and waggling the bat while staring down pitchers. Dominican; in Yankees pinstripes or Washington/San Diego uniforms.`,[`Soto`]),p(`José Altuve`,`José Altuve`,`The shortest MLB star at 5'6" — a compact Venezuelan second baseman for the Houston Astros in orange and navy. #27; often compared to much taller teammates.`,[`Altuve`]),p(`Trea Turner`,`Trea Turner`,`Philadelphia Phillies shortstop in red and white (#7) — known for blazing speed on the basepaths and a smooth defensive glide. Athletic, lean build.`,[`Turner`]),p(`Nolan Arenado`,`Nolan Arenado`,`Third baseman known for exceptiona
